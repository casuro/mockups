<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack UI Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --rail: #2c0b2d;
    --side: #3f0e40;
    --side-hover: #350d36;
    --side-text: #d1c6d2;
    --side-muted: #a78fa8;
    --active: #1164a3;
    --top: #350d36;
    --bg: #ffffff;
    --text: #1d1c1d;
    --muted: #616061;
    --line: #e2e2e2;
    --hover: #f8f8f8;
    --link: #1264a3;
    --mention-bg: #fff4d4;
    --mention-text: #1264a3;
    --green: #2bac76;
    --red: #e01e5a;
    --send: #007a5a;
    --react-bg: #f2f2f2;
    --react-mine: #e8f5fa;
    --react-mine-line: #1d9bd1;
    --code-bg: #f8f8f8;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rail: #120812; --side: #19171d; --side-hover: #27242c; --side-text: #d1d2d3; --side-muted: #9a9b9e;
      --top: #121016; --bg: #1a1d21; --text: #d1d2d3; --muted: #9a9b9e; --line: #35373b; --hover: #222529;
      --link: #1d9bd1; --mention-bg: #3d3524; --mention-text: #1d9bd1; --react-bg: #2b2e33; --react-mine: #1c3a4a;
      --code-bg: #222529;
    }
  }
  :root[data-theme="dark"] {
    --rail: #120812; --side: #19171d; --side-hover: #27242c; --side-text: #d1d2d3; --side-muted: #9a9b9e;
    --top: #121016; --bg: #1a1d21; --text: #d1d2d3; --muted: #9a9b9e; --line: #35373b; --hover: #222529;
    --link: #1d9bd1; --mention-bg: #3d3524; --mention-text: #1d9bd1; --react-bg: #2b2e33; --react-mine: #1c3a4a;
    --code-bg: #222529;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Lato", -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.46668;
    color: var(--text); background: var(--top);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 16px; height: 16px; flex: none; }

  /* ---------- App frame ---------- */
  .app { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
  .topbar {
    display: grid; grid-template-columns: 1fr minmax(240px, 720px) 1fr; align-items: center;
    padding: 0 12px; background: var(--top); color: #fff; gap: 12px;
  }
  .topbar .nav { display: flex; gap: 4px; justify-self: end; opacity: .8; }
  .topbar .nav button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .topbar .nav button:hover { background: rgba(255,255,255,.15); }
  .search {
    height: 26px; border-radius: 6px; background: rgba(255,255,255,.2); display: flex; align-items: center;
    gap: 8px; padding: 0 10px; font-size: 13px; color: rgba(255,255,255,.85);
  }
  .search:hover { background: rgba(255,255,255,.28); }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; }
  .search input::placeholder { color: rgba(255,255,255,.8); }
  .topbar .right { justify-self: end; display: flex; align-items: center; gap: 10px; }
  .topbar .help { opacity: .8; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; }
  .topbar .help:hover { background: rgba(255,255,255,.15); }

  .body { display: grid; grid-template-columns: 70px 260px 1fr; min-height: 0; background: var(--top); }
  .body.thread-open { grid-template-columns: 70px 260px 1fr 380px; }

  /* ---------- Workspace rail ---------- */
  .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 10px 0 14px; gap: 14px; }
  .ws {
    width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
    font-weight: 900; font-size: 15px; color: #fff; position: relative;
  }
  .ws.current { background: linear-gradient(135deg,#e8a33d,#e01e5a); box-shadow: 0 0 0 3px var(--rail), 0 0 0 5px #fff; }
  .ws.other { background: #1264a3; opacity: .75; }
  .ws.other:hover { opacity: 1; }
  .ws.add { background: rgba(255,255,255,.12); font-weight: 400; font-size: 22px; }
  .rail-nav { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .rail-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; font-size: 11px; font-weight: 700; }
  .rail-btn span.ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; }
  .rail-btn.active span.ico, .rail-btn:hover span.ico { background: rgba(255,255,255,.2); }
  .rail-btn svg { width: 20px; height: 20px; }
  .rail .spacer { flex: 1; }
  .me { position: relative; }
  .me .av { width: 36px; height: 36px; border-radius: 9px; }
  .presence { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 2.5px solid var(--rail); }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--side); color: var(--side-text); display: flex; flex-direction: column; min-height: 0;
    border-radius: 8px 0 0 8px; margin-top: 0;
  }
  .side-head { height: 50px; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.1); }
  .side-head h1 { font-size: 18px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 4px; }
  .compose { width: 34px; height: 34px; border-radius: 8px; background: #fff; color: var(--side); display: grid; place-items: center; }
  .compose svg { width: 18px; height: 18px; }
  .side-scroll { overflow-y: auto; padding: 10px 8px 16px; flex: 1; }
  .side-scroll::-webkit-scrollbar { width: 8px; }
  .side-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
  .item {
    display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 16px; border-radius: 6px;
    width: 100%; text-align: left; font-size: 15px; color: var(--side-text); white-space: nowrap;
  }
  .item:hover { background: rgba(255,255,255,.08); }
  .item.active { background: var(--active); color: #fff; }
  .item.unread { color: #fff; font-weight: 900; }
  .item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item .hash { width: 16px; text-align: center; opacity: .85; font-weight: 400; }
  .badge { background: var(--red); color: #fff; font-size: 12px; font-weight: 700; border-radius: 9px; padding: 0 7px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; }
  .section { margin-top: 18px; }
  .sec-title { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; font-size: 15px; color: var(--side-muted); width: 100%; text-align: left; border-radius: 6px; }
  .sec-title:hover { background: rgba(255,255,255,.08); }
  .sec-title svg { width: 12px; height: 12px; transition: transform .15s; }
  .section.collapsed .sec-title svg { transform: rotate(-90deg); }
  .section.collapsed .sec-items .item:not(.active):not(.unread) { display: none; }
  .dm-av { width: 20px; height: 20px; border-radius: 4px; position: relative; flex: none; }
  .dm-av img, .dm-av .av { width: 20px; height: 20px; border-radius: 4px; }
  .dm-av .dot { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--side); background: transparent; box-shadow: inset 0 0 0 1.5px var(--side-muted); }
  .dm-av .dot.on { background: var(--green); box-shadow: none; }
  .item.active .dm-av .dot { border-color: var(--active); }
  .add-row { color: var(--side-muted); }
  .add-row .plus { width: 20px; height: 20px; border-radius: 4px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 15px; }

  /* ---------- Avatars ---------- */
  .av { display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 14px; flex: none; }

  /* ---------- Main pane ---------- */
  .main, .thread { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .body:not(.thread-open) .main { border-radius: 0 8px 8px 0; }
  .body { padding: 0 6px 6px 0; }
  .sidebar { border-radius: 8px 0 0 8px; }
  .thread { border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; }
  .thread[hidden] { display: none; }

  .ch-head { height: 50px; padding: 0 16px 0 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex: none; }
  .ch-name { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 4px; padding: 3px 8px; margin-left: -8px; border-radius: 6px; }
  .ch-name:hover { background: var(--hover); }
  .ch-name svg { width: 12px; height: 12px; margin-top: 2px; }
  .ch-topic { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .members { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px 3px 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .members:hover { background: var(--hover); }
  .stack { display: flex; }
  .stack .av { width: 22px; height: 22px; border-radius: 5px; font-size: 10px; border: 2px solid var(--bg); margin-left: -6px; }
  .stack .av:first-child { margin-left: 0; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); flex: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 8px 8px 7px; font-size: 13px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-color: var(--send); }
  .tab:hover { color: var(--text); }
  .tab svg { width: 14px; height: 14px; }

  .bookmarks { display: flex; gap: 4px; padding: 6px 16px; border-bottom: 1px solid var(--line); flex: none; font-size: 13px; color: var(--muted); }
  .bookmarks button { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; }
  .bookmarks button:hover { background: var(--hover); color: var(--text); }
  .bookmarks .fav { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; color: #fff; font-weight: 900; }

  .messages { flex: 1; overflow-y: auto; padding: 8px 0 12px; }
  .messages::-webkit-scrollbar { width: 10px; }
  .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }

  .intro { padding: 32px 20px 16px; }
  .intro h2 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
  .intro p { color: var(--muted); }
  .intro p b { color: var(--link); font-weight: 400; }
  .intro .actions { display: flex; gap: 8px; margin-top: 14px; }
  .pill { border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .pill:hover { background: var(--hover); }

  .divider { position: relative; text-align: center; margin: 16px 0 8px; height: 28px; }
  .divider::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
  .divider span {
    position: sticky; top: 8px; z-index: 2; display: inline-block; background: var(--bg); border: 1px solid var(--line);
    border-radius: 24px; padding: 3px 16px; font-size: 13px; font-weight: 700; line-height: 20px;
  }
  .divider.new::before { border-color: var(--red); }
  .divider.new span { display: none; }
  .divider.new em { position: absolute; right: 16px; top: 5px; background: var(--bg); color: var(--red); font-style: normal; font-size: 13px; font-weight: 700; padding: 0 4px; }

  .msg { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 8px; padding: 8px 20px; }
  .msg.cont { padding-top: 2px; padding-bottom: 2px; }
  .msg:hover { background: var(--hover); }
  .msg.mentioned { background: var(--mention-bg); }
  .msg.mentioned::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #e8a33d; }
  .msg .av { width: 36px; height: 36px; border-radius: 8px; margin-top: 3px; }
  .msg .gutter-time { visibility: hidden; font-size: 12px; color: var(--muted); text-align: right; line-height: 22px; }
  .msg.cont:hover .gutter-time { visibility: visible; }
  .meta { display: flex; align-items: baseline; gap: 8px; }
  .meta .name { font-weight: 900; }
  .meta .name:hover { text-decoration: underline; cursor: pointer; }
  .meta .time { font-size: 12px; color: var(--muted); }
  .meta .time:hover { text-decoration: underline; cursor: pointer; }
  .app-tag { font-size: 10px; font-weight: 700; color: var(--muted); background: var(--react-bg); padding: 0 4px; border-radius: 3px; text-transform: uppercase; letter-spacing: .3px; }
  .status-emoji { font-size: 13px; }
  .text { word-wrap: break-word; }
  .text p + p { margin-top: 4px; }
  .text a { color: var(--link); text-decoration: none; }
  .text a:hover { text-decoration: underline; }
  .text code { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 12px; color: var(--red); background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 3px; }
  .text pre { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-top: 4px; white-space: pre-wrap; line-height: 1.5; }
  .text blockquote { border-left: 4px solid var(--line); padding-left: 12px; color: var(--text); margin-top: 4px; }
  .text ul { margin: 4px 0 0 22px; }
  .mention { color: var(--mention-text); background: rgba(29,155,209,.1); border-radius: 3px; padding: 0 2px; font-weight: 400; cursor: pointer; }
  .mention.me { background: #f2c744; color: #1d1c1d; }
  .edited { font-size: 12px; color: var(--muted); }

  .attach { margin-top: 6px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-width: 420px; background: var(--bg); }
  .attach .fi { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 12px; flex: none; }
  .attach b { display: block; font-size: 15px; }
  .attach small { color: var(--muted); font-size: 13px; }
  .unfurl { margin-top: 6px; border-left: 4px solid var(--line); padding: 2px 0 2px 12px; max-width: 520px; }
  .unfurl .site { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .unfurl .site i { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font-style: normal; font-size: 10px; color: #fff; font-weight: 900; }
  .unfurl a { font-weight: 700; color: var(--link); text-decoration: none; }
  .unfurl p { font-size: 15px; }
  .chart { margin-top: 8px; height: 150px; border-radius: 8px; border: 1px solid var(--line); padding: 12px; display: flex; align-items: flex-end; gap: 6px; max-width: 420px; background: var(--bg); }
  .chart div { flex: 1; background: linear-gradient(to top, #2bac76, #36c5f0); border-radius: 3px 3px 0 0; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .bot-card { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-width: 480px; }
  .bot-card .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .bot-card .row span:first-child { color: var(--muted); }
  .bot-card .btns { display: flex; gap: 8px; margin-top: 10px; }
  .bot-card .btns button { border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
  .bot-card .btns button.primary { background: var(--send); color: #fff; border-color: var(--send); }
  .bot-card .btns button:hover { filter: brightness(.95); }
  .ok { color: var(--green); font-weight: 700; }

  .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .react {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: 12px;
    background: var(--react-bg); border: 1px solid transparent; font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .react .e { font-size: 14px; }
  .react:hover { border-color: var(--muted); background: var(--bg); }
  .react.mine { background: var(--react-mine); border-color: var(--react-mine-line); color: var(--link); }
  .react.add { opacity: 0; width: 32px; justify-content: center; }
  .msg:hover .react.add { opacity: 1; }
  .react.pop { animation: pop .25s ease; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  .replies { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 4px; margin-left: -4px; border: 1px solid transparent; border-radius: 6px; max-width: 520px; font-size: 13px; width: 100%; text-align: left; }
  .replies:hover { background: var(--bg); border-color: var(--line); }
  .replies .stack .av { width: 24px; height: 24px; border-radius: 5px; font-size: 10px; margin-top: 0; border-color: transparent; margin-left: 2px; }
  .replies b { color: var(--link); white-space: nowrap; }
  .replies .last { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .replies .view { color: var(--muted); display: none; margin-left: auto; }
  .replies:hover .last { display: none; }
  .replies:hover .view { display: inline; }

  .hover-bar {
    position: absolute; right: 20px; top: -16px; display: none; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 2px; z-index: 3;
  }
  .msg:hover .hover-bar { display: flex; }
  .hover-bar button { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-size: 16px; }
  .hover-bar button:hover { background: var(--hover); color: var(--text); }
  .hover-bar .sep { width: 1px; background: var(--line); margin: 6px 2px; }

  /* ---------- Composer ---------- */
  .composer-wrap { padding: 0 20px 18px; flex: none; }
  .composer { border: 1px solid #bbbabb; border-radius: 8px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: #868686; box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06); }
  .fmt { display: flex; gap: 2px; padding: 4px 6px; background: var(--hover); border-radius: 8px 8px 0 0; }
  .fmt button { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); }
  .fmt button:hover { background: var(--line); color: var(--text); }
  .fmt .sep { width: 1px; background: var(--line); margin: 6px 4px; }
  .composer textarea {
    display: block; width: 100%; border: 0; outline: 0; resize: none; font: inherit; color: var(--text);
    background: transparent; padding: 8px 12px; min-height: 40px; max-height: 240px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .comp-foot { display: flex; align-items: center; padding: 4px 6px 6px; gap: 2px; }
  .comp-foot .icon-btn.circle { border-radius: 50%; background: var(--hover); }
  .comp-foot .grow { flex: 1; }
  .send { display: flex; border-radius: 4px; overflow: hidden; }
  .send button { height: 28px; display: grid; place-items: center; color: var(--muted); }
  .send .go { width: 32px; }
  .send .more { width: 22px; border-left: 1px solid transparent; }
  .composer.ready .send button { background: var(--send); color: #fff; }
  .composer.ready .send .more { border-color: rgba(255,255,255,.3); }
  .hint { font-size: 12px; color: var(--muted); text-align: right; padding-top: 4px; height: 20px; opacity: 0; transition: opacity .15s; }
  .composer-wrap.typing .hint { opacity: 1; }
  .typing-ind { font-size: 12px; color: var(--muted); height: 18px; padding: 0 2px; }
  .typing-ind .dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); margin: 0 1px; animation: bounce 1.2s infinite; }
  .typing-ind .dots span:nth-child(2) { animation-delay: .15s; }
  .typing-ind .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }

  /* ---------- Thread pane ---------- */
  .th-head { height: 50px; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); flex: none; }
  .th-head h3 { font-size: 18px; font-weight: 900; }
  .th-head small { color: var(--muted); font-size: 13px; flex: 1; }
  .th-count { display: flex; align-items: center; gap: 12px; padding: 4px 20px; color: var(--muted); font-size: 13px; }
  .th-count::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .thread .messages { padding-top: 12px; }
  .also { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding: 0 2px 8px; }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(raw) {
  let s = esc(raw);
  s = s.replace(/```([\s\S]+?)```/g, (_, c) => `<pre>${c.replace(/^\n/, "")}</pre>`);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  s = s.replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>");
  s = s.replace(/~([^~\n]+)~/g, "<s>$1</s>");
  s = s.replace(/@(\w+)/g, (m, id) => people[id] ? `<span class="mention${id === ME ? " me" : ""}">@${people[id].name.split(" ")[0]}</span>` : m);
  s = s.replace(/#([a-z][\w-]+)/g, (m, id) => `<a href="#" data-goto="${id}">#${id}</a>`);
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="#">$1</a>');
  return s.split(/\n(?![^<]*<\/pre>)/).map(l => `<p>${l}</p>`).join("");
}

  $("#channelList").innerHTML = Object.entries(channels).map(([id, c]) => {
    const active = current.kind === "channel" && current.id === id;
    return `<button class="item ${active ? "active" : ""} ${c.unread && !active ? "unread" : ""}" data-ch="${id}" style="${c.muted ? "opacity:.55" : ""}">
      <span class="hash">#</span><span class="lbl">${id}</span>${c.unread && !active && c.mention ? `<span class="badge">${c.mention}</span>` : ""}</button>`;
  }).join("");
  $("#dmList").innerHTML = [ME, ...Object.keys(dms)].map(id => {
    const p = people[id], active = current.kind === "dm" && current.id === id, d = dms[id];
    const unread = d && d.unread && !active;
    return `<button class="item ${active ? "active" : ""} ${unread ? "unread" : ""}" data-dm="${id}">
      <span class="dm-av">${avatar(id)}<span class="dot ${p.online ? "on" : ""}"></span></span>
      <span class="lbl">${p.name}${id === ME ? ' <span style="opacity:.6;font-weight:400">you</span>' : ""}</span>${p.status ? `<span style="font-size:13px">${p.status}</span>` : ""}${unread ? `<span class="badge">${d.unread}</span>` : ""}</button>`;
  }).join("");
}

function msgHTML(m, prev, inThread = false) {
  const p = people[m.who];
  const cont = m.cont !== false && prev && prev.who === m.who && !prev.day && !prev.newline && !m.card && !p.bot;
  const reacts = m.reactions.length ? `<div class="reactions">${m.reactions.map((r, i) =>
    `<button class="react ${r.mine ? "mine" : ""}" data-react="${m.id}:${i}"><span class="e">${r.e}</span>${r.n}</button>`).join("")}
    <button class="react add" data-add="${m.id}" aria-label="Add reaction">😀<sup style="font-size:9px">+</sup></button></div>` : "";
  let extra = "";
  if (m.card) extra += `<div class="bot-card"><div style="font-weight:700;margin-bottom:6px">${fmt(m.card.title)}</div>${m.card.rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join("")}<div class="btns">${m.card.btns.map((b, i) => `<button class="${i ? "" : "primary"}" data-toast="${b}">${b}</button>`).join("")}</div></div>`;
  if (m.chart) { const mx = Math.max(...m.chart); extra += `<div class="chart">${m.chart.map((v, i) => `<div style="height:${v / mx * 100}%;animation-delay:${i * 40}ms"></div>`).join("")}</div>`; }
  if (m.file) extra += `<div class="attach"><div class="fi" style="background:${m.file.color}">${m.file.ext}</div><div><b>${m.file.name}</b><small>${m.file.meta}</small></div></div>`;
  if (m.unfurl) extra += `<div class="unfurl"><div class="site"><i style="background:${m.unfurl.color}">${m.unfurl.site[0]}</i><b>${m.unfurl.site}</b></div><a href="#">${m.unfurl.title}</a><p style="color:var(--muted);font-size:13px">${m.unfurl.body}</p></div>`;
  const replies = !inThread && m.replies.length ? (() => {
    const who = [...new Set(m.replies.map(r => r.who))].slice(0, 3);
    return `<button class="replies" data-thread="${m.id}"><span class="stack">${who.map(w => avatar(w)).join("")}</span><b>${m.replies.length} ${m.replies.length === 1 ? "reply" : "replies"}</b><span class="last">Last reply today at ${m.replies.at(-1).time}</span><span class="view">View thread ›</span></button>`;
  })() : "";
  const bar = `<div class="hover-bar"><button data-quick="${m.id}:✅" title="Completed">✅</button><button data-quick="${m.id}:👀" title="Taking a look">👀</button><button data-quick="${m.id}:🙌" title="Nice">🙌</button><span class="sep"></span><button data-add="${m.id}" title="Add reaction">😀</button>${inThread ? "" : `<button data-thread="${m.id}" title="Reply in thread"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h12v9H8l-4 3z"/></svg></button>`}<button data-toast="Saved for later" title="Save for later"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8v14l-4-3-4 3z"/></svg></button><button title="More"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4.5" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="15.5" r="1.4"/></svg></button></div>`;
  const head = cont ? `<div class="gutter-time">${m.time.replace(/ [AP]M/, "")}</div>` : avatar(m.who);
  const meta = cont ? "" : `<div class="meta"><span class="name">${p.name}</span>${p.bot ? '<span class="app-tag">App</span>' : ""}${p.status ? `<span class="status-emoji">${p.status}</span>` : ""}<span class="time">${m.time}</span></div>`;
  return `<div class="msg ${cont ? "cont" : ""} ${m.mentioned ? "mentioned" : ""} ${m.fresh ? "new-msg" : ""}" data-id="${m.id}">
    ${bar}${head}<div>${meta}${m.text ? `<div class="text">${fmt(m.text)}</div>` : ""}${extra}${reacts}${replies}</div></div>`;
}

function renderList(list, inThread = false) {
  let html = "", prev = null;
  for (const m of list) {
    if (m.day) html += `<div class="divider"><span>${m.day}</span></div>`;
    else if (m.newline) html += `<div class="divider new"><em>New</em></div>`;
    else html += msgHTML(m, prev, inThread);
    prev = m;
  }
  return html;
}

function renderMain(scroll = true) {
  const c = convo();
  const isCh = current.kind === "channel";
  $("#chName").innerHTML = isCh
    ? `<span style="font-weight:400;opacity:.8">#</span>${current.id}<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 7l5 6 5-6z"/></svg>`
    : `<span class="dm-av" style="width:24px;height:24px;margin-right:4px">${avatar(current.id).replace('class="av"', 'class="av" style="width:24px;height:24px;border-radius:5px;font-size:11px;background:' + people[current.id].color + '"')}</span>${people[current.id].name}<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 7l5 6 5-6z"/></svg>`;
  $("#chTopic").innerHTML = isCh ? fmt(c.topic).replace(/<\/?p>/g, "") : (people[current.id].online ? "Active" : "Away") + (people[current.id].status ? " · " + people[current.id].status : "");
  $("#members").style.display = isCh ? "" : "none";
  $("#bookmarks").style.display = isCh ? "" : "none";
  if (isCh) {
    $("#memberStack").innerHTML = c.members.slice(0, 3).map(id => avatar(id)).join("");
    $("#memberCount").textContent = c.count;
  }
  const intro = isCh
    ? `<div class="intro"><h2># ${current.id}</h2><p>This is the very beginning of the <b>#${current.id}</b> channel. ${esc(c.topic.replace(/@\w+/g, ""))}</p><div class="actions"><button class="pill">✏️ Add description</button><button class="pill">👤 Add coworkers</button></div></div>`
    : `<div class="intro" style="display:flex;gap:14px;align-items:center">${avatar(current.id).replace('class="av"', 'class="av" style="width:72px;height:72px;border-radius:12px;font-size:28px;background:' + people[current.id].color + '"')}<div><h2 style="font-size:22px">${people[current.id].name}</h2><p>This conversation is just between you two. Say hi 👋</p></div></div>`;
  $("#messages").innerHTML = intro + renderList(c.messages);
  $("#input").placeholder = `Message ${label()}`;
  $("#alsoChan").textContent = label();
  $("#thChan").textContent = label();
  if (scroll) requestAnimationFrame(() => { const el = $("#messages"); el.scrollTop = el.scrollHeight; });
  document.title = `${label()} - Casuro - Slack UI Mockup`;
}

function findMsg(id) {
  for (const src of [...Object.values(channels), ...Object.values(dms)])
    for (const m of src.messages) {
      if (m.id === id) return m;
      for (const r of m.replies || []) if (r.id === id) return r;
    }
}

function renderThread(scroll = true) {
  const body = $("#body"), pane = $("#thread");
  if (!openThread) { body.classList.remove("thread-open"); pane.hidden = true; return; }
  body.classList.add("thread-open"); pane.hidden = false;
  const m = findMsg(openThread);
  const n = m.replies.length;
  $("#threadMessages").innerHTML = msgHTML({ ...m, fresh: false }, null, true)
    + (n ? `<div class="th-count">${n} ${n === 1 ? "reply" : "replies"}</div>` : "")
    + renderList(m.replies, true);
  if (scroll) requestAnimationFrame(() => { const el = $("#threadMessages"); el.scrollTop = el.scrollHeight; });
}

function go(kind, id) {
  current = { kind, id };
  const c = convo(); c.unread = 0; c.mention = 0;
  openThread = null;
  $("#body").classList.remove("side-open");
  renderSidebar(); renderMain(); renderThread();
  $("#input").focus();
}

function now() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

const replies = ["On it 👍", "Makes sense to me.", "Let me take a look after standup.", "Love this 🙌", "Can we sync on this in 10?", "Good catch!"];
function simulateReply(target, pushTo, rerender) {
  const pool = current.kind === "dm" ? [current.id] : convo().members.filter(x => people[x].online && x !== ME);
  if (!pool.length) return;
  const who = pool[Math.floor(Math.random() * pool.length)];
  const ind = $("#typing");
  setTimeout(() => {
    ind.innerHTML = `<span class="dots"><span></span><span></span><span></span></span> <b>${people[who].name}</b> is typing...`;
    setTimeout(() => {
      ind.innerHTML = "";
      if (target !== current.id) return;
      pushTo.push({ ...M(who, now(), replies[Math.floor(Math.random() * replies.length)]), fresh: true });
      rerender();
    }, 1600 + Math.random() * 1200);
  }, 700);
}

function send() {
  const inp = $("#input"), text = inp.value.trim();
  if (!text) return;
  const c = convo();
  c.messages = c.messages.filter(m => !m.newline);
  c.messages.forEach(m => (m.mentioned = false));
  c.messages.push({ ...M(ME, now(), text), fresh: true });
  inp.value = ""; autosize(inp); syncReady();
  renderMain();
  const target = current.id;
  if (Math.random() < .8) simulateReply(target, c.messages, () => renderMain());
}

function sendReply() {
  const inp = $("#thInput"), text = inp.value.trim();
  if (!text || !openThread) return;
  const m = findMsg(openThread);
  m.replies.push({ ...M(ME, now(), text), fresh: true });
  inp.value = ""; autosize(inp);
  if ($(".also input").checked) convo().messages.push({ ...M(ME, now(), text), fresh: true });
  renderThread(); renderMain(false);
}

function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 240) + "px"; }
function syncReady() {
  const has = !!$("#input").value.trim();
  $("#composer").classList.toggle("ready", has);
  $("#composerWrap").classList.toggle("typing", has);
}

function toggleReaction(msg, emoji) {
  const r = msg.reactions.find(x => x.e === emoji);
  if (!r) msg.reactions.push(R(emoji, 1, true));
  else if (r.mine) { r.n--; r.mine = false; if (!r.n) msg.reactions.splice(msg.reactions.indexOf(r), 1); }
  else { r.n++; r.mine = true; }
  const idx = msg.reactions.findIndex(x => x.e === emoji);
  renderMain(false); renderThread(false);
  document.querySelectorAll(`[data-react="${msg.id}:${idx}"]`).forEach(el => el.classList.add("pop"));
}

// Emoji picker
const EMOJI = ["👍", "❤️", "😂", "🎉", "🙌", "👀", "🔥", "✅", "🚀", "💯", "🙏", "😅", "🤔", "👏", "😍", "🫡", "☕", "🌮", "🐛", "⭐", "💡", "📌", "🎯", "🥳"];
let pickerTarget = null;
const pop = $("#emojiPop");
pop.innerHTML = EMOJI.map(e => `<button data-emoji="${e}">${e}</button>`).join("");
function openPicker(anchor, target) {
  pickerTarget = target;
  const r = anchor.getBoundingClientRect();
  pop.classList.add("show");
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  pop.style.top = (r.top - h - 6 < 48 ? r.bottom + 6 : r.top - h - 6) + "px";
}

// Events
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, [data-emoji]");
  if (!pop.contains(e.target) && !e.target.closest("[data-add], #emojiBtn")) pop.classList.remove("show");
  if (!t) return;
  const d = t.dataset;
  if (d.ch) go("channel", d.ch);
  else if (d.dm) {
    if (!dms[d.dm]) dms[d.dm] = { messages: [] };
    go("dm", d.dm);
  }
  else if (d.goto) { e.preventDefault(); if (channels[d.goto]) go("channel", d.goto); }
  else if (d.thread) { openThread = +d.thread; renderThread(); $("#thInput").focus(); }
  else if (d.react) { const [id, i] = d.react.split(":"); const m = findMsg(+id); toggleReaction(m, m.reactions[+i].e); }
  else if (d.quick) { const [id, em] = d.quick.split(":"); toggleReaction(findMsg(+id), em); }
  else if (d.add) openPicker(t, +d.add);
  else if (d.emoji) {
    pop.classList.remove("show");
    if (pickerTarget === "composer") { const i = $("#input"); i.value += d.emoji; syncReady(); i.focus(); }
    else toggleReaction(findMsg(pickerTarget), d.emoji);
  }
  else if (d.toast) toast(d.toast === "Rollback" ? "Rollback needs approval from #incidents on-call" : d.toast === "View logs" ? "Opening deploy logs..." : d.toast);
  else if (t.hasAttribute("data-toggle")) t.closest(".section").classList.toggle("collapsed");
  else if (t.tagName === "A" && t.getAttribute("href") === "#") e.preventDefault();
});
$("#emojiBtn").addEventListener("click", e => openPicker(e.currentTarget, "composer"));
$("#closeThread").onclick = () => { openThread = null; renderThread(); };
$("#sendBtn").onclick = send;
$("#thSend").onclick = sendReply;
$("#menuBtn").onclick = () => $("#body").classList.toggle("side-open");
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
for (const [id, fn] of [["#input", send], ["#thInput", sendReply]]) {
  const el = $(id);
  el.addEventListener("input", () => { autosize(el); if (id === "#input") syncReady(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); fn(); } });
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("#search").focus(); }
  if (e.key === "Escape") { pop.classList.remove("show"); if (openThread) { openThread = null; renderThread(); } }
});
$("#search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().replace(/^#/, "").toLowerCase();
  const ch = Object.keys(channels).find(c => c.includes(q));
  const dm = Object.keys(dms).find(p => people[p].name.toLowerCase().includes(q));
  if (ch) go("channel", ch); else if (dm) go("dm", dm); else toast(`No results for "${q}"`);
  e.target.value = ""; e.target.blur();
});

channels.engineering.mention = 1;
renderSidebar(); renderMain();
// Mark engineering as read once opened, but keep the "New" divider visible
channels.engineering.unread = 0;
renderSidebar();
</script>
</body>
</html>
