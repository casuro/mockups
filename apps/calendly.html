<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-2: rgba(26,26,26,.61);
    --line: rgba(26,26,26,.1);
    --blue: #006bff;
    --blue-hover: #0055d4;
    --blue-text: #0060e6;
    --blue-soft: rgba(0,105,255,.065);
    --blue-soft-2: rgba(0,105,255,.15);
    --blue-line: rgba(0,105,255,.5);
    --slot-sel: #666a73;
    --danger: #c84545;
    --shadow: 0 1px 8px 0 rgba(0,0,0,.08);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121417; --surface: #1c1f24; --text: #eef0f3; --text-2: rgba(238,240,243,.62); --line: rgba(238,240,243,.12);
    --blue: #3d8bff; --blue-hover: #6aa6ff; --blue-text: #6aa6ff; --blue-soft: rgba(61,139,255,.12); --blue-soft-2: rgba(61,139,255,.24); --blue-line: rgba(61,139,255,.55);
    --slot-sel: #5a5f69; --danger: #ef7a7a; --shadow: 0 1px 8px 0 rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  .page { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 66px 16px; }
  .card { position: relative; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); display: flex; width: 100%; max-width: 1060px; min-height: 700px; overflow: hidden; }
  .left { flex: 0 0 340px; border-right: 1px solid var(--line); padding: 25px 24px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 16px; }
  .host { color: var(--text-2); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .ev { font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 24px; }
  .meta { display: flex; gap: 10px; align-items: flex-start; color: var(--text-2); font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.3; }
  .meta svg { flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px; }
  .desc { font-size: 16px; line-height: 1.5; margin-top: 4px; }
  .right { flex: 1; min-width: 0; padding: 28px 32px 32px; }
  h2 { font-size: 20px; font-weight: 700; margin-bottom: 26px; }
  .picker { display: flex; gap: 24px; }
  .cal { flex: 1; min-width: 0; max-width: 440px; }
  .month { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 22px; }
  .month .t { font-size: 16px; min-width: 150px; text-align: center; }
  .nav { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--blue-text); background: var(--blue-soft); }
  .nav:hover { background: var(--blue-soft-2); }
  .nav:disabled { background: none; color: var(--text-2); opacity: .5; cursor: default; }
  .nav svg { width: 16px; height: 16px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
  .dow { font-size: 12px; text-transform: uppercase; padding-bottom: 12px; color: var(--text); }
  .day { position: relative; justify-self: center; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; color: var(--text); cursor: default; }
  .day.av { background: var(--blue-soft); color: var(--blue-text); font-weight: 700; cursor: pointer; }
  .day.av:hover { background: var(--blue-soft-2); }
  .day.sel, .day.sel:hover { background: var(--blue); color: #fff; }
  .day.today::after { content: ""; position: absolute; bottom: 6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
  .day:not(.av) { color: var(--text-2); }
  .tz { margin-top: 34px; }
  .tz .lbl { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .tz-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px 8px 4px; border-radius: 6px; font-size: 14px; }
  .tz-btn:hover { background: var(--blue-soft); }
  .tz-btn svg { width: 16px; height: 16px; }
  .card { max-width: 900px; }
  .card.wide { max-width: 1060px; }
  .card.wide .cal { max-width: 440px; }
  .slots { flex: 0 0 236px; display: flex; flex-direction: column; min-width: 0; }
  .slots .dt { font-size: 16px; margin: 8px 0 22px; height: 24px; line-height: 24px; }
  .slot-list { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 8px; }
  .slot { height: 52px; border: 1px solid var(--blue-line); border-radius: 4px; color: var(--blue-text); font-size: 16px; font-weight: 700; flex-shrink: 0; transition: border-color .1s; }
  .slot:hover { border: 2px solid var(--blue); }
  .slot-pair { display: flex; gap: 8px; height: 52px; flex-shrink: 0; }
  .slot-pair > * { flex: 1; border-radius: 4px; font-size: 16px; font-weight: 700; color: #fff; display: grid; place-items: center; }
  .slot-pair .time { background: var(--slot-sel); }
  .slot-pair .go { background: var(--blue); }
  .slot-pair .go:hover { background: var(--blue-hover); }
  .tz { position: relative; }
  .tz-menu { position: absolute; left: 0; bottom: calc(100% - 22px); z-index: 5; width: 340px; max-width: calc(100vw - 48px); background: var(--surface); border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,.16); padding: 8px 0; }
  .tz-menu .h { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-2); padding: 8px 16px; }
  .tz-opt { display: flex; justify-content: space-between; width: 100%; padding: 10px 16px; text-align: left; font-size: 14px; }
  .tz-opt:hover { background: var(--blue-soft); }
  .tz-opt.on { background: var(--blue); color: #fff; }
  .tz-opt span:last-child { opacity: .75; }
  .cookie { position: absolute; left: 24px; bottom: 24px; font-size: 14px; color: var(--blue-text); }
  .cookie:hover { text-decoration: underline; }
  .ribbon { position: absolute; top: 0; right: 0; width: 104px; height: 104px; overflow: hidden; pointer-events: none; }
  .ribbon a { pointer-events: auto; position: absolute; top: 20px; right: -34px; width: 150px; transform: rotate(45deg); background: #505960; color: #fff; text-align: center; padding: 6px 0 5px; text-decoration: none; line-height: 1.1; box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
  .ribbon .s { display: block; font-size: 8px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; opacity: .85; }
  .ribbon .b { display: block; font-size: 13px; font-weight: 700; }
  .back { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--blue-text); margin-bottom: 20px; }
  .back:hover { background: var(--blue-soft); }
  .back svg { width: 20px; height: 20px; }
  .meta.when { color: var(--text-2); }
  .form { max-width: 480px; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .field input, .field textarea { width: 100%; border: 1px solid #b2b2b2; border-radius: 8px; padding: 12px 14px; font-size: 16px; background: var(--surface); outline: none; }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
  .field input:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .field.err input { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
  .field .msg { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .guests-btn { border: 1px solid var(--blue); color: var(--blue-text); border-radius: 40px; padding: 8px 16px; font-size: 14px; font-weight: 600; margin-bottom: 22px; }
  .guests-btn:hover { background: var(--blue-soft); }
  .hint { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .legal { font-size: 12px; color: var(--text-2); line-height: 1.5; margin: 4px 0 20px; }
  .legal a { color: var(--blue-text); }
  .primary { background: var(--blue); color: #fff; border-radius: 40px; padding: 12px 18px; font-size: 16px; font-weight: 700; }
  .primary:hover { background: var(--blue-hover); }
  .done { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 24px 80px; }
  .done .avatar { margin: 0 auto 20px; }
  .done h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .done h1 svg { width: 24px; height: 24px; }
  .done .sub { font-size: 16px; color: var(--text-2); margin-bottom: 28px; }
  .summary { width: 100%; max-width: 520px; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 24px 24px 4px; }
  .summary .ev { font-size: 20px; margin-bottom: 20px; }
  .again { margin-top: 28px; color: var(--blue-text); font-size: 16px; font-weight: 600; }
  .again:hover { text-decoration: underline; }
  .card.fin { min-height: 0; }
  @media (max-width: 759px) {
    .page { padding: 0; }
    .card, .card.wide { flex-direction: column; max-width: none; min-height: 100vh; border-radius: 0; box-shadow: none; padding-bottom: 56px; }
    .card.fin { min-height: 100vh; }
    .left { flex: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 24px 16px 4px; }
    .ev { font-size: 24px; margin-bottom: 18px; }
    .right { padding: 24px 16px; }
    h2 { margin-bottom: 18px; }
    .picker { flex-direction: column; gap: 28px; }
    .card.wide .cal { max-width: none; }
    .grid { row-gap: 4px; }
    .day { width: 40px; height: 40px; }
    .slots { flex: none; }
    .slot-list { max-height: none; overflow: visible; padding-right: 0; }
    .form { max-width: none; }
    .done { padding: 40px 16px; }
    .cookie { left: 16px; bottom: 20px; }
  }
</style>
</head>
<body>
<div class="page"><div class="card" id="card"></div></div>

const HOST = { name: "Naman Shukla", email: "naman@casuro.com", org: "Casuro" };
const EVENT = { name: "30 Minute Meeting", mins: 30, desc: "A quick call to talk through how Casuro can help your team. Share a bit of context below and I will come prepared." };

const TZ = [
  { id: "America/New_York", label: "Eastern Time - US & Canada", off: 0 },
  { id: "America/Chicago", label: "Central Time - US & Canada", off: -1 },
  { id: "America/Denver", label: "Mountain Time - US & Canada", off: -2 },
  { id: "America/Los_Angeles", label: "Pacific Time - US & Canada", off: -3 },
  { id: "Europe/London", label: "UK, Ireland, Lisbon Time", off: 5 },
  { id: "Asia/Kolkata", label: "India Standard Time", off: 9.5 },
];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
// Weekdays from today on, skipping a few for realism; host hours are 9am-5pm Eastern
const isAvail = d => d >= TODAY && d.getDay() % 6 !== 0 && (d.getDate() * 7) % 11 !== 3;
const slotsFor = d => {
  const out = [];
  for (let m = 9 * 60; m < 17 * 60; m += 30) if ((m / 30 + d.getDate()) % 5 !== 0) out.push(m);
  return out;
};

const state = { step: "calendar", y: TODAY.getFullYear(), m: TODAY.getMonth(), date: null, slot: null, tz: 0, tzOpen: false,
  form: { name: "", email: "", guests: "", notes: "" }, showGuests: false, errors: {} };

const whenText = () => { const d = state.date, s = local(state.slot); return `${fmtMin(s)} - ${fmtMin(s + EVENT.mins)}, ${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
function renderLeft() {
  const details = state.step === "details";
  return `<div class="left">
    ${details ? `<button class="back" data-act="back" aria-label="Back">${IC.back}</button>` : ""}
    <img class="avatar" src="${PHOTOS.naman}" alt="">
    <div class="host">${HOST.name}</div>
    <h1 class="ev">${EVENT.name}</h1>
    <div class="meta">${IC.clock}<span>${EVENT.mins} min</span></div>
    <div class="meta">${meet("l")}<span>Google Meet</span></div>
    ${details ? `<div class="meta when">${IC.cal}<span>${whenText()}</span></div>
    <div class="meta">${IC.globeL}<span>${TZ[state.tz].label}</span></div>` : `<p class="desc">${EVENT.desc}</p>`}
  </div>`;
}
const tzNow = t => new Date().toLocaleTimeString("en-US", { timeZone: t.id, hour: "numeric", minute: "2-digit" }).replace(" ", "").toLowerCase();
function renderCal() {
  const first = new Date(state.y, state.m, 1), n = new Date(state.y, state.m + 1, 0).getDate();
  const atStart = state.y === TODAY.getFullYear() && state.m === TODAY.getMonth();
  let cells = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) cells += "<div></div>";
  for (let i = 1; i <= n; i++) {
    const d = new Date(state.y, state.m, i), av = isAvail(d);
    const cls = ["day", av && "av", state.date && key(d) === key(state.date) && "sel", key(d) === key(TODAY) && "today"].filter(Boolean).join(" ");
    cells += av ? `<button class="${cls}" data-day="${i}" aria-label="${DAYS[d.getDay()]}, ${MONTHS[state.m]} ${i}">${i}</button>` : `<div class="${cls}">${i}</div>`;
  }
  const tz = TZ[state.tz];
  return `<div class="cal">
    <div class="month">
      <button class="nav" data-act="prev" aria-label="Previous month" ${atStart ? "disabled" : ""}>${IC.chevL}</button>
      <div class="t">${MONTHS[state.m]} ${state.y}</div>
      <button class="nav" data-act="next" aria-label="Next month">${IC.chevR}</button>
    </div>
    <div class="grid">${cells}</div>
    <div class="tz"><div class="lbl">Time zone</div>
      ${state.tzOpen ? renderTzMenu() : ""}<button class="tz-btn" data-act="tz" aria-expanded="${state.tzOpen}">${IC.globe}<span>${tz.label} (${tzNow(tz)})</span>${IC.caret}</button>
    </div>
  </div>`;
}
const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 || 12}:${String(mm).padStart(2, "0")}${h < 12 ? "am" : "pm"}`; };
const local = m => m + TZ[state.tz].off * 60;
function renderSlots() {
  const d = state.date;
  return `<div class="slots">
    <div class="dt">${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}</div>
    <div class="slot-list">${slotsFor(d).map(m => m === state.slot
      ? `<div class="slot-pair"><div class="time">${fmtMin(local(m))}</div><button class="go" data-act="confirm">Next</button></div>`
      : `<button class="slot" data-slot="${m}">${fmtMin(local(m))}</button>`).join("")}</div>
  </div>`;
}
function renderTzMenu() {
  return `<div class="tz-menu" role="listbox"><div class="h">Time zone</div>${TZ.map((t, i) =>
    `<button class="tz-opt ${i === state.tz ? "on" : ""}" data-tz="${i}"><span>${t.label}</span><span>${tzNow(t)}</span></button>`).join("")}</div>`;
}
function field(k, label, type, extra = "") {
  const err = state.errors[k];
  const input = type === "textarea"
    ? `<textarea id="f-${k}" data-f="${k}">${esc(state.form[k])}</textarea>`
    : `<input id="f-${k}" type="${type}" data-f="${k}" value="${esc(state.form[k])}" autocomplete="${k === "name" ? "name" : "email"}">`;
  return `<div class="field ${err ? "err" : ""}"><label for="f-${k}">${label}</label>${input}${err ? `<div class="msg">${err}</div>` : ""}${extra}</div>`;
}
function renderDetails() {
  return `<div class="right"><h2>Enter Details</h2><form class="form" novalidate data-form>
    ${field("name", "Name *", "text")}
    ${field("email", "Email *", "email")}
    ${state.showGuests ? field("guests", "Guest Email(s)", "text", `<div class="hint">Notify up to 10 additional guests of the scheduled event.</div>`) : `<button type="button" class="guests-btn" data-act="guests">Add Guests</button>`}
    ${field("notes", "Please share anything that will help prepare for our meeting.", "textarea")}
    <p class="legal">By proceeding, you confirm that you have read and agree to <a href="#" data-act="noop">Calendly's Terms of Use</a> and <a href="#" data-act="noop">Privacy Notice</a>.</p>
    <button type="submit" class="primary">Schedule Event</button>
  </form></div>`;
}
function renderDone() {
  return `<div class="done">
    <img class="avatar" src="${PHOTOS.naman}" alt="">
    <h1>${IC.check}You are scheduled</h1>
    <p class="sub">A calendar invitation has been sent to your email address.</p>
    <div class="summary">
      <div class="ev">${EVENT.name}</div>
      <div class="meta">${IC.user}<span>${HOST.name}</span></div>
      <div class="meta">${IC.cal}<span>${whenText()}</span></div>
      <div class="meta">${IC.globeL}<span>${TZ[state.tz].label}</span></div>
      <div class="meta">${meet("d")}<span>Web conferencing details to follow.</span></div>
    </div>
    <button class="again" data-act="again">Schedule another event</button>
  </div>`;
}
function renderRight() {
  return `<div class="right"><h2>Select a Date &amp; Time</h2><div class="picker">${renderCal()}${state.date ? renderSlots() : ""}</div></div>`;
}
const CHROME = `<a class="cookie" href="#" data-act="cookie">Cookie settings</a>
  <div class="ribbon"><a href="#" data-act="noop"><span class="s">Powered by</span><span class="b">Calendly</span></a></div>`;
function render() {
  const card = $("#card");
  card.className = "card" + (state.date && state.step === "calendar" ? " wide" : "") + (state.step === "done" ? " fin" : "");
  const body = state.step === "done" ? renderDone() : renderLeft() + (state.step === "details" ? renderDetails() : renderRight());
  card.innerHTML = body + CHROME;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-day],[data-act],[data-slot],[data-tz]");
  if (!t) { if (state.tzOpen) { state.tzOpen = false; render(); } return; }
  const a = t.dataset.act;
  if (t.tagName === "A") e.preventDefault();
  if (a !== "tz") state.tzOpen = false;
  if (a === "tz") state.tzOpen = !state.tzOpen;
  else if (t.dataset.tz) state.tz = +t.dataset.tz;
  else if (a === "confirm") { state.step = "details"; state.errors = {}; }
  else if (a === "back") state.step = "calendar";
  else if (a === "guests") { state.showGuests = true; render(); $("#f-guests").focus(); return; }
  else if (a === "again") { Object.assign(state, { step: "calendar", date: null, slot: null, showGuests: false, errors: {}, form: { name: "", email: "", guests: "", notes: "" } }); }
  else if (a === "noop" || a === "cookie") return;
  else if (t.dataset.slot) state.slot = +t.dataset.slot;
  else if (t.dataset.day) { state.date = new Date(state.y, state.m, +t.dataset.day); state.slot = null; }
  else if (a === "prev" || a === "next") { const d = new Date(state.y, state.m + (a === "next" ? 1 : -1), 1); state.y = d.getFullYear(); state.m = d.getMonth(); }
  render();
});
document.addEventListener("input", e => { const k = e.target.dataset.f; if (k) state.form[k] = e.target.value; });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = state.form, errors = {};
  if (!f.name.trim()) errors.name = "Can't be blank";
  if (!f.email.trim()) errors.email = "Can't be blank";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) errors.email = "Invalid email";
  state.errors = errors;
  if (!Object.keys(errors).length) state.step = "done";
  render();
  window.scrollTo(0, 0);
  const firstErr = document.querySelector(".field.err input"); if (firstErr) firstErr.focus();
});
render();
</script>
</body>
</html>
