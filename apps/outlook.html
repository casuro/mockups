<style>
  :root {
    color-scheme: light;
    --canvas: #f0f3f8;
    --surface: #ffffff;
    --surface-2: #fafafa;
    --hover: #f5f5f5;
    --pressed: #e0e0e0;
    --subtle: rgba(0,0,0,.05);
    --text: #242424;
    --text-2: #424242;
    --text-3: #616161;
    --text-4: #707070;
    --stroke: #e0e0e0;
    --stroke-2: #d1d1d1;
    --stroke-3: #ebebeb;
    --brand: #0f6cbd;
    --brand-hover: #115ea3;
    --brand-pressed: #0f548c;
    --brand-fg: #0f6cbd;
    --brand-tint: #ebf3fc;
    --brand-tint-2: #cfe4fa;
    --on-brand: #ffffff;
    --sel: #dcebfb;
    --sel-hover: #cfe4fa;
    --nav-sel: rgba(15,108,189,.1);
    --flag: #c50f1f;
    --flag-row: #fff9e5;
    --flag-row-hover: #fdf3d3;
    --danger: #c50f1f;
    --success: #107c10;
    --warning: #bc4b09;
    --mark: #fff100;
    --shadow2: 0 0 2px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
    --shadow4: 0 0 2px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.14);
    --shadow16: 0 0 2px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.14);
    --shadow28: 0 0 8px rgba(0,0,0,.12), 0 14px 28px rgba(0,0,0,.14);
    --shadow64: 0 0 8px rgba(0,0,0,.12), 0 32px 64px rgba(0,0,0,.14);
    --scrim: rgba(0,0,0,.4);
    --font: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
  }
  /* Light is the default; dark only applies when toggled from Settings */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #1a1a1a; --surface: #292929; --surface-2: #2e2e2e; --hover: #333333; --pressed: #3d3d3d; --subtle: rgba(255,255,255,.06);
    --text: #ffffff; --text-2: #d6d6d6; --text-3: #adadad; --text-4: #999999;
    --stroke: #3d3d3d; --stroke-2: #525252; --stroke-3: #333333;
    --brand: #115ea3; --brand-hover: #0f6cbd; --brand-pressed: #0f548c; --brand-fg: #479ef5; --brand-tint: #082338; --brand-tint-2: #0c3b5e; --on-brand: #ffffff;
    --sel: #1e3a55; --sel-hover: #24476a; --nav-sel: rgba(71,158,245,.16);
    --flag: #f1707b; --flag-row: #332d1c; --flag-row-hover: #3b3421; --danger: #f1707b; --success: #54b054; --warning: #faa06b; --mark: #6b5e00;
    --shadow2: 0 0 2px rgba(0,0,0,.24), 0 1px 2px rgba(0,0,0,.28);
    --shadow4: 0 0 2px rgba(0,0,0,.24), 0 2px 4px rgba(0,0,0,.28);
    --shadow16: 0 0 2px rgba(0,0,0,.24), 0 8px 16px rgba(0,0,0,.28);
    --shadow28: 0 0 8px rgba(0,0,0,.24), 0 14px 28px rgba(0,0,0,.28);
    --shadow64: 0 0 8px rgba(0,0,0,.24), 0 32px 64px rgba(0,0,0,.28);
    --scrim: rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font: 14px/20px var(--font); background: var(--canvas); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: -2px; border-radius: 4px; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: transparent; border: 3px solid transparent; border-radius: 8px; background-clip: padding-box; }
  :hover::-webkit-scrollbar-thumb { background-color: var(--stroke-2); }
  .grow { flex: 1; }

  /* Buttons */
  .ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 4px; color: var(--text-2); position: relative; flex: none; }
  .ib svg { width: 20px; height: 20px; }
  .ib:hover { background: var(--hover); color: var(--text); }
  .ib:active { background: var(--pressed); }
  .ib.sm { width: 28px; height: 28px; }
  .ib.sm svg { width: 18px; height: 18px; }
  .ib.on { color: var(--brand-fg); }
  .btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--stroke-2); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn svg { width: 20px; height: 20px; }
  .btn:hover { background: var(--hover); border-color: var(--stroke-2); }
  .btn:active { background: var(--pressed); }
  .btn.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); }
  .btn.primary:hover { background: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-pressed); }
  .btn.subtle { border-color: transparent; background: transparent; font-weight: 400; }
  .btn.subtle:hover { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .link { color: var(--brand-fg); font-weight: 400; }
  .link:hover { text-decoration: underline; }
  [data-tip] { position: relative; }
  @media (hover: hover) {
    [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap;
      background: var(--surface); color: var(--text); font-size: 12px; font-weight: 400; line-height: 16px; padding: 5px 11px; border-radius: 4px; box-shadow: var(--shadow16);
      pointer-events: none; z-index: 60; animation: tip .15s .5s both;
    }
    .tip-l[data-tip]:hover::after { left: auto; right: 0; transform: none; }
  }
  @keyframes tip { from { opacity: 0; } to { opacity: 1; } }

  /* Avatars */
  .av { width: 32px; height: 32px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-size: 12px; font-weight: 600; letter-spacing: .2px; overflow: hidden; user-select: none; }
  .av.s20 { width: 20px; height: 20px; font-size: 9px; }
  .av.s24 { width: 24px; height: 24px; font-size: 10px; }
  .av.s40 { width: 40px; height: 40px; font-size: 14px; }
  .av.s72 { width: 72px; height: 72px; font-size: 24px; }

  /* Header */
  .app { height: 100dvh; display: flex; flex-direction: column; }
  .top { height: 48px; flex: none; display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; align-items: center; gap: 12px; padding: 0 12px 0 8px; position: relative; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .brand .logo { display: flex; align-items: center; gap: 8px; padding: 0 6px; height: 32px; border-radius: 4px; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .brand .logo svg { width: 24px; height: 24px; }
  #drawerBtn { display: none; }
  .search { position: relative; height: 32px; display: flex; align-items: center; background: var(--surface); border-radius: 4px; border: 1px solid var(--stroke); border-bottom-color: var(--stroke-2); min-width: 0; }
  .search:hover { border-color: var(--stroke-2); border-bottom-color: var(--text-4); }
  .search:focus-within { border-color: var(--stroke-2); box-shadow: inset 0 -2px 0 var(--brand); }
  .search > svg { width: 20px; height: 20px; color: var(--brand-fg); margin: 0 8px 0 10px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
  .search input::placeholder { color: var(--text-3); }
  .search .ib { width: 28px; height: 28px; margin-right: 2px; }
  .search .ib svg { width: 16px; height: 16px; }
  .suggest { position: absolute; left: -1px; right: -1px; top: calc(100% + 4px); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow16); padding: 6px 0; z-index: 40; }
  .suggest .cap { font-size: 12px; font-weight: 600; color: var(--text-3); padding: 6px 14px 4px; }
  .suggest button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 14px; min-height: 40px; }
  .suggest button:hover, .suggest button.hl { background: var(--hover); }
  .suggest button > svg { width: 20px; height: 20px; color: var(--text-3); }
  .suggest small { display: block; font-size: 12px; color: var(--text-3); line-height: 16px; }
  .top-right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  .top-right .ib { width: 40px; height: 40px; }
  .top-right .ib.on { background: var(--nav-sel); color: var(--brand-fg); }
  .me { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 4px; margin-left: 4px; }
  .me:hover { background: var(--hover); }
  .me img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .dot-badge { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--canvas); }

  /* Shell */
  .shell { flex: 1; min-height: 0; display: flex; padding-left: 8px; }
  .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; container: ws / inline-size; }

  /* Ribbon */
  .rtabs { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 0; }
  .rtab { height: 32px; padding: 0 10px; border-radius: 4px; position: relative; color: var(--text-2); white-space: nowrap; }
  .rtab:hover { background: var(--subtle); color: var(--text); }
  .rtab.active { font-weight: 600; color: var(--text); }
  .rtab.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: var(--brand-fg); }
  .rtab::before { content: attr(data-label); display: block; font-weight: 600; height: 0; visibility: hidden; overflow: hidden; }
  .rbar { height: 40px; flex: none; margin: 0 8px 8px 0; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); display: flex; align-items: center; padding: 0 4px; gap: 2px; }
  .rbi { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: clip; overflow-y: visible; }
  .rb { height: 32px; padding: 0 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; color: var(--text); }

  .rsep { width: 1px; height: 20px; background: var(--stroke); margin: 0 4px; flex: none; }
  .split { display: inline-flex; height: 32px; border-radius: 4px; overflow: hidden; flex: none; margin-right: 4px; }
  .split button { background: var(--brand); color: var(--on-brand); display: inline-flex; align-items: center; gap: 6px; height: 100%; }
  .split button:hover { background: var(--brand-hover); }

  .split .drop svg { width: 14px; height: 14px; }
  .rb-more { margin-left: auto; }
  .fmt-swatch { width: 14px; height: 3px; border-radius: 1px; position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); }

  /* Content */
  .content { flex: 1; min-height: 0; display: flex; }
  .folders { width: 232px; flex: none; overflow-y: auto; padding: 0 8px 12px 0; }
  .folders.collapsed { display: none; }
  .fsec { display: flex; align-items: center; gap: 4px; height: 32px; width: 100%; padding: 0 8px 0 4px; font-weight: 600; border-radius: 4px; margin-top: 4px; }
  .fsec:hover { background: var(--subtle); }

  .fsec.shut svg { transform: rotate(-90deg); }
  .fsec span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fi { display: flex; align-items: center; gap: 10px; height: 32px; width: 100%; padding: 0 6px 0 22px; border-radius: 4px; color: var(--text); position: relative; }
  .fi > svg { width: 20px; height: 20px; color: var(--text-2); }

  .fi .ct { font-size: 12px; color: var(--text-3); min-width: 16px; text-align: right; }

  .fi.drop { background: var(--brand-tint-2); outline: 1px dashed var(--brand-fg); }
  .fi .fmore { display: none; width: 24px; height: 24px; margin-right: -2px; }

  .fi-input { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 6px 0 22px; }
  .fi-input > svg { width: 20px; height: 20px; color: var(--text-2); }
  .fi-input input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--stroke-2); border-bottom: 2px solid var(--brand); border-radius: 4px; padding: 0 8px; background: var(--surface); outline: 0; }
  .fi-input input.bad { border-bottom-color: var(--danger); }
  .fi-err { font-size: 12px; color: var(--danger); padding: 0 8px 4px 52px; line-height: 16px; }

  .mailarea { flex: 1; min-width: 0; display: flex; gap: 8px; padding: 0 8px 8px 0; }
  .list { width: 400px; min-width: 300px; flex: none; display: flex; flex-direction: column; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); overflow: hidden; }
  .reading { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
  .mailarea.pane-bottom { flex-direction: column; }

  .mailarea.pane-off.has-open .list { display: none; }
  .content.nav-hidden .mailarea { padding-left: 0; }

  /* List header */
  .lhead { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 8px 0 8px; min-height: 48px; border-bottom: 1px solid var(--stroke-3); }
  .lhead .title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; min-width: 0; }
  .lhead .title small { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 6px; }
  .pivot { height: 40px; padding: 0 10px; position: relative; color: var(--text-2); white-space: nowrap; }
  .pivot:hover { color: var(--text); }
  .pivot.active { font-weight: 600; color: var(--text); }
  .pivot.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--brand-fg); }
  .pivot::before { content: attr(data-label); display: block; font-weight: 600; height: 0; visibility: hidden; overflow: hidden; }
  .lhead .ib.fav.on { color: #eaa300; }
  .selbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 14px; border-bottom: 1px solid var(--stroke-3); background: var(--brand-tint); font-size: 13px; }
  .filterchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; height: 24px; padding: 0 4px 0 10px; border-radius: 12px; background: var(--brand-tint); color: var(--brand-fg); margin: 8px 0 0 14px; align-self: flex-start; }
  .filterchip button { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; }
  .filterchip button:hover { background: var(--brand-tint-2); }
  .filterchip svg { width: 12px; height: 12px; }
  .lbody { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; }
  .ghead { display: flex; align-items: center; gap: 6px; height: 32px; width: 100%; padding: 8px 14px 0; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .ghead svg { width: 12px; height: 12px; color: var(--text-3); transition: transform .1s; }
  .ghead.shut svg { transform: rotate(-90deg); }
  .ghead .n { font-weight: 400; color: var(--text-3); }

  /* Message rows */
  .mrow { position: relative; display: flex; gap: 12px; padding: 10px 12px 10px 14px; cursor: default; border-bottom: 1px solid var(--stroke-3); user-select: none; }
  .mrow:hover { background: var(--hover); }
  .mrow.flagged { background: var(--flag-row); }
  .mrow.flagged:hover { background: var(--flag-row-hover); }
  .mrow.selected, .mrow.checked { background: var(--sel); }
  .mrow.selected:hover, .mrow.checked:hover { background: var(--sel-hover); }
  .mrow.unread::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand-fg); }
  .mrow.dragging { opacity: .5; }
  .mlead { position: relative; width: 32px; height: 32px; flex: none; }
  .mcheck { position: absolute; inset: 0; display: none; place-items: center; border-radius: 50%; }
  .cbx { width: 16px; height: 16px; border: 1px solid var(--text-3); border-radius: 3px; display: grid; place-items: center; background: var(--surface); flex: none; }
  .cbx svg { width: 12px; height: 12px; color: #fff; display: none; }
  .cbx.on { background: var(--brand); border-color: var(--brand); }
  .cbx.on svg { display: block; }
  .cbx.some { background: var(--surface); border-color: var(--brand); }
  .cbx.some::after { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--brand); }
  .mrow:hover .mlead .mcheck, .list.selmode .mcheck, .mrow.checked .mcheck { display: grid; }
  .mrow:hover .mlead .av, .list.selmode .mlead .av, .mrow.checked .mlead .av { visibility: hidden; }
  .mtext { flex: 1; min-width: 0; }
  .l1, .l2 { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .l1 .snd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .l1 .snd .draft { color: var(--danger); }
  .mrow.unread .snd { font-weight: 600; }
  .l1 .ind { display: flex; align-items: center; gap: 2px; color: var(--text-3); }
  .l1 .ind svg { width: 16px; height: 16px; }
  .l1 .ind .flagi { color: var(--flag); }
  .l1 .ind .pini { color: var(--brand-fg); }
  .hov { display: none; align-items: center; gap: 0; margin: -4px -6px -4px 0; }
  .hov .ib { width: 28px; height: 28px; }
  .hov .ib svg { width: 18px; height: 18px; }
  .hov .ib:hover { background: var(--pressed); }
  .hov .ib.flagon { color: var(--flag); }
  .hov .ib.pinon { color: var(--brand-fg); }
  @media (hover: hover) {
    .mrow:hover .hov { display: flex; }
    .mrow:hover .ind { display: none; }
  }
  .l2 .subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text-2); }
  .mrow.unread .subj { color: var(--brand-fg); font-weight: 600; }
  .l2 .meta { display: flex; align-items: center; gap: 4px; flex: none; font-size: 12px; color: var(--text-3); }
  .l2 .meta svg { width: 14px; height: 14px; }
  .l2 .meta .imp { color: var(--danger); }
  .mrow.unread .l2 .time { color: var(--brand-fg); font-weight: 600; }
  .l3 { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 18px; margin-top: 1px; }
  .l4 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .cat { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 20px; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis;
    background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: color-mix(in srgb, var(--c) 78%, var(--text)); }
  .fchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 4px; border-radius: 4px; border: 1px solid var(--stroke); font-size: 12px; max-width: 170px; background: var(--surface); }
  .fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fchip svg { width: 16px; height: 16px; }
  .fchip:hover { background: var(--hover); }
  .foldertag { font-size: 11px; color: var(--text-3); border: 1px solid var(--stroke); border-radius: 4px; padding: 0 5px; height: 20px; line-height: 18px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  body.cozy .mrow { padding-top: 7px; padding-bottom: 7px; }
  body.compact .mrow { padding-top: 5px; padding-bottom: 5px; gap: 10px; }
  body.compact .mlead { width: 20px; height: 20px; margin-top: 0; }
  body.compact .mlead .av { width: 20px; height: 20px; font-size: 9px; }
  body.compact .l3 { display: none; }
  body.compact .l4 .fchip { display: none; }
  body.compact .l4:not(:has(.cat)) { display: none; }
  body.compact .l4 { margin-top: 3px; }
  .empty { display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; color: var(--text-3); padding: 48px 24px; height: 100%; }
  .empty b { display: block; color: var(--text); font-size: 16px; font-weight: 600; }
  svg.art { width: 120px; height: 96px; }

  /* Reading pane */
  .rwrap { padding: 0 0 16px; max-width: 1100px; }
  .backbar { display: none; align-items: center; gap: 2px; height: 44px; padding: 0 4px; position: sticky; top: 0; z-index: 5; background: var(--canvas); }
  .mailarea.pane-off .backbar { display: flex; }
  .rhead { display: flex; align-items: flex-start; gap: 8px; padding: 12px 8px 12px 16px; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); margin-bottom: 8px; }
  .rhead h2 { font-size: 20px; line-height: 28px; font-weight: 600; word-break: break-word; }
  .rhead .cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .rhead .cats:empty { display: none; }
  .rhead .ib { margin-top: -2px; }
  .mcard { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); margin-bottom: 8px; }
  .mcard.collapsed { cursor: pointer; }
  .mcard.collapsed:hover { background: var(--surface-2); }
  .mh { display: flex; gap: 12px; padding: 16px 12px 0 16px; align-items: flex-start; }
  .mcard.collapsed .mh { padding: 12px 16px; align-items: center; }
  .mh .who { flex: 1; min-width: 0; }
  .mh .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mh .nm .em { font-weight: 400; color: var(--text-3); font-size: 13px; margin-left: 4px; }
  .mh .rcp { font-size: 12px; color: var(--text-3); line-height: 16px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mh .prev { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mh .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
  .mh .acts { display: flex; align-items: center; }
  .mh .acts .ib.liked { color: var(--brand-fg); }
  .mh .when { font-size: 12px; color: var(--text-3); white-space: nowrap; padding-right: 6px; }
  .mcard.collapsed .when { padding-right: 0; }
  .impbar { margin: 12px 16px 0; padding: 6px 10px; font-size: 12px; border-radius: 4px; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--text-2); display: flex; gap: 6px; align-items: center; }
  .impbar svg { width: 14px; height: 14px; color: var(--danger); }
  .atts { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0 68px; }
  .attcard { display: flex; align-items: center; gap: 10px; width: 264px; max-width: 100%; height: 52px; padding: 0 4px 0 10px; border: 1px solid var(--stroke); border-radius: 6px; background: var(--surface); text-align: left; }
  .attcard:hover { background: var(--hover); border-color: var(--stroke-2); }
  .attcard > svg { width: 28px; height: 28px; }
  .attcard .t { flex: 1; min-width: 0; }
  .attcard .t b { display: block; font-weight: 400; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attcard .t small { display: block; font-size: 12px; color: var(--text-3); line-height: 16px; }
  .attcard .ib { width: 28px; height: 28px; }
  .attsum { padding: 8px 16px 0 68px; font-size: 12px; color: var(--text-3); display: flex; gap: 12px; }
  .mbody { padding: 12px 20px 16px 68px; line-height: 22px; overflow-wrap: anywhere; font-size: 14.5px; }
  .mbody p { margin: 0 0 12px; }
  .mbody p:last-child { margin-bottom: 0; }
  .mbody ul, .mbody ol { margin: 0 0 12px; padding-left: 24px; }
  .mbody code { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 13px; background: var(--hover); padding: 1px 4px; border-radius: 3px; }
  .mbody a { color: var(--brand-fg); }
  .mbody .sig { color: var(--text-3); margin-top: 16px; font-size: 13px; line-height: 18px; }
  .mbody blockquote { border-left: 3px solid var(--stroke-2); padding-left: 12px; color: var(--text-3); margin: 12px 0; }
  .mbody .promo { border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; margin: 4px 0 12px; max-width: 560px; }
  .mbody .promo .hero { height: 120px; display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .mbody .promo .pb { padding: 12px 16px; }
  .mbody .cta { display: inline-block; background: var(--brand); color: #fff !important; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 13px; }
  .mbody .tbl { border-collapse: collapse; margin: 4px 0 12px; font-size: 13px; }
  .mbody .tbl td, .mbody .tbl th { border: 1px solid var(--stroke); padding: 4px 10px; text-align: left; }
  .mbody .tbl th { background: var(--surface-2); font-weight: 600; }
  .rfoot { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px 68px; }
  .reading-empty { display: grid; place-items: center; align-content: center; gap: 10px; height: 100%; text-align: center; color: var(--text-3); padding: 24px; }
  .reading-empty b { color: var(--text); font-size: 16px; font-weight: 600; }
  .reading-empty .sub { font-size: 13px; }
  .multi { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); height: 100%; display: grid; place-items: center; align-content: center; gap: 16px; text-align: center; padding: 24px; }
  .multi .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  /* Meeting invite */
  .invite { margin: 12px 16px 0 68px; border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; }
  .inv-top { display: flex; gap: 12px; padding: 12px 14px; }
  .inv-top .calico { width: 40px; height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--stroke); text-align: center; flex: none; background: var(--surface); }
  .inv-top .calico i { display: block; font-style: normal; font-size: 10px; font-weight: 600; line-height: 14px; background: var(--brand); color: #fff; text-transform: uppercase; }
  .inv-top .calico b { display: block; font-size: 17px; line-height: 28px; }
  .inv-top h3 { font-size: 15px; font-weight: 600; line-height: 20px; }

  .inv-top .ln svg { width: 16px; height: 16px; color: var(--text-3); }
  .inv-top .ln a { color: var(--brand-fg); }
  .inv-status { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; border-top: 1px solid var(--stroke); background: var(--surface-2); }
  .inv-status svg { width: 16px; height: 16px; }

  .rsvp { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--stroke); }
  .rsvp .btn svg { width: 18px; height: 18px; }

  .rsvp .btn.ten svg { color: var(--brand-fg); }
  .rsvp .btn.dec svg { color: var(--danger); }
  .rsvp .btn.chosen { background: var(--brand-tint); border-color: var(--brand-fg); }
  .dayview { position: relative; margin: 0 14px 14px; border: 1px solid var(--stroke); border-radius: 6px; height: 176px; overflow: hidden; background: var(--surface); }
  .dayview .hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--stroke-3); font-size: 11px; color: var(--text-3); padding: 1px 0 0 8px; line-height: 14px; }
  .dayview .ev { position: absolute; left: 64px; right: 10px; border-radius: 4px; padding: 3px 8px; font-size: 12px; line-height: 16px; overflow: hidden; border-left: 3px solid; }
  .dayview .ev.other { background: var(--hover); border-color: var(--text-4); color: var(--text-2); }
  .dayview .ev.this { background: var(--brand-tint); border-color: var(--brand-fg); color: var(--text); font-weight: 600; }

  .dayview .ev small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
  .dayhead { font-size: 12px; color: var(--text-3); padding: 0 14px 6px; }

  /* Compose */
  .compose { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow4); margin-bottom: 8px; display: flex; flex-direction: column; }

const future = (daysAhead, h, m = 0) => { const d = new Date(NOW); d.setDate(d.getDate() + daysAhead); d.setHours(h, m, 0, 0); return d; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const fmtTime = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtDay = d => d.toLocaleDateString("en-US", { weekday: "short" });
const fmtMD = d => `${d.getMonth() + 1}/${d.getDate()}`;
function listTime(d) {
  const days = (startOfDay(NOW) - startOfDay(d)) / 864e5;
  if (days <= 0) return fmtTime(d);
  if (days < 7) return `${fmtDay(d)} ${fmtTime(d)}`;
  if (d.getFullYear() === NOW.getFullYear()) return `${fmtDay(d)} ${fmtMD(d)}`;
  return `${fmtMD(d)}/${d.getFullYear()}`;
}
const fullTime = d => `${fmtDay(d)} ${fmtMD(d)}/${d.getFullYear()} ${fmtTime(d)}`;
function groupOf(d) {
  const today = startOfDay(NOW), days = Math.round((today - startOfDay(d)) / 864e5);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - today.getDay());
  if (d >= weekStart) return "This week";
  const lastWeek = new Date(weekStart); lastWeek.setDate(weekStart.getDate() - 7);
  if (d >= lastWeek) return "Last week";
  const twoWeeks = new Date(lastWeek); twoWeeks.setDate(lastWeek.getDate() - 7);
  if (d >= twoWeeks) return "Two weeks ago";
  if (d.getMonth() === NOW.getMonth() && d.getFullYear() === NOW.getFullYear()) return "Earlier this month";
  return "Older";
}

// Rich text from the composer is sanitized to a small allowlist before it is stored or rendered
function clean(html) {
  const tpl = document.createElement("template"); tpl.innerHTML = html;
  const OK = new Set(["B", "STRONG", "I", "EM", "U", "S", "STRIKE", "UL", "OL", "LI", "BR", "DIV", "P", "SPAN", "FONT", "A", "BLOCKQUOTE"]);
  const walk = node => [...node.childNodes].forEach(n => {
    if (n.nodeType === 3) return;
    if (n.nodeType !== 1 || !OK.has(n.tagName)) { if (n.nodeType === 1 && !["SCRIPT", "STYLE", "IFRAME", "OBJECT"].includes(n.tagName)) { walk(n); n.replaceWith(...n.childNodes); } else n.remove(); return; }
    const keep = {};
    if (n.tagName === "A" && /^https?:/i.test(n.getAttribute("href") || "")) keep.href = n.getAttribute("href");
    if (n.tagName === "FONT" && /^#?[\w]+$/.test(n.getAttribute("color") || "")) keep.color = n.getAttribute("color");
    const st = n.getAttribute("style") || "", css = [];
    const col = st.match(/(?:^|;)\s*color:\s*(#[0-9a-f]{3,8}|rgb\([\d,\s]+\))/i), bg = st.match(/background-color:\s*(#[0-9a-f]{3,8}|rgb\([\d,\s]+\))/i), al = st.match(/text-align:\s*(left|center|right)/i);
    if (col) css.push("color:" + col[1]); if (bg) css.push("background-color:" + bg[1]); if (al) css.push("text-align:" + al[1]);
    [...n.attributes].forEach(a => n.removeAttribute(a.name));
    Object.entries(keep).forEach(([k, v]) => n.setAttribute(k, v));
    if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener"); }
    if (css.length) n.setAttribute("style", css.join(";"));
    walk(n);
  });
  walk(tpl.content);
  return tpl.innerHTML;
}

function matchesQuery(t, q) {
  const hay = (t.subject + " " + t.msgs.map(m => nameOf(m.from) + " " + emailOf(m.from) + " " + m.to.map(nameOf).join(" ") + " " + strip(m.body) + " " + (m.atts || []).map(a => a.name).join(" ")).join(" ")).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function visible() {
  const list = threads.filter(t => {
    if (t.folder === "hidden") return false;
    if (state.query) { if (!matchesQuery(t, state.query)) return false; }
    else {
      if (t.folder !== state.folder) return false;
      if (state.folder === "inbox" && state.focusedInbox && t.focused !== (state.pivot === "focused")) return false;
    }
    if (state.filter === "unread" && !t.unread) return false;
    if (state.filter === "flagged" && !t.flagged) return false;
    if (state.filter === "tome" && !lastMsg(t).to.includes(ME)) return false;
    if (state.filter === "files" && !t.msgs.some(m => m.atts && m.atts.length)) return false;
    if (state.filter === "mentions" && !t.msgs.some(m => /naman/i.test(strip(m.body)))) return false;
    return true;
  });
  const dir = state.sortDesc ? -1 : 1;
  const key = { date: t => lastDate(t).getTime(), from: t => nameOf(lastMsg(t).from).toLowerCase(), subject: t => t.subject.replace(/^(re|fw|fwd):\s*/i, "").toLowerCase(), size: t => t.msgs.reduce((a, m) => a + (m.atts || []).reduce((b, x) => b + x.size, 0) + m.body.length, 0) }[state.sort];
  return list.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * (state.sort === "date" || state.sort === "size" ? dir : -dir); });
}
function grouped(list) {
  if (state.sort !== "date") return [[null, list]];
  const out = [], pinned = list.filter(t => t.pinned && !state.query);
  if (pinned.length) out.push(["Pinned", pinned]);
  for (const t of list) {
    if (t.pinned && !state.query) continue;
    const g = groupOf(lastDate(t)), last = out.at(-1);
    if (last && last[0] === g) last[1].push(t); else out.push([g, [t]]);
  }
  return out;
}

    case "folderPane": state.navCollapsed = !state.navCollapsed; renderRibbon(); renderFolders(); return;
    case "conv": return popover(el, '<div class="mcap">Conversations</div>' + mi("toast:Messages are grouped into conversations.", IC.conv, "Group into conversations", ck(true)) + mi("toast:Conversation view stays on in this mockup.", IC.mail, "Show as individual messages"));
    case "theme": return setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    case "myday": state.myday = !state.myday; renderMyDay(); renderRibbon(); return;
    case "help": return toast("Help: search for answers or contact support from the Help pane.");
    case "shortcuts": return shortcutsDialog();
    case "whatsnew": return dialog({ title: "What's new in Outlook", ok: "", cancel: "Close", body: `<ul style="padding-left:20px;color:var(--text-2);line-height:24px;margin-top:8px"><li>Pin important messages to the top of your inbox</li><li>Snooze mail until you're ready to deal with it</li><li>My Day brings your calendar and tasks next to your mail</li><li>New Fluent 2 look with light and dark themes</li></ul>` });
    case "feedback": return dialog({ title: "Give feedback to Microsoft", ok: "Submit", body: `<p>Tell us what you like or what we could do better.</p><textarea id="fbText" placeholder="Share your feedback" maxlength="1000"></textarea>`, validate: d => !d.querySelector("#fbText").value.trim(), onOk: () => toast("Thanks for your feedback!", [], { ok: true }) });
    case "diag": return toast("Diagnostics: no issues found with your mailbox.", [], { ok: true });
  }
}

// ---------- Search ----------
function renderSearchSug() {
  const host = $("#searchSug"), q = $("#search").value.trim();
  if (document.activeElement !== $("#search")) { host.innerHTML = ""; return; }
  const ppl = Object.keys(contacts).filter(id => id !== ME && contacts[id].email.includes("@") && (!q || contacts[id].name.toLowerCase().split(" ").some(w => w.startsWith(q.toLowerCase())))).slice(0, q ? 4 : 3);
  const recent = ["migration", "latency report", "benefits"];
  host.innerHTML = `<div class="suggest" role="listbox">${q ? `<button data-dosearch="${esc(q)}">${IC.search}<span>Search for "<b>${esc(q)}</b>"</span></button>` : `<div class="cap">Recent searches</div>${recent.map(r => `<button data-dosearch="${r}">${IC.history}<span>${r}</span></button>`).join("")}`}
    ${ppl.length ? `<div class="cap">People</div>${ppl.map(id => `<button data-dosearch="${esc(nameOf(id))}">${av(id, "s24")}<span>${hl(nameOf(id), q)}<small>${esc(emailOf(id))}</small></span></button>`).join("")}` : ""}</div>`;
}
function doSearch(q) {
  q = q.trim();
  $("#search").value = q;
  $("#searchClear").hidden = !q;
  $("#searchSug").innerHTML = "";
  if (state.compose && state.compose.kind !== "new") closeCompose(true, true);
  Object.assign(state, { query: q, open: null, selMode: false });
  state.selected.clear();
  $("#search").blur();
  renderAll();
}
function exitSearch() { $("#search").value = ""; doSearch(""); }

// ---------- Events ----------
document.addEventListener("mousedown", e => { if (e.target.closest("[data-fmt]")) e.preventDefault(); });
document.addEventListener("click", e => {
  const inPop = e.target.closest("#pop");
  if ($("#pop") && !inPop && !(popAnchor && popAnchor.contains(e.target))) closePop();
  if (state.fly && !e.target.closest("#fly, #gearBtn")) { state.fly = null; renderFly(); }
  if (!e.target.closest("#searchBox")) $("#searchSug").innerHTML = "";
  const t = e.target.closest("button, a, [role=button], [data-row], [data-openmail]");
  if (!t) return;
  const d = t.dataset;
  if (t.tagName === "A" && t.getAttribute("href") === "#") e.preventDefault();

  if (d.toastact !== undefined) { const a = $("#toast")._actions[+d.toastact]; $("#toast").classList.remove("show"); a.fn(); return; }
  if (t.classList.contains("x") && t.closest("#toast")) { $("#toast").classList.remove("show"); return; }
  if ("closenotif" in d) { e.stopPropagation(); $("#notifHost").innerHTML = ""; return; }
  if (d.m) { menuAction(d.m, t); return; }
  if (d.emoji) { closePop(); restoreRange(); document.execCommand("insertText", false, d.emoji); if (state.compose) { state.compose.html = $("#cBody").innerHTML; scheduleSave(); } return; }
  if (d.cmd) { if (inPop) closePop(); if (t.classList.contains("open")) { closePop(); return; } command(d.cmd, t); return; }
  if (d.fmt) { fmt(d.fmt, t); return; }
  if (d.rtab) { state.ribbonTab = d.rtab; renderRibbon(); return; }
  if (d.sec) { state.shut.has(d.sec) ? state.shut.delete(d.sec) : state.shut.add(d.sec); renderFolders(); return; }
  if (d.fmenu) {
    e.stopPropagation();
    const f = folderById(d.fmenu), custom = customFolders.includes(f);
    popover(t, mi(`fav:${f.id}`, favorites.includes(f.id) ? IC.starF : IC.star, favorites.includes(f.id) ? "Remove from Favorites" : "Add to Favorites") + mi(`markall:${f.id}`, IC.read, "Mark all as read")
      + (["deleted", "junk"].includes(f.id) ? mi(`empty:${f.id}`, IC.broom, "Empty folder") : "") + (custom ? mdiv + mi(`rename:${f.id}`, IC.rename, "Rename") + mi(`delfolder:${f.id}`, IC.trash, "Delete folder") : "") + mdiv + mi("newfolder:", IC.folderAdd, "Create new folder"));
    return;
  }
  if (d.folder) { selectFolder(d.folder); return; }
  if ("newfolder" in d) { state.newFolder = true; renderFolders(); return; }
  if (d.pivot) { state.pivot = d.pivot; state.selected.clear(); renderList(); renderRibbon(); renderReading(); return; }
  if ("selmode" in d) { state.selMode = !state.selMode; if (!state.selMode) state.selected.clear(); else if (state.open) { state.selected.add(state.open); } renderList(); renderRibbon(); renderReading(); return; }
  if ("selall" in d) { const list = visible(), all = list.length && list.every(x => state.selected.has(x.id)); state.selected = new Set(all ? [] : list.map(x => x.id)); renderList(); renderRibbon(); renderReading(); return; }
  if ("clearsel" in d) { state.selected.clear(); state.selMode = false; renderList(); renderRibbon(); renderReading(); return; }
  if ("filtermenu" in d) {
    popover(t, '<div class="mcap">Filter</div>' + FILTERS.map(([id, n]) => mi(`filter:${id}`, "", n, ck(state.filter === id))).join("") + mdiv + '<div class="mcap">Sort by</div>'
      + [["date", "Date"], ["from", "From"], ["subject", "Subject"], ["size", "Size"]].map(([id, n]) => mi(`sort:${id}`, "", n, ck(state.sort === id))).join("") + mdiv + mi("sort:dir", IC.sort, state.sortDesc ? (state.sort === "date" ? "Newest on top" : state.sort === "size" ? "Largest on top" : "A to Z") : (state.sort === "date" ? "Oldest on top" : state.sort === "size" ? "Smallest on top" : "Z to A")), { align: "right" });
    return;
  }
  if ("clearfilter" in d) { Object.assign(state, { filter: "all", sort: "date", sortDesc: true }); renderList(); return; }
  if ("exitsearch" in d) { exitSearch(); return; }
  if (d.favtoggle) { menuAction(`fav:${d.favtoggle}`); return; }
  if (d.group) { state.shutGroups.has(d.group) ? state.shutGroups.delete(d.group) : state.shutGroups.add(d.group); renderList(); return; }
  if (d.rowact) { e.stopPropagation(); const [k, id] = d.rowact.split(":"); act(k, +id); return; }
  if (d.check) { e.stopPropagation(); toggleSelect(+d.check, e); return; }
  if (d.att) { e.stopPropagation(); previewAtt(d.att); return; }
  if (d.attmenu) { e.stopPropagation(); const n = d.attmenu; popover(t, mi(`toast:Previewing ${n}`, IC.eye, "Preview") + mi(`toast:Downloading ${n}`, IC.download, "Download") + mi(`toast:Saved ${n} to OneDrive`, IC.folder, "Save to OneDrive"), { align: "right" }); return; }
  if (d.row) {
    const id = +d.row;
    if (state.selMode || e.metaKey || e.ctrlKey) { toggleSelect(id, e); return; }
    if (e.shiftKey && state.open) { rangeSelect(state.open, id); return; }
    openThread(id);
    return;
  }
  if (d.openmail) { $("#notifHost").innerHTML = ""; const tt = byId(+d.openmail); if (tt) { Object.assign(state, { query: "", folder: tt.folder, pivot: tt.focused ? "focused" : "other" }); $("#search").value = ""; openThread(tt.id); } return; }
  if (d.expand) { state.expanded.add(d.expand); renderReading("keep"); return; }
  if (d.like) { state.liked.has(d.like) ? state.liked.delete(d.like) : state.liked.add(d.like); renderReading("keep"); return; }
  if (d.msgmore || d.threadmore) { const tt = byId(+(d.msgmore || d.threadmore).split(":")[0]); popover(t, threadMenuHTML(tt), { align: "right" }); return; }
  if ("back" in d) {
    if (state.compose && state.compose.kind === "new") { closeCompose(true); return; }
    if (state.compose) closeCompose(true, true);
    state.open = null; renderAll(); return;
  }
  if (d.rsvp) { const [id, r] = d.rsvp.split(":"); rsvp(+id, r); return; }
  if (d.mdtab) { state.mydayTab = d.mdtab; renderMyDay(); return; }
  if ("myday" in d) { state.myday = false; renderMyDay(); renderRibbon(); return; }
  if (d.task) { tasks[+d.task].done = !tasks[+d.task].done; renderMyDay(); return; }
  if ("csend" in d) { sendCompose(); return; }
  if ("csendmenu" in d) { popover(t, mi("sendnow:", IC.send, "Send") + mdiv + '<div class="mcap">Schedule send</div>' + [future(1, 8), (() => { const x = new Date(NOW); x.setDate(NOW.getDate() + ((8 - NOW.getDay()) % 7 || 7)); x.setHours(8, 0, 0, 0); return x; })()].map((w, i) => mi(`sendlater:${w.getTime()}`, IC.clock, i ? "Monday morning" : "Tomorrow morning", `<span class="sh">${fmtDay(w)} ${fmtTime(w)}</span>`)).join("")); return; }
  if ("cdiscard" in d) { discardCompose(); return; }
  if ("cclose" in d) { closeCompose(true); return; }
  if (d.showcc) { syncCompose(); state.compose[d.showcc === "cc" ? "showCc" : "showBcc"] = true; renderReading(true); $("#in-" + d.showcc).focus(); return; }
  if (d.flab) { $("#in-" + d.flab).focus(); return; }
  if (d.rmchip) { const [k, i] = d.rmchip.split(":"); state.compose[k].splice(+i, 1); refreshField(k); scheduleSave(); return; }
  if (d.rmatt) { state.compose.atts.splice(+d.rmatt, 1); $("#cAtts").innerHTML = attChips(state.compose); scheduleSave(); return; }
  if (d.dosearch !== undefined) { doSearch(d.dosearch); return; }
  if (d.settheme) { setTheme(d.settheme === "toggle" ? (document.documentElement.dataset.theme === "dark" ? "light" : "dark") : d.settheme); return; }
  if (d.setdensity) { state.density = d.setdensity; renderAll(); renderFly(); return; }
  if (d.setpane) { state.pane = d.setpane; renderAll(); renderFly(); return; }
  if ("setfocused" in d) { state.focusedInbox = !state.focusedInbox; state.pivot = "focused"; renderAll(); renderFly(); return; }
  if ("closefly" in d) { state.fly = null; renderFly(); return; }
  if (d.toast) { closePop(); toast(d.toast); return; }
});
function toggleSelect(id, e) {
  if (e && e.shiftKey && state.anchor) return rangeSelect(state.anchor, id);
  if (!state.selected.size && state.open && state.open !== id && !state.selMode) state.selected.add(state.open);
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  state.anchor = id;
  if (!state.selected.size && !state.selMode) { renderAll(); return; }
  renderList(); renderRibbon(); renderReading();
}
function rangeSelect(from, to) {
  const ids = visible().map(t => t.id), a = ids.indexOf(from), b = ids.indexOf(to);
  if (a < 0 || b < 0) return;
  state.selected = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1));
  renderList(); renderRibbon(); renderReading();
}
function rsvp(id, r) {
  const t = byId(id), inv = t.invite, di = inThisWeek(inv.start);
  inv.rsvp = r;
  for (let i = events.length - 1; i >= 0; i--) if (events[i].invite) events.splice(i, 1);
  if (r !== "Decline" && di >= 0) events.push({ day: di, s: inv.start.getHours(), e: inv.end.getHours(), title: inv.title, c: "#0f6cbd", invite: true, tent: r === "Tentative" });
  renderReading("keep"); renderMyDay();
  toast({ Accept: "Accepted. Response sent to Lena Okafor.", Tentative: "Tentatively accepted. Response sent to Lena Okafor.", Decline: "Declined. Response sent to Lena Okafor." }[r], [], { ok: r !== "Decline" });
}
function previewAtt(name) {
  const a = threads.flatMap(t => t.msgs.flatMap(m => m.atts || [])).find(x => x.name === name) || { name, size: 0 };
  dialog({ title: name, ok: "Download", cancel: "Close", onOk: () => toast(`Downloading ${name}`),
    body: `<div style="display:flex;align-items:center;gap:16px;margin-top:12px;padding:16px;border:1px solid var(--stroke);border-radius:8px">${fileIcon(name).replace("<svg", '<svg style="width:48px;height:48px"')}<div><b style="display:block">${esc(name)}</b><span style="color:var(--text-3);font-size:13px">${a.size ? fmtSize(a.size) : ""} · Preview isn't available in this mockup</span></div></div>` });
}
// Right-click a message for its context menu
document.addEventListener("contextmenu", e => {
  const row = e.target.closest("[data-row]");
  if (!row) return;
  e.preventDefault();
  const t = byId(+row.dataset.row);
  popAt(e.clientX, e.clientY, threadMenuHTML(t));
});
// Drag messages onto folders
let dragIds = [];
document.addEventListener("dragstart", e => {
  const row = e.target.closest && e.target.closest("[data-row]");
  if (!row) return;
  const id = +row.dataset.row;
  dragIds = state.selected.has(id) ? [...state.selected] : [id];
  e.dataTransfer.setData("text/plain", dragIds.join(","));
  e.dataTransfer.effectAllowed = "move";
  row.classList.add("dragging");
});
document.addEventListener("dragend", () => { $$(".dragging").forEach(x => x.classList.remove("dragging")); $$(".fi.drop").forEach(x => x.classList.remove("drop")); });
const dropOk = f => f && !["drafts", "scheduled", "sent"].includes(f);
document.addEventListener("dragover", e => { const f = e.target.closest && e.target.closest("[data-folder]"); if (f && dragIds.length && dropOk(f.dataset.folder)) { e.preventDefault(); $$(".fi.drop").forEach(x => x !== f && x.classList.remove("drop")); f.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const f = e.target.closest && e.target.closest("[data-folder]"); if (f && !f.contains(e.relatedTarget)) f.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const f = e.target.closest && e.target.closest("[data-folder]");
  if (!f || !dropOk(f.dataset.folder)) return;
  e.preventDefault();
  const ids = dragIds.filter(id => byId(id) && byId(id).folder !== f.dataset.folder);
  dragIds = [];
  if (ids.length) moveThreads(ids, f.dataset.folder, `${convWord(ids.length)} moved to ${folderName(f.dataset.folder)}.`);
});

// Header controls
$("#drawerBtn").onclick = () => (state.drawer ? closeDrawer() : openDrawer());
$("#scrim").onclick = closeDrawer;
$("#fab").onclick = () => openCompose({ kind: "new" });
$("#gearBtn").onclick = () => { state.fly = state.fly === "settings" ? null : "settings"; closePop(); renderFly(); };
$("#mydayBtn").onclick = () => { state.myday = !state.myday; renderMyDay(); renderRibbon(); };
$("#helpBtn").onclick = () => command("shortcuts");
$("#bellBtn").onclick = e => {
  if (popAnchor === e.currentTarget) return closePop();
  const b = $("#bellDot"); if (b) b.remove();
  const inv = threads.find(t => t.invite);
  popover(e.currentTarget, `<div class="nh">Notifications</div>
    <button class="ni" data-m="open:${inv.id}">${av("lena")}<span><b style="font-weight:600">Lena Okafor</b> invited you to Onboarding v4 review<small>${fmtDay(inv.invite.start)} ${fmtTime(inv.invite.start)}</small></span></button>
    <button class="ni" data-m="open:${threads[0].id}">${av("dev")}<span><b style="font-weight:600">Dev Patel</b> mentioned you in PR #912<small>${listTime(lastDate(threads[0]))}</small></span></button>
    <button class="ni" data-m="myday:">${svgSize(IC.clock, 32).replace("<svg", '<svg style="color:var(--brand-fg);padding:4px"')}<span>Reminder: Daily standup at 9:30 AM<small>Microsoft Teams Meeting</small></span></button>`, { cls: "notif-list", align: "right" });
};
$("#meBtn").onclick = e => {
  if (popAnchor === e.currentTarget) return closePop();
  popover(e.currentTarget, `<div class="ah"><b>Casuro</b><button class="link" data-m="signout:">Sign out</button></div>
    <div class="ab"><img src="${contacts[ME].photo}" alt=""><div style="min-width:0"><b>${contacts[ME].name}</b><small>${contacts[ME].email}</small><button class="link" style="font-size:13px;margin-top:6px" data-m="toast:Opening your account settings...">View account</button></div></div>
    <div class="af">${mi("toast:Open another mailbox: enter a shared mailbox you have access to.", IC.mailbox, "Open another mailbox")}${mi("toast:Status set to Available.", '<span style="width:20px;display:grid;place-items:center"><i style="width:10px;height:10px;border-radius:50%;background:#6bb700;display:block"></i></span>', "Available")}</div>`, { cls: "acct", align: "right" });
};
const search = $("#search");
search.addEventListener("focus", renderSearchSug);
search.addEventListener("input", () => { $("#searchClear").hidden = !search.value; renderSearchSug(); });
search.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(search.value); }
  if (e.key === "Escape") { e.stopPropagation(); if (search.value) { search.value = ""; $("#searchClear").hidden = true; renderSearchSug(); } else { search.blur(); $("#searchSug").innerHTML = ""; } }
});
$("#searchClear").onclick = () => { if (state.query) exitSearch(); else { search.value = ""; $("#searchClear").hidden = true; search.focus(); } };

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"], [data-row]') && !e.target.closest("input, textarea, [contenteditable]")) { e.preventDefault(); e.target.click(); return; }
  const typing = e.target.closest("input, textarea, select, [contenteditable=true]");
  if (e.key === "Escape") {
    if ($(".dialog-scrim")) return;
    if ($("#pop")) { closePop(); return; }
    if (state.fly) { state.fly = null; renderFly(); return; }
    if ($("#searchSug").innerHTML) { $("#searchSug").innerHTML = ""; search.blur(); return; }
    if (state.drawer) { closeDrawer(); return; }
    if (state.compose) { closeCompose(true); return; }
    if (state.myday && narrowMQ.matches) { state.myday = false; renderMyDay(); return; }
    if (state.selMode || state.selected.size) { state.selMode = false; state.selected.clear(); renderList(); renderRibbon(); renderReading(); return; }
    if (state.open && (narrowMQ.matches || state.pane === "off")) { state.open = null; renderAll(); return; }
    if (state.query) { exitSearch(); return; }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); command("undo"); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && state.compose) { e.preventDefault(); sendCompose(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $(".dialog-scrim")) return;
  const ids = targets(), cur = state.open;
  const k = e.key;
  if (k === "n" || k === "N" && !e.shiftKey) { e.preventDefault(); openCompose({ kind: "new" }); }
  else if (k === "/") { e.preventDefault(); search.focus(); }
  else if (k === "?") { e.preventDefault(); shortcutsDialog(); }
  else if (k === "R" && e.shiftKey && cur) { e.preventDefault(); replyTo("replyAll", cur); }
  else if (k === "F" && e.shiftKey && cur) { e.preventDefault(); replyTo("forward", cur); }
  else if (k === "r" && cur) { e.preventDefault(); replyTo("reply", cur); }
  else if ((k === "Delete" || k === "Backspace") && ids.length) { e.preventDefault(); act("delete", ids); }
  else if (k === "e" && ids.length) act("archive", ids);
  else if (k === "q" && ids.length) act("read", ids);
  else if (k === "u" && ids.length) act("unread", ids);
  else if (k === "Insert" && ids.length) act("flag", ids);
  else if (["ArrowDown", "ArrowUp", "j", "k"].includes(k)) {
    const list = visible().filter(t => !state.shutGroups.has(t.pinned && !state.query && state.sort === "date" ? "Pinned" : groupOf(lastDate(t))));
    const order = state.sort === "date" ? grouped(list).flatMap(g => g[1]) : list;
    if (!order.length) return;
    e.preventDefault();
    const i = order.findIndex(t => t.id === cur), next = order[i < 0 ? 0 : Math.max(0, Math.min(order.length - 1, i + (k === "ArrowDown" || k === "j" ? 1 : -1)))];
    if (next && next.id !== cur) openThread(next.id, { focusRow: true });
  }
});

// Layout changes
phoneMQ.addEventListener("change", () => { closeDrawer(); renderAll(); });
narrowMQ.addEventListener("change", () => renderAll());

(() => {

  document.head.appendChild(st);
})();

renderHeader();
renderAll();
</script>
