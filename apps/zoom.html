<style>
  /* Repo convention: light is the default color scheme; the Zoom meeting window itself is always dark, like the real client */
  :root {
    color-scheme: light;
    --blue: #0b5cff;
    --blue-h: #0048d9;
    --red: #e02828;
    --red-h: #c41d1d;
    --m-bg: #1a1a1a;
    --m-tile: #242424;
    --m-bar: #1f1f1f;
    --m-panel: #232323;
    --m-hover: #333333;
    --m-text: #ececec;
    --m-text-2: #a8a8a8;
    --m-text-3: #7d7d7d;
    --spk: #23d959;
    --share-green: #1e9c4a;
    --share-green-2: #23d959;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Lato, "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 20px; color: var(--m-text); background: var(--m-bg);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .call, .ended, .modal, .menu { color-scheme: dark; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; flex: none; }
  [hidden] { display: none !important; }

  /* ---------- Buttons ---------- */
  .btn { height: 32px; padding: 0 16px; border-radius: 8px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-h); }
  .btn-primary:disabled { background: #3a3a3a; color: #777; cursor: default; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: var(--red-h); }
  .m-sec { background: #333; color: var(--m-text); border: 1px solid #454545; }
  .m-sec:hover { background: #3d3d3d; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--m-text-2); }
  .icon-btn:hover { background: #363636; color: #fff; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Menus ---------- */
  .menu { position: fixed; z-index: 90; min-width: 220px; max-width: min(340px, calc(100vw - 16px)); max-height: calc(100vh - 24px); overflow: auto; background: #2b2b2b; color: var(--m-text); border: 1px solid #3a3a3a; border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); padding: 6px; animation: pop .12s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .mi { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 10px; border-radius: 8px; text-align: left; font-size: 13px; }
  .mi:hover { background: #3a3a3a; }
  .mi .ck { width: 16px; height: 16px; flex: none; color: #fff; display: grid; place-items: center; }
  .mi .ck svg { width: 16px; height: 16px; }
  .mi > svg { width: 16px; height: 16px; color: var(--m-text-2); }
  .mi .l { flex: 1; min-width: 0; }
  .mi kbd { font: inherit; font-size: 11px; color: var(--m-text-3); }
  .mi.danger { color: #ff6b6b; }
  .mi:disabled { opacity: .45; cursor: default; }
  .mi:disabled:hover { background: none; }
  .msep { height: 1px; background: #3d3d3d; margin: 6px 4px; }
  .mh { font-size: 11px; font-weight: 700; color: var(--m-text-2); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .3px; }

  /* ---------- Modals ---------- */
  .modal-host { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0, 0, 0, .55); padding: 16px; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: min(460px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: #262626; color: var(--m-text); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .55); overflow: hidden; animation: pop .15s ease; }
  .modal.wide { width: min(760px, 100%); }
  .modal.mid { width: min(560px, 100%); }
  .modal-h { display: flex; align-items: center; gap: 8px; padding: 14px 12px 6px 20px; flex: none; }
  .modal-h h2 { flex: 1; font-size: 17px; font-weight: 700; }
  .modal-b { padding: 8px 20px 16px; overflow: auto; min-height: 0; }
  .modal-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px 16px; flex: none; border-top: 1px solid #383838; flex-wrap: wrap; }
  .modal-f .grow { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .flabel { font-size: 13px; font-weight: 700; color: var(--m-text-2); }
  .inp { height: 36px; border: 1px solid #454545; border-radius: 8px; padding: 0 12px; background: #1c1c1c; color: var(--m-text); outline: 0; width: 100%; min-width: 0; }
  .inp:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(11, 92, 255, .25); }
  .chk { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; user-select: none; font-size: 14px; }
  .chk input { width: 16px; height: 16px; accent-color: var(--blue); flex: none; margin: 0; }
  .fine { font-size: 13px; color: var(--m-text-2); line-height: 19px; }

  /* ---------- Toast (in-meeting notification) ---------- */
  .toast { position: fixed; left: 50%; top: 88px; transform: translate(-50%, -12px); z-index: 120; background: rgba(58, 58, 58, .97); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- After leaving ---------- */
  .ended { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 24px; background: var(--m-bg); text-align: center; }
  .ended-card h1 { font-size: 22px; line-height: 30px; font-weight: 700; margin-bottom: 6px; }
  .ended-card p { color: var(--m-text-2); font-size: 13px; }
  .ended-card .acts { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  .ended-card .btn { height: 36px; padding: 0 24px; }
  .wr-logo { width: 56px; height: 56px; margin: 0 auto 20px; }
  .wr-logo svg { width: 56px; height: 56px; }

  /* ---------- In-meeting ---------- */
  .call { position: fixed; inset: 0; z-index: 40; background: var(--m-bg); color: var(--m-text); display: grid; grid-template-rows: 40px minmax(0, 1fr) 68px; font-size: 13px; }
  .c-top { display: flex; align-items: center; gap: 8px; padding: 0 10px; position: relative; z-index: 3; min-width: 0; }
  .c-top .grow { flex: 1; }
  .ctb { height: 28px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; color: var(--m-text); font-size: 13px; white-space: nowrap; }
  .ctb:hover { background: var(--m-hover); }
  .ctb svg { width: 18px; height: 18px; }
  .shield { color: #23d959; width: 28px; padding: 0; justify-content: center; }
  .shield svg { width: 20px; height: 20px; }
  .c-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; color: var(--m-text-2); font-size: 13px; max-width: 40%; pointer-events: none; }
  .c-title b { color: var(--m-text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-title .timer { font-variant-numeric: tabular-nums; flex: none; }
  .rec-ind { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 2px 0 10px; border-radius: 6px; background: #2c2c2c; font-size: 12px; color: var(--m-text); white-space: nowrap; }
  .rec-ind .rd { width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; margin-right: 6px; animation: recblink 1.6s infinite; }
  .rec-ind.paused .rd { animation: none; background: #8a8a8a; }
  .rec-ind .cl { width: 14px; height: 14px; margin-right: 4px; color: var(--m-text-2); }
  @keyframes recblink { 50% { opacity: .35; } }
  .rec-ind button { width: 26px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--m-text); margin-left: 2px; }
  .rec-ind button:hover { background: #3d3d3d; }
  .rec-ind button svg { width: 14px; height: 14px; }
  .rec-ind .lbl { margin-right: 4px; }
  .c-end-top { display: none; }
  .c-body { position: relative; display: flex; min-height: 0; min-width: 0; }
  .stage { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }

  /* Tiles */
  .tile { position: relative; background: var(--m-tile); border-radius: 8px; overflow: hidden; flex: none; container-type: size; }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow .15s; }
  .tile.spk::after { box-shadow: inset 0 0 0 3px var(--spk); }
  .tile .vid, .selfv .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile.me .vid, .selfv .vid { transform: scaleX(-1); }
  .tile .pp { position: absolute; inset: 0; margin: auto; height: 42%; aspect-ratio: 1; border-radius: 18%; object-fit: cover; }
  .tile .nm-big, .nm-big { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 8%; color: #fff; font-size: clamp(14px, 11cqw, 44px); font-weight: 400; line-height: 1.2; }
  .t-name { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); display: inline-flex; align-items: center; gap: 4px; background: rgba(20, 20, 20, .72); color: #fff; border-radius: 5px; padding: 2px 7px 2px 5px; font-size: 12px; line-height: 18px; white-space: nowrap; }
  .t-name span { overflow: hidden; text-overflow: ellipsis; }
  .t-name svg { width: 14px; height: 14px; }
  .t-name .mm { color: #ff4d4d; }
  .t-name .lv { color: #fff; display: none; }
  .tile.spk .t-name .lv { display: inline-flex; }
  .t-name .lv .fill { fill: var(--spk); }
  .t-badges { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; }
  .t-badges span { height: 28px; min-width: 28px; padding: 0 5px; border-radius: 6px; background: rgba(20, 20, 20, .72); display: grid; place-items: center; font-size: 17px; line-height: 1; }
  .t-badges .fb-txt { font-size: 11px; font-weight: 700; padding: 0 7px; color: #fff; }
  .t-badges .rx-slot { background: none; min-width: 0; padding: 0; height: auto; }
  .t-badges .rx-slot:empty { display: none; }
  .t-react { font-style: normal; display: block; font-size: 30px; line-height: 30px; pointer-events: none; animation: reactin 5s ease forwards; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4)); }
  @keyframes reactin { 0% { transform: scale(.3); opacity: 0; } 8% { transform: scale(1.18); opacity: 1; } 14% { transform: scale(1); } 88% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-8px); } }
  .t-more { position: absolute; right: 6px; top: 6px; width: 30px; height: 26px; border-radius: 6px; background: rgba(20, 20, 20, .72); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .12s; }
  .t-more svg { width: 16px; height: 16px; }
  .tile:hover .t-more, .t-more:focus-visible { opacity: 1; }
  .t-pin { position: absolute; right: 6px; bottom: 6px; background: rgba(20, 20, 20, .72); border-radius: 5px; padding: 2px 6px; font-size: 11px; color: #fff; display: flex; align-items: center; gap: 4px; }
  .t-pin svg { width: 12px; height: 12px; }
  /* Virtual backgrounds for the self tile */
  .selfv { position: absolute; inset: 0; overflow: hidden; }
  .selfv .vbg { position: absolute; inset: 0; }
  .selfv .vbg.blurred { width: 100%; height: 100%; object-fit: cover; filter: blur(16px) brightness(.95); transform: scale(1.15) scaleX(-1); }
  .selfv .vid.fit { width: auto; height: 100%; aspect-ratio: 1; left: 50%; right: auto; transform: translateX(-50%); object-fit: cover; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .tile.me .selfv .vid.fit, .bgp-prev .selfv .vid.fit { transform: translateX(-50%) scaleX(-1); }
  .tile:not(.me) .selfv .vbg.blurred { transform: scale(1.3); }
  .selfv .vbg.blurred:has(+ .vid.fit) { filter: blur(30px) brightness(.72) saturate(.9); transform: scale(1.3); }
  @container (max-aspect-ratio: 1/1) {
    .selfv .vid.fit { width: 100%; height: 100%; left: 0; transform: none; -webkit-mask-image: none; mask-image: none; }
    .tile.me .selfv .vid.fit { transform: scaleX(-1); }
  }
  .selfv .vid.fit.cut { -webkit-mask-image: radial-gradient(ellipse 44% 50% at 50% 58%, #000 64%, transparent 100%); mask-image: radial-gradient(ellipse 44% 50% at 50% 58%, #000 64%, transparent 100%); }
  .bg-sunset { background: linear-gradient(180deg, #2a2f6b 0%, #7a3f8f 38%, #f07a5a 68%, #ffc86b 100%); }
  .bg-sunset::after { content: ""; position: absolute; left: 50%; bottom: 18%; width: 34%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, #ffe7a3 0%, #ffb65c 60%, rgba(255, 182, 92, 0) 72%); }
  .bg-office { background: linear-gradient(180deg, #e9e4dc 0 62%, #b8926a 62% 66%, #8a6a4a 66% 100%); }
  .bg-office::before { content: ""; position: absolute; left: 8%; top: 12%; width: 26%; height: 36%; background: linear-gradient(180deg, #bcd8ef, #e6f0f8); border: 5px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
  .bg-office::after { content: ""; position: absolute; right: 8%; top: 20%; width: 12%; height: 42%; background: radial-gradient(ellipse at 50% 30%, #4f8a4a 0 45%, transparent 46%), linear-gradient(#8a6a4a, #8a6a4a) 50% 100% / 30% 30% no-repeat; }
  .bg-aurora { background: radial-gradient(80% 60% at 30% 30%, rgba(80, 255, 190, .55), transparent 60%), radial-gradient(70% 60% at 75% 25%, rgba(120, 110, 255, .6), transparent 60%), linear-gradient(180deg, #0a1030, #102048 60%, #0b1224); }
  .bg-beach { background: linear-gradient(180deg, #8fd3ff 0 55%, #2aa3d8 55% 68%, #f3dcae 68% 100%); }
  .bg-beach::after { content: ""; position: absolute; left: 12%; top: 10%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: #fff6c9; box-shadow: 0 0 40px 12px rgba(255, 246, 201, .7); }
  .bg-casuro { background: radial-gradient(60% 80% at 80% 20%, #3b7bff, transparent 60%), linear-gradient(135deg, #0b1b44, #0b5cff); }
  .bg-casuro::after { content: "casuro"; position: absolute; right: 7%; top: 8%; color: rgba(255, 255, 255, .85); font-weight: 900; font-size: clamp(10px, 7cqw, 28px); letter-spacing: -.5px; }

  /* Gallery */
  .gallery { position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; }
  .g-wrap { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6px; }
  .g-wrap .tile { width: var(--tw); height: var(--th); }
  /* Speaker + filmstrip */
  .spkv { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .strip { flex: none; height: 104px; display: flex; gap: 6px; justify-content: center; padding: 6px 8px 0; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .tile { height: 96px; width: 171px; }
  .strip .tile .t-name { font-size: 11px; line-height: 16px; left: 4px; bottom: 4px; }
  .strip .tile .pp { height: 52%; }
  .strip .tile .t-badges span, .strip .tile .t-react { transform: scale(.8); transform-origin: top left; }
  .spk-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; }
  .spk-main .tile { width: var(--tw); height: var(--th); }
  /* Shared screen */
  .sharev { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .viewbar { flex: none; display: flex; justify-content: center; padding: 6px 0 0; }
  .viewbar .pill { display: inline-flex; align-items: center; gap: 10px; height: 30px; padding: 0 4px 0 12px; border-radius: 8px; background: var(--share-green); color: #fff; font-size: 13px; font-weight: 700; max-width: calc(100% - 16px); }
  .viewbar .pill > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewbar .pill button { height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(0, 0, 0, .18); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .viewbar .pill button:hover { background: rgba(0, 0, 0, .3); }
  .viewbar .pill button svg { width: 12px; height: 12px; }
  .sv-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sv-body.sbs { flex-direction: row-reverse; }
  .sv-thumbs { flex: none; }
  .sv-body.sbs .sv-thumbs { width: 26%; min-width: 200px; max-width: 360px; display: flex; flex-direction: column; gap: 6px; padding: 6px; overflow: auto; height: auto; justify-content: flex-start; }
  .sv-body.sbs .sv-thumbs .tile { width: 100%; height: auto; aspect-ratio: 16/9; }
  .sv-screen { flex: 1; min-height: 0; min-width: 0; position: relative; }
  .scr-fit { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform-origin: center; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, .4); }
  .anno { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; }
  .anno.drawing { cursor: crosshair; }
  .anno:not(.drawing) { pointer-events: none; }
  .anno-bar { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 8; display: flex; gap: 2px; background: #f7f7f7; color: #333; border-radius: 10px; padding: 4px; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); max-width: calc(100% - 16px); overflow-x: auto; scrollbar-width: none; }
  .anno-bar button { min-width: 50px; height: 44px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: #444; padding: 0 4px; }
  .anno-bar button svg { width: 18px; height: 18px; }
  .anno-bar button:hover { background: #e9e9e9; }
  .anno-bar button.on { background: #dfe9ff; color: #0b5cff; }
  .anno-bar .sw { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; }
  .anno-bar .x { color: #e02828; }

  /* Fake apps drawn inside a shared screen (fixed 1280x800, scaled to fit) */
  .fx { position: absolute; inset: 0; font-family: Lato, "Segoe UI", sans-serif; font-size: 13px; color: #222; }
  .cv { background: #e9e9ec; display: grid; grid-template-rows: 44px 1fr; }
  .cv-top { background: #2c2c2c; color: #ddd; display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px; }
  .cv-top .lg { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #a259ff, #ff7262); }

  /* My desktop (document) */

  /* Whiteboard */

  /* Captions */

  /* In-meeting notices (e.g. waiting room arrivals) */
  .c-notice { position: absolute; right: 16px; bottom: 12px; z-index: 12; width: 320px; max-width: calc(100% - 24px); background: #2f2f2f; border: 1px solid #444; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); padding: 14px 14px 12px; animation: pop .18s ease; }
  .c-side:not([hidden]) ~ #cNotice .c-notice { right: 356px; }

  .c-notice .x { position: absolute; right: 6px; top: 6px; }

  /* Toolbar */
  .c-bar { display: flex; align-items: center; gap: 2px; padding: 0 12px; background: var(--m-bar); border-top: 1px solid #2a2a2a; min-width: 0; }
  .c-bar .mid { flex: 1; display: flex; justify-content: center; gap: 2px; min-width: 0; overflow: hidden; }
  .c-bar .side { display: flex; gap: 2px; align-items: center; flex: none; min-width: 190px; }
  .c-bar .side.r { justify-content: flex-end; }
  .ti { position: relative; display: flex; }
  .tbtn { position: relative; min-width: 70px; height: 58px; padding: 6px 6px 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; color: #d0d0d0; font-size: 11.5px; line-height: 14px; white-space: nowrap; }

  .tbtn .ico { position: relative; height: 26px; display: grid; place-items: center; }

  .tbtn .badge { position: absolute; left: 60%; top: -4px; }

  .caret { position: absolute; right: 2px; top: 6px; width: 20px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: #bdbdbd; z-index: 1; }

  .share-ico { width: 30px; height: 26px; border-radius: 7px; background: #1fb556; display: grid; place-items: center; color: #fff; }

  .end-btn { height: 34px; padding: 0 18px; border-radius: 8px; background: var(--red); color: #fff; font-weight: 700; font-size: 13px; margin-left: 8px; white-space: nowrap; }

  /* Side panels */

  /* Reactions tray */

  .shp-item:hover { background: #2f2f2f; }
  .shp-item.on { border-color: #0b5cff; color: #fff; }
  .shp-item .th { aspect-ratio: 16/10; border-radius: 6px; margin-bottom: 6px; overflow: hidden; position: relative; background: #3a3a3a; display: grid; place-items: center; }
  .shp-item .th svg { width: 30px; height: 30px; color: #fff; }
  .shp-item .th .mini-doc { position: absolute; inset: 10% 12%; background: #fff; border-radius: 3px; }
  .shp-item .th .mini-doc::before { content: ""; position: absolute; left: 12%; right: 30%; top: 16%; height: 8%; background: #333; border-radius: 1px; box-shadow: 0 14px 0 -1px #bbb, 0 24px 0 -1px #bbb, 0 34px 0 -1px #bbb; }
  .shp-item .th.desk-th { background: linear-gradient(135deg, #2b4a8a, #6b8fd6 55%, #a9c1ee); }
  .shp-item .th.cv-th { background: #e9e9ec; }
  .shp-item .th.cv-th::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14%; background: #2c2c2c; }
  .shp-item .th.cv-th::after { content: ""; position: absolute; left: 34%; top: 28%; width: 16%; height: 60%; background: #fff; border-radius: 4px; box-shadow: 34px 0 0 #fff; }
  .shp-item .th.term-th { background: #111; }
  .shp-item .th.term-th::before { content: "$ npm run dev"; position: absolute; left: 8px; top: 8px; font-family: Menlo, monospace; font-size: 9px; color: #23d959; }
  .shp-item .th.wb-th { background: #fff; background-image: radial-gradient(#d9dbe0 1px, transparent 1px); background-size: 8px 8px; }
  .shp-item .th.wb-th svg { color: #0b5cff; }
  .shp-opts { display: flex; gap: 20px; flex-wrap: wrap; }
  .shp-opts .chk { font-size: 13px; color: var(--m-text-2); }

  /* My own screen share: window gets out of the way, green frame + floating controls */
  .myshare { position: absolute; inset: 0; z-index: 20; background: #000; }
  .myshare .scr-host { position: absolute; inset: 0; }
  .myshare .frame { position: absolute; inset: 0; border: 4px solid var(--share-green-2); pointer-events: none; z-index: 9; }
  .sc-ctl { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100% - 16px); }
  .sc-pill { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 4px 0 12px; border-radius: 9px; background: var(--share-green); color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); white-space: nowrap; }
  .sc-pill .id { font-weight: 400; opacity: .9; padding-right: 10px; border-right: 1px solid rgba(255, 255, 255, .35); }
  .sc-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .sc-pill.paused { background: #8a6d12; }
  .sc-stop { height: 26px; padding: 0 12px; border-radius: 6px; background: var(--red); color: #fff; font-weight: 700; font-size: 12px; }
  .sc-stop:hover { background: var(--red-h); }
  .sc-bar { display: flex; gap: 2px; background: #1f1f1f; border-radius: 12px; padding: 4px; box-shadow: 0 10px 28px rgba(0, 0, 0, .45); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .sc-bar .tbtn { min-width: 62px; height: 52px; font-size: 11px; }
  .sc-bar .tbtn .ico svg { width: 22px; height: 22px; }
  .sc-bar .tbtn .ico { height: 22px; }
  .sc-float { position: absolute; right: 16px; top: 16px; z-index: 10; width: 240px; border-radius: 10px; overflow: hidden; background: #1f1f1f; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); border: 1px solid #3a3a3a; }
  .sc-float .tile { width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 0; }
  .sc-float .fh { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; color: var(--m-text-2); }
  .call.selfshare .c-side { position: absolute; z-index: 30; right: 16px; top: 120px; bottom: 16px; height: auto; border-radius: 12px; border: 1px solid #3a3a3a; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, .55); }
  .call.selfshare .c-bar { visibility: hidden; }
  .paused-veil { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(0, 0, 0, .45); color: #fff; font-size: 22px; font-weight: 700; pointer-events: none; }

  /* Phone-only swipe pages in meeting */
  .pages { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .pages::-webkit-scrollbar { display: none; }
  .pg { flex: 0 0 100%; height: 100%; scroll-snap-align: start; position: relative; padding: 4px; }
  .pg.grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; }
  .pg.grid .tile { width: 100%; height: 100%; }
  .pg .tile.full { width: 100%; height: 100%; border-radius: 10px; }
  .pip { position: absolute; right: 12px; bottom: 12px; width: 96px; height: 128px; z-index: 3; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
  .pip .tile { width: 100%; height: 100%; }
  .pip .t-name { font-size: 10px; line-height: 14px; }
  .page-dots { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; gap: 6px; z-index: 4; }
  .page-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
  .page-dots i.on { background: #fff; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    /* Tablet: side panels float over the stage */
    .c-side { position: absolute; right: 0; top: 0; bottom: 0; z-index: 15; box-shadow: -12px 0 30px rgba(0, 0, 0, .45); }
  }
  @media (max-width: 760px) {
    .modal-host { padding: 0; place-items: end center; }
    .modal, .modal.wide, .modal.mid { width: 100%; border-radius: 16px 16px 0 0; max-height: 92dvh; }
    /* Meeting on phones */
    .call { grid-template-rows: 48px minmax(0, 1fr) 64px; }
    .c-title { position: static; transform: none; max-width: none; flex: 1; min-width: 0; justify-content: center; }
    .c-top .grow { display: none; }
    .view-btn .lbl, .fs-btn { display: none !important; }
    .c-end-top { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; margin-left: 0; font-size: 12px; }
    .c-bar { padding: 0 4px; }
    .c-bar .side.r { display: none; }
    .c-bar .mid { justify-content: space-around; }
    .c-bar .side.l, .c-bar .mid { gap: 0; }
    .c-bar { justify-content: space-around; }
    .tbtn { min-width: 0; width: 72px; height: 56px; font-size: 11px; padding-left: 2px; padding-right: 2px; }
    .ti.split .tbtn { min-width: 0; padding-right: 2px; }
    .ti.split .caret { display: none; }
    .c-bar .side { min-width: 0; }
    .c-side { position: fixed; inset: 0; width: auto; z-index: 60; border-left: 0; box-shadow: none; }
    .panel + .panel { display: none; }
    .rec-ind .lbl { display: none; }
    .c-notice { left: 12px; right: 12px; width: auto; }
    .sc-ctl { width: calc(100% - 16px); }
    .sc-bar { flex-wrap: wrap; justify-content: center; }
    .sc-bar .tbtn { width: 68px; min-width: 0; font-size: 10px; padding-left: 2px; padding-right: 2px; }
    .sc-bar .tbtn .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .sc-float { width: 128px; top: auto; bottom: 16px; }
    .sc-pill .id { display: none; }
    .minfo { width: auto; }
    .rx { width: auto; }
    .rx-emo button { width: 40px; }
    .captions { font-size: 14px; line-height: 20px; }
    .bgp-grid { grid-template-columns: repeat(3, 1fr); }
    .shp-grid { grid-template-columns: repeat(2, 1fr); }
    .anno-bar button { min-width: 44px; }
    .toast { top: 94px; }
    .c-side:not([hidden]) ~ #cNotice .c-notice { right: 12px; }
  }
</style>
</head>

// ---------- Popover menus ----------
let menuKey = null;
function openMenu(anchor, html, { key = "", place = "bottom", align = "center" } = {}) {
  const m = $("#menu");
  if (!m.hidden && key && menuKey === key) { closeMenu(); return false; }
  menuKey = key;
  m.innerHTML = html; m.hidden = false;
  m.style.left = m.style.top = ""; m.style.visibility = "hidden";
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let left = align === "start" ? r.left : align === "end" ? r.right - w : r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = place === "top" ? r.top - h - 8 : r.bottom + 6;
  if (place === "top" && top < 8) top = r.bottom + 6;
  if (place === "bottom" && top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  m.style.left = left + "px"; m.style.top = top + "px"; m.style.visibility = "";
  $$(".prow.menu-open").forEach(x => x.classList.remove("menu-open"));
  anchor.closest(".prow")?.classList.add("menu-open");
  return true;
}
function closeMenu() { const m = $("#menu"); m.hidden = true; m.innerHTML = ""; menuKey = null; $$(".prow.menu-open").forEach(x => x.classList.remove("menu-open")); }

// ---------- Layout math ----------
function fit(n, W, H, gap = 6, ar = 16 / 9) {

    const rows = Math.ceil(n / cols);
    let w = (W - gap * (cols - 1)) / cols, h = w / ar;
    if (h * rows + gap * (rows - 1) > H) { h = (H - gap * (rows - 1)) / rows; w = h * ar; }
    if (w > best.w) best = { w: Math.floor(w), h: Math.floor(h), cols };
  }
  return best;
}
function layoutScreen(host, scr, fitIt = true) {

  const W = host.clientWidth, H = host.clientHeight;
  if (!fitIt) { scr.style.transform = "none"; scr.style.left = scr.style.top = "0"; scr.style.position = "relative"; return; }
  const k = Math.min(W / 1280, H / 800) * (host.id === "myHost" ? 1 : .98);
  scr.style.position = ""; scr.style.left = scr.style.top = "";
  scr.style.transform = `translate(-50%, -50%) scale(${k})`;
}
function layoutStage() {
  const st = $("#stage"); if (!st || !call) return;
  const g = $("#gwrap");
  if (g) {
    const n = g.children.length, W = st.clientWidth - 12, H = st.clientHeight - 12;
    const b = fit(n, W, H);
    g.style.setProperty("--tw", b.w + "px"); g.style.setProperty("--th", b.h + "px");
    g.style.width = (b.cols * b.w + (b.cols - 1) * 6) + "px";
  }
  const sm = $("#spkMain");
  if (sm) { const n = +sm.dataset.n, b = fit(n, sm.clientWidth - 12, sm.clientHeight - 12); sm.style.setProperty("--tw", b.w + "px"); sm.style.setProperty("--th", b.h + "px"); }
  const imm = $("#immScene");
  if (imm) { const b = fit(1, st.clientWidth - 24, st.clientHeight - 24); imm.style.setProperty("--tw", b.w + "px"); imm.style.setProperty("--th", b.h + "px"); }
  const sv = $("#svScreen");
  if (sv) layoutScreen(sv, $("#scr"), call.share?.fit !== false || call.share?.kind === "whiteboard");
  if ($("#myHost")) layoutScreen($("#myHost"), $("#myScr"), true);
}

function captionText() {

  if (!id) return `<span style="color:#bbb">Captions are on. Waiting for someone to speak...</span>`;

setInterval(() => {
  const c = call; if (!c) return;

  let next = null;
  if (c.share && c.share.who !== ME && cands.includes(c.share.who) && Math.random() < .7) next = c.share.who;
  else if (cands.length) next = cands.includes(c.active) && Math.random() < .45 ? c.active : rand(cands);
  if (c.audio && !c.muted.has(ME) && Math.random() < .15) next = ME;

// ---------- Reactions & hands ----------
function react(id, e) {
  const c = call; if (!c || !c.people.includes(id)) return;

  $$(`[data-rx="${id}"]`).forEach(s => s.innerHTML = `<i class="t-react">${e}</i>`);
  setTimeout(() => { if (call === c && c.reacts.get(id)?.e === e && Date.now() - c.reacts.get(id).t >= 4900) { c.reacts.delete(id); $$(`[data-rx="${id}"]`).forEach(s => s.innerHTML = ""); } }, 5000);
}

// ---------- Chat ----------
function addChat(from, to, text, extra = {}) {
  const c = call; if (!c) return;
  c.chat.push({ from, to, text, t: Date.now(), ...extra });
  if (!c.panels.chat && from !== ME) { c.unread++; renderBar(); if (!isPhone()) toast(`${dname(from)}: ${text || extra.file}`); }
  if (c.panels.chat) renderSide();
}
function sendChat() {
  const c = call, text = c.draft.trim(); if (!text) return;
  const to = c.chatTo;
  c.draft = ""; addChat(ME, to, text); renderSide();
  const responders = to === "everyone" ? c.people.filter(p => p !== ME) : [to];
  if (responders.length && c.people.includes(responders[0])) later(1600 + Math.random() * 1800, () => {
    const who = rand(responders.filter(r => c.people.includes(r)));
    if (who) addChat(who, to === "everyone" ? "everyone" : ME, rand(to === "everyone" ? CHAT_LINES : DM_REPLIES));
  });
}

    else if (call?.notice) A.noticeClose();
    return;
  }
  if (!call || state.modal) return;
  const code = e.code;
  if (mod && e.shiftKey && code === "KeyA") { e.preventDefault(); A.toggleMic(); }
  else if (mod && e.shiftKey && code === "KeyV") { e.preventDefault(); A.toggleVideo(); }
  else if (mod && e.shiftKey && code === "KeyS") { e.preventDefault(); call.share?.who === ME ? A.stopShare() : A.shareDlg(); }
  else if (mod && e.shiftKey && code === "KeyH") { e.preventDefault(); A.togglePanel("chat"); }
  else if (mod && !e.shiftKey && code === "KeyU") { e.preventDefault(); A.togglePanel("participants"); }
  else if (mod && code === "KeyW") { e.preventDefault(); const b = isPhone() ? $(".c-end-top") : $("#cBar .end-btn"); if (b) A.endMenu(null, b); }
  else if (e.altKey && !mod && code === "KeyY") { e.preventDefault(); A.raiseHand(); }
  else if (k === " " && !inField && call.muted.has(ME) && call.audio && !e.repeat) { e.preventDefault(); call.muted.delete(ME); call.ptt = true; rerenderCallBits(); }
});
document.addEventListener("keyup", e => { if (e.key === " " && call?.ptt) { call.ptt = false; call.muted.add(ME); rerenderCallBits(); } });
document.addEventListener("scroll", e => {
  if (e.target.id !== "pages" || !call) return;
  const p = e.target, i = Math.round(p.scrollLeft / p.clientWidth);

}, true);

  if (call) {

    else { layoutStage(); fitBar(); if ($("#myHost")) layoutScreen($("#myHost"), $("#myScr"), true); }
  }
});

setInterval(() => { if (call) $$("[data-timer]").forEach(el => el.textContent = clock(Date.now() - call.started)); }, 1000);

// Test hooks for verification
window.__zoom = { state, get call() { return call; }, lenaShare, arriveWaiting, react, raiseHand, addPerson };
