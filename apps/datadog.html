<style>
  :root {
    color-scheme: light;
    --bg: #f8f8fa;
    --surface: #ffffff;
    --surface-2: #f8f8fa;
    --surface-3: #f0f0f4;
    --surface-4: #e7e7ed;
    --border: #e1e1e6;
    --border-strong: #cdcdd6;
    --text: #28283b;
    --text-2: #5c5c73;
    --text-3: #8a8aa0;
    --link: #3b5ec4;
    --brand: #632ca6;
    --brand-hover: #5423919c;
    --brand-strong: #52218f;
    --brand-text: #632ca6;
    --brand-soft: #f2ebfb;
    --brand-soft-2: #e6d9f7;
    --ok: #2ea44f;
    --ok-bg: #e5f5ea;
    --ok-text: #1f7a3a;
    --warn: #f5a623;
    --warn-bg: #fef3de;
    --warn-text: #9a5d00;
    --alert: #e0373d;
    --alert-bg: #fde8e9;
    --alert-text: #c1272d;
    --nodata: #9797ab;
    --nodata-bg: #eeeef3;
    --info: #3d6ecf;
    --nav: #24163a;
    --nav-2: #2e1d49;
    --nav-hover: rgba(255,255,255,.09);
    --nav-active: rgba(255,255,255,.16);
    --nav-text: rgba(255,255,255,.84);
    --nav-dim: rgba(255,255,255,.55);
    --flyout: #ffffff;
    --grid: #ececf1;
    --axis: #8a8aa0;
    --hover: rgba(40,40,59,.05);
    --hover-2: rgba(40,40,59,.08);
    --sel: #eef2fc;
    --sel-border: #b8c7ef;
    --tip-bg: #1e1e2c;
    --tip-text: #f4f4f8;
    --tip-dim: #a9a9bd;
    --note: #fff8e1;
    --note-border: #f1e2b3;
    --code-bg: #f6f6f9;
    --json-key: #7a3fbf;
    --json-str: #1f7a3a;
    --json-num: #b35c00;
    --json-bool: #3b5ec4;
    --focus: #3b5ec4;
    --scrim: rgba(22,16,36,.38);
    --shadow-1: 0 1px 2px rgba(28,28,48,.06);
    --shadow-2: 0 4px 16px rgba(28,28,48,.12), 0 0 0 1px rgba(28,28,48,.06);
    --shadow-3: 0 12px 40px rgba(20,16,36,.22), 0 0 0 1px rgba(28,28,48,.06);
    --toast: #28283b;
    --toast-text: #ffffff;
    --heat-0: #f4effb;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15151e;
    --surface: #1d1d29;
    --surface-2: #191923;
    --surface-3: #262634;
    --surface-4: #30303f;
    --border: #30303f;
    --border-strong: #42425a;
    --text: #e7e7f0;
    --text-2: #b3b3c7;
    --text-3: #83839c;
    --link: #8ea9ff;
    --brand: #7a3fc8;
    --brand-strong: #8d55d8;
    --brand-text: #bd97f4;
    --brand-soft: #2c2140;
    --brand-soft-2: #3a2b56;
    --ok: #3fb865;
    --ok-bg: rgba(63,184,101,.16);
    --ok-text: #6fd690;
    --warn: #f5a623;
    --warn-bg: rgba(245,166,35,.16);
    --warn-text: #ffc266;
    --alert: #ee4c52;
    --alert-bg: rgba(238,76,82,.16);
    --alert-text: #ff8a8e;
    --nodata: #7c7c93;
    --nodata-bg: rgba(124,124,147,.2);
    --info: #6b93ea;
    --nav: #120b1e;
    --nav-2: #1b1229;
    --flyout: #232331;
    --grid: #2a2a38;
    --axis: #8a8aa3;
    --hover: rgba(255,255,255,.05);
    --hover-2: rgba(255,255,255,.08);
    --sel: #25304d;
    --sel-border: #3d5392;
    --tip-bg: #2d2d3e;
    --tip-text: #f1f1f7;
    --tip-dim: #a2a2b8;
    --note: #2d2a1c;
    --note-border: #4a4326;
    --code-bg: #181822;
    --json-key: #c49bff;
    --json-str: #7fd69a;
    --json-num: #ffb46b;
    --json-bool: #8ea9ff;
    --focus: #8ea9ff;
    --scrim: rgba(0,0,0,.55);
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 6px 20px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    --shadow-3: 0 16px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07);
    --toast: #f1f1f7;
    --toast-text: #1d1d29;
    --heat-0: #262036;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 18px; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  svg { flex: none; }
  .i { width: 16px; height: 16px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  ::selection { background: rgba(99,44,166,.2); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Buttons, inputs, chips ---------- */
  .btn {
    height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface);
    display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; color: var(--text); flex: none;
  }
  .btn:hover { background: var(--surface-3); }
  .btn .i { width: 14px; height: 14px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--hover-2); }
  .btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
  .icon-btn { width: 28px; height: 28px; border-radius: 4px; display: inline-grid; place-items: center; color: var(--text-2); flex: none; position: relative; }
  .icon-btn:hover { background: var(--hover-2); color: var(--text); }
  .icon-btn .i { width: 16px; height: 16px; }
  .status {
    display: inline-flex; align-items: center; justify-content: center; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11px; font-weight: 700;
    letter-spacing: .02em; text-transform: uppercase; color: #fff; white-space: nowrap; min-width: 52px;
  }
  .status.alert { background: var(--alert); }
  .status.warn { background: var(--warn); color: #3d2a00; }
  .status.ok { background: var(--ok); }
  .status.nodata { background: var(--nodata); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.alert { background: var(--alert); } .dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); } .dot.nodata { background: var(--nodata); }
  .av { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; display: inline-block; background: var(--surface-3); vertical-align: middle; }
  .av.sm { width: 20px; height: 20px; } .av.lg { width: 32px; height: 32px; }
  .muted { color: var(--text-3); }
  .sub { color: var(--text-2); }
  .logo-i { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; }
  .logo-i svg { width: 100%; height: 100%; }
  .aws-mark { color: #ff9900; }
  :root[data-theme="dark"] .gh-mark path { fill: #e7e7f0; }

  /* ---------- App frame ---------- */
  .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #view { flex: 1; min-height: 0; overflow: auto; position: relative; }
  #view.fill { overflow: hidden; display: flex; flex-direction: column; }

  /* ---------- Left navigation ---------- */
  .nav {
    width: 196px; flex: none; background: var(--nav); color: var(--nav-text); display: flex; flex-direction: column; z-index: 40;
    position: relative; transition: width .15s ease;
  }
  .nav-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; height: 52px; flex: none; }
  .nav-logo { width: 26px; height: 28px; display: grid; place-items: center; flex: none; }
  .nav-logo svg { width: 26px; height: 28px; }
  .nav-logo svg path { fill: #fff; }
  .nav-org { min-width: 0; line-height: 15px; }
  .nav-org b { display: block; font-size: 13px; color: #fff; font-weight: 600; }
  .nav-org span { font-size: 11px; color: var(--nav-dim); }
  .nav-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 8px; scrollbar-width: none; }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-sep { height: 1px; background: rgba(255,255,255,.1); margin: 6px 6px; }
  .nav-item { position: relative; }
  .nav-link {
    display: flex; align-items: center; gap: 11px; height: 32px; padding: 0 9px; border-radius: 5px; color: var(--nav-text); width: 100%;
    font-size: 13px; font-weight: 500; white-space: nowrap; position: relative;
  }
  .nav-link:hover { background: var(--nav-hover); color: #fff; text-decoration: none; }
  .nav-link.active { background: var(--nav-active); color: #fff; }
  .nav-link.active::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: #b48cf0; }
  .nav-link .i { width: 18px; height: 18px; opacity: .92; }
  .nav-link .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .nav-link .badge {
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--alert); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-grid; place-items: center; line-height: 1;
  }
  .nav-link .av { width: 20px; height: 20px; margin-left: -1px; }
  .nav-bottom { padding: 6px 8px 10px; flex: none; border-top: 1px solid rgba(255,255,255,.08); }
  .nav-collapse { color: var(--nav-dim); }
  .app.nav-collapsed .nav { width: 56px; }
  .app.nav-collapsed .nav-org, .app.nav-collapsed .nav-link .lbl { display: none; }
  .app.nav-collapsed .nav-link { justify-content: center; padding: 0; gap: 0; }
  .app.nav-collapsed .nav-top { padding: 12px 15px 10px; }
  .app.nav-collapsed .nav-link .badge { position: absolute; top: 2px; right: 3px; }
  .app.nav-collapsed .nav-collapse .i { transform: rotate(180deg); }
  .mobile-bar { display: none; }
  .nav-scrim { display: none; }

  .star-btn.on { color: #f5a623; }
  .star-btn.on svg { fill: #f5a623; }
  .tv.changed { border-color: var(--brand); }
  .tv.changed .k { background: var(--brand-soft); color: var(--brand-text); }
  .fs-body { display: flex; flex-direction: column; padding: 12px 16px 14px; }
  .fs-body .ch { flex: 1; }
  .fs-query { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--text-2); background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
  .hex-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); padding: 4px 2px 0; flex: none; font-variant-numeric: tabular-nums; }
  .hex-legend i { flex: 1; max-width: 160px; height: 8px; border-radius: 2px; }
  .hex-legend span:last-child { margin-left: auto; }
  .w-logo { width: 15px; height: 15px; display: inline-grid; place-items: center; vertical-align: -3px; margin-right: 6px; }
  .w-logo svg { width: 15px; height: 15px; }
  .w-empty { flex: 1; display: grid; place-items: center; color: var(--text-3); font-size: 12px; text-align: center; padding: 8px; }
  .oncall { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--text-2); flex-wrap: wrap; font-size: 12.5px; }
  .oncall .av + span { margin-right: 6px; }

  /* ---------- Page header ---------- */
  .page-head {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; min-height: 56px; position: sticky; top: 0; z-index: 20;
  }
  .page-head .crumbs { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
  .page-head .crumbs a { color: var(--text-2); }
  .page-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 280px; }
  .page-title h1 { font-size: 18px; line-height: 24px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .page-title .ttl-wrap { min-width: 0; }
  .page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }

  /* ---------- Time picker ---------- */
  .tp { display: inline-flex; align-items: stretch; height: 28px; flex: none; }
  .tp-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; border: 1px solid var(--border-strong);
    border-radius: 4px; background: var(--surface); min-width: 196px; font-weight: 500;
  }
  .tp-btn:hover { background: var(--surface-3); }
  .tp-badge { background: var(--surface-4); color: var(--text-2); font-size: 11px; font-weight: 700; padding: 0 5px; height: 20px; line-height: 20px; border-radius: 3px; min-width: 30px; text-align: center; }
  .tp-btn .tp-label { flex: 1; text-align: left; white-space: nowrap; }
  .tp-btn .i { width: 14px; height: 14px; color: var(--text-3); }
  .tp-btn .i:first-child { color: var(--text-2); margin-left: 4px; }
  .tp-pop { width: 220px; padding: 4px; }
  .tp-pop .opt { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 4px; width: 100%; }
  .tp-pop .opt:hover { background: var(--hover-2); }
  .tp-pop .opt.on { color: var(--brand-text); font-weight: 600; }
  .tp-pop .opt .tp-badge { min-width: 34px; }
  .tp-pop .opt.on .tp-badge { background: var(--brand-soft-2); color: var(--brand-text); }
  .tp-pop .sep { height: 1px; background: var(--border); margin: 6px 0; }

  /* ---------- Menus, popovers, tooltips ---------- */
  .pop {
    position: fixed; z-index: 120; background: var(--flyout); border-radius: 6px; box-shadow: var(--shadow-3); color: var(--text); min-width: 180px;
    max-height: calc(100vh - 16px); overflow: auto;
  }
  .menu { padding: 4px; }
  .menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 10px; border-radius: 4px; white-space: nowrap; }
  .menu .mi:hover { background: var(--hover-2); }
  .menu .mi .i { width: 15px; height: 15px; color: var(--text-2); }
  .menu .mi.on { color: var(--brand-text); font-weight: 600; }
  .menu .mi.on .i { color: var(--brand-text); }
  .menu .mi.danger { color: var(--alert-text); }
  .menu .mi .ck { margin-left: auto; width: 14px; height: 14px; color: var(--brand-text); }
  .menu .sep { height: 1px; background: var(--border); margin: 4px 0; }
  .menu h6 { font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px 2px; }
  .tip {
    position: fixed; z-index: 200; background: var(--tip-bg); color: var(--tip-text); font-size: 12px; line-height: 16px; padding: 5px 8px; border-radius: 4px;
    pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .08s; box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  .tip.show { opacity: 1; }
  .ctip {
    position: fixed; z-index: 190; background: var(--tip-bg); color: var(--tip-text); border-radius: 5px; padding: 8px 10px; font-size: 12px; line-height: 16px;
    pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 340px; display: none;
  }
  .ctip.show { display: block; }
  .ctip .th { color: var(--tip-dim); font-size: 11px; margin-bottom: 5px; white-space: nowrap; }
  .ctip .tr { display: flex; align-items: center; gap: 8px; white-space: nowrap; min-height: 18px; }
  .ctip .tr i { width: 10px; height: 3px; border-radius: 2px; flex: none; }

function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  return (h >>> 0) / 4294967296;

function vnoise(seed, t, period) {

  const a = hash2(seed, i) * 2 - 1, b = hash2(seed, i + 1) * 2 - 1;

function diurnal(t) { const d = new Date(t); const h = d.getHours() + d.getMinutes() / 60; return 1 + .3 * Math.sin((h - 9) / 24 * 2 * Math.PI); }

  const sd = ctxSeed(svc, "rps");

}
function errPct(svc, t) {
  const sd = ctxSeed(svc, "err");
  let v = SVC[svc].err * (1 + .38 * fbm(sd, t, 14 * MIN) + .18 * jit(sd, t));
  if (incidentScope()) {

    if (svc === "checkout") v += inc * (2.75 + .45 * fbm(sd + 3, t, 3 * MIN) + .12 * jit(sd + 5, t));

/* Heatmap: latency distribution over time */
RENDER.heat = function (c) {
  const s = c.build(); c.spec = s;
  c.host.innerHTML = `<div class="ch-svg heat"></div>`;
  const box = c.host.firstChild, W = box.clientWidth, H = box.clientHeight;
  c.g = null;
  if (W < 60 || H < 50) return;
  const { start, end } = s.r, top = 6, bottom = 20;
  const plotH = H - top - bottom;
  const nb = s.edges.length - 1;
  const every = plotH / nb < 13 ? 2 : 1;
  const lbls = s.edges.map(e => e >= 1000 ? e / 1000 + "s" : e + "ms");
  const L = Math.ceil(Math.max(...lbls.map(l => textW(l)))) + 10, R = 8, plotW = W - L - R;
  const X = t => L + (t - start) / (end - start) * plotW;
  const rowH = plotH / nb;
  let max = 0; for (const col of s.cols) for (const v of col.counts) max = Math.max(max, v);
  const stops = heatStops();
  let o = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Latency heatmap"><rect x="${L}" y="${top}" width="${plotW}" height="${plotH}" style="fill:var(--heat-0)"/>`;
  s.cols.forEach(col => {
    const x0 = Math.max(L, X(col.t0)), x1 = Math.min(L + plotW, X(col.t1));
    if (x1 <= x0) return;
    col.counts.forEach((v, b) => {
      if (v < max * .004) return;
      const k = Math.sqrt(v / max);
      o += `<rect class="cell" x="${x0.toFixed(2)}" y="${(top + plotH - (b + 1) * rowH).toFixed(2)}" width="${(x1 - x0 + .35).toFixed(2)}" height="${(rowH + .35).toFixed(2)}" fill="${mixStops(stops, k)}"/>`;
    });
  });
  s.edges.forEach((e, i) => {
    if (i % every) return;
    const y = top + plotH - i * rowH;
    o += `<text x="${L - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${esc(lbls[i])}</text>`;
  });
  let lastRight = -Infinity;
  for (const tk of timeTicks(start, end, plotW)) {
    const x = X(tk.t), w = textW(tk.label);
    if (x - w / 2 < L - 2 || x + w / 2 > W || x - w / 2 < lastRight + 8) continue;
    o += `<text x="${x.toFixed(1)}" y="${top + plotH + 15}" text-anchor="middle">${esc(tk.label)}</text>`;
    lastRight = x + w / 2;
  }
  box.innerHTML = o + `</svg>`;
  c.g = { L, top, plotW, plotH, W, H, X, start, end, invX: x => start + (x - L) / plotW * (end - start) };
  const colAt = t => s.cols.find(col => t >= col.t0 && t < col.t1);
  c.tip = pt => {
    const col = colAt(pt.t);
    if (!col || pt.ly == null) return hideCtip();
    const b = clamp(Math.floor((top + plotH - pt.ly) / rowH), 0, nb - 1);
    const total = col.counts.reduce((a, v) => a + v, 0);
    showCtip(`<div class="th">${esc(fmtFull(col.t0, s.step < MIN))} - ${esc(fmtClock(col.t1, s.step < MIN))}</div>
      <div class="kv"><span>Latency</span><span>${esc(lbls[b])} - ${esc(lbls[b + 1])}</span><span>Requests</span><span>${fmtK(col.counts[b], 1)}</span><span>Share</span><span>${total ? (col.counts[b] / total * 100).toFixed(1) : 0}%</span></div>`, pt);
  };
};

/* Hexagon host map */
RENDER.hex = function (c) {
  const s = c.build(); c.spec = s;
  const hosts = s.hosts;
  c.host.innerHTML = `<div class="hexwrap"></div><div class="hex-legend"><span>0%</span><i style="background:linear-gradient(90deg,${CPU_STOPS.map(x => `${x[1]} ${x[0]}%`).join(",")})"></i><span>100%</span><span>${hosts.length} host${hosts.length === 1 ? "" : "s"}</span></div>`;
  const box = c.host.firstChild, W = box.clientWidth, H = box.clientHeight;
  c.g = null;
  if (W < 40 || H < 40) return;
  if (!hosts.length) { box.innerHTML = `<div class="w-empty" style="height:100%">No hosts match env:${esc(tv().env)} region:${esc(tv().region)}</div>`; return; }
  const N = hosts.length, S3 = Math.sqrt(3);
  let best = { r: 0 };
  for (let cols = 1; cols <= N; cols++) {
    const rows = Math.ceil(N / cols);
    const r = Math.min(W / ((cols + (rows > 1 ? .5 : 0)) * S3), H / ((rows - 1) * 1.5 + 2));
    if (r > best.r) best = { r, cols, rows };
  }
  const r = Math.min(best.r, s.maxR || 30), w = S3 * r;
  const gridW = (best.cols + (best.rows > 1 ? .5 : 0)) * w, gridH = (best.rows - 1) * 1.5 * r + 2 * r;
  const ox = (W - gridW) / 2 + w / 2, oy = (H - gridH) / 2 + r;
  const rr = r * .93;
  let o = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Host map">`;
  hosts.forEach((h, i) => {
    const row = Math.floor(i / best.cols), col = i % best.cols;
    const cx = ox + col * w + (row % 2 ? w / 2 : 0), cy = oy + row * 1.5 * r;
    let d = "";
    for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 90); d += (k ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1); }
    o += `<path class="hex" d="${d}Z" fill="${cpuColor(h.v)}" data-i="${i}"/>`;
  });
  box.innerHTML = o + `</svg>`;
  c.hexTip = (i, pt) => {
    const h = hosts[i];
    showCtip(`<h5>${esc(h.name)}</h5><div class="kv"><span>CPU usage</span><span>${h.v.toFixed(1)}%</span><span>Service</span><span>${esc(h.svc)}</span><span>Zone</span><span>${esc(h.az)}</span><span>Env</span><span>${esc(h.env)}</span></div>`, pt);
  };
};

    const tm = Math.min(t + colStep / 2, r.end);
    const p50 = svcLat(svc, 0, tm), p95 = svcLat(svc, 1, tm);
    const mu = Math.log(p50), sg = Math.max(.15, Math.log(p95 / p50) / 1.645);
    const total = rps(svc, tm) * Math.min(colStep, r.end - t) / 1000;
    const counts = [];
    for (let b = 0; b < edges.length - 1; b++) {
      const lo = b === 0 ? 1e-6 : edges[b], hi = b === edges.length - 2 ? 1e9 : edges[b + 1];
      const noise = 1 + .12 * (hash2(hashStr(svc + b), Math.floor(t / colStep)) - .5);
      counts.push(Math.max(0, total * (cdf(hi, mu, sg) - cdf(lo, mu, sg)) * noise));
    }
    cols.push({ t0: Math.max(t, r.start), t1: Math.min(t + colStep, r.end), counts });
  }
  return { r, step: colStep, edges, cols };
}

function sloBody() {
  const prodEast = tv().env === "prod" && tv().region === "us-east-1";
  const incidentLive = prodEast && range().end > INCIDENT_T;
  const d = tv().env !== "prod" ? { d7: 99.98, d30: 99.97, d90: 99.96, budget: 71.2, b1: .4, b6: .3 }
    : !prodEast ? { d7: 99.99, d30: 99.98, d90: 99.97, budget: 83.5, b1: .2, b6: .2 }
    : incidentLive ? { d7: 99.86, d30: 99.92, d90: 99.95, budget: 21.6, b1: 14.2, b6: 3.1 } : { d7: 99.94, d30: 99.95, d90: 99.96, budget: 47.9, b1: .8, b6: .6 };
  const bc = d.budget < 25 ? "var(--alert)" : d.budget < 50 ? "var(--warn)" : "var(--ok)";
  const col = (lbl, v) => `<div class="slo-col"><span>${lbl}</span><b class="${v >= 99.9 ? "ok" : "bad"}">${v.toFixed(2)}%</b></div>`;
  return `<div class="slo">
    <div class="slo-top"><b class="num">${d.d30.toFixed(2)}%</b><span class="sub">30-day availability, target 99.90%</span></div>
    <div class="slo-cols">${col("7 days", d.d7)}${col("30 days", d.d30)}${col("90 days", d.d90)}</div>
    <div class="budget"><div class="budget-row"><span>Error budget remaining (30d)</span><b>${d.budget.toFixed(1)}%</b></div>
      <div class="budget-bar"><i style="width:${d.budget}%;background:${bc}"></i></div>
      <div class="budget-row"><span class="muted">${Math.round(43.2 * d.budget / 100)}m of 43m allowed downtime left</span><span class="muted">${d.budget < 25 ? "Burning fast" : "On track"}</span></div></div>
    <div class="burn"><div><span>Burn rate, 1h</span><b class="${d.b1 >= 10 ? "hot" : ""}">${d.b1.toFixed(1)}x</b></div><div><span>Burn rate, 6h</span><b class="${d.b6 >= 6 ? "hot" : ""}">${d.b6.toFixed(1)}x</b></div></div>
  </div>`;
}
function monBody() {
  const end = range().end;
  const ms = MONS.map(m => ({ ...m, st: m.ev(end) }));
  const cnt = k => ms.filter(m => m.st === k).length;
  const order = { alert: 0, warn: 1, nodata: 2, ok: 3 };
  const lbl = { alert: "Alert", warn: "Warn", nodata: "No Data", ok: "OK" };
  const list = ms.filter(m => m.st !== "ok").sort((a, b) => order[a.st] - order[b.st]);
  return `<div class="ms-counts">${["alert", "warn", "nodata", "ok"].map(k => `<div class="ms-c ${k}"><b>${cnt(k)}</b><span><i class="dot ${k}"></i>${lbl[k]}</span></div>`).join("")}</div>
    <div class="ms-list">${list.map(m => `<div class="ms-row"><span class="status ${m.st}">${lbl[m.st]}</span><span class="nm" title="${esc(m.name)}">${esc(m.name)}</span>${avatar(m.owner, "sm")}</div>`).join("") || `<div class="w-empty">All monitors OK</div>`}</div>`;
}
function eventsBody() {
  const evs = eventsIn(range());
  if (!evs.length) return `<div class="w-empty">No events in this time frame</div>`;
  const icon = e => ({
    deploy: `<span class="ev-ic gh-mark">${logo("github")}</span>`,
    k8s: `<span class="ev-ic">${logo("kubernetes")}</span>`,
    aws: `<span class="ev-ic aws-mark">${logo("aws")}</span>`,
    pagerduty: `<span class="ev-ic">${logo("pagerduty")}</span>`,
    alert: `<span class="ev-ic alert">${IC.alert}</span>`,
    ok: `<span class="ev-ic ok">${IC.checkCircle}</span>`,
    incident: `<span class="ev-ic alert">${IC.siren}</span>`,
    watchdog: `<span class="ev-ic brand">${IC.watchdog}</span>`,
  }[e.kind]);
  return `<div class="evs">${evs.map(e => `<div class="ev-row">${icon(e)}<div class="ev-main"><b>${esc(e.title)}</b><span>${esc(e.text)}</span></div><span class="ev-time" data-tip="${esc(fmtFull(e.t, true))}">${esc(fmtAgo(e.t))}</span></div>`).join("")}</div>`;
}

/* ---------- Rendering: nav ---------- */
const NAV = [
  { k: "search", label: "Search", ic: "search" },
  { k: "watchdog", label: "Watchdog", ic: "watchdog" },
  { sep: true },
  { k: "svcmgmt", label: "Service Mgmt", ic: "siren" },
  { k: "infra", label: "Infrastructure", ic: "server" },
  { k: "apm", label: "APM", ic: "apm" },

  { sep: true },
  { k: "integrations", label: "Integrations", ic: "puzzle" },
];

      ${item({ label: "Help", ic: "help" })}
      ${item({ label: "Org Settings", ic: "gear" })}
      <div class="nav-item"><button class="nav-link" data-act="user-menu" data-tip="Naman Shukla" data-tip-nav="1">${`<img class="av" src="${PHOTOS.naman}" alt="">`}<span class="lbl">Naman Shukla</span></button></div>
      <div class="nav-item"><button class="nav-link nav-collapse" data-act="nav-collapse" data-tip="Expand navigation" data-tip-nav="1">${IC.collapse}<span class="lbl">Collapse</span></button></div>
    </div>`;
  $("#mbTitle").innerHTML = `${LOGOS.datadog}<span>Production Overview</span>`;
  $("#mbUser").innerHTML = `<img class="av" src="${PHOTOS.naman}" alt="Naman Shukla">`;
}

/* ---------- Rendering: dashboard ---------- */
function timePickerHTML() {
  const p = PRESETS.find(x => x.k === state.time);
  return `<div class="tp"><button class="tp-btn" data-act="tp-open" aria-haspopup="true">${IC.clock}<span class="tp-badge">${esc(p.badge)}</span><span class="tp-label">${esc(p.label)}</span>${IC.chevDown}</button></div>`;
}
function tvBarHTML() {
  const changed = Object.keys(TV_DEFAULT).some(k => state.tv[k] !== TV_DEFAULT[k]);
  return Object.keys(TV_OPTS).map(k => `<button class="tv${state.tv[k] !== TV_DEFAULT[k] ? " changed" : ""}" data-act="tv-open" data-k="${k}" aria-haspopup="true"><span class="k">${k}</span><span class="v">${esc(state.tv[k])}${IC.chevDown}</span></button>`).join("")
    + (changed ? `<button class="btn ghost sm" data-act="tv-reset">${IC.reset}Reset</button>` : "");
}
function titleHTML(w) { return `${w.logo ? `<span class="w-logo">${LOGOS[w.logo]}</span>` : ""}${esc(w.title())}${w.ctx ? `<span class="ctx">${esc(w.ctx())}</span>` : ""}`; }
function widgetHTML(w) {
  const cls = `w span-${w.span} rows-${w.rows}${w.extra ? " " + w.extra : ""}${w.kind === "note" ? " note-w" : ""}`;
  if (w.kind === "note") return `<section class="${cls}" data-w="${w.id}"><div class="w-body">${w.body()}</div></section>`;
  const body = CHART_KINDS.has(w.kind) ? `<div class="ch" id="ch-${w.id}"></div>` : w.body();
  return `<section class="${cls}" data-w="${w.id}" aria-label="${esc(w.title())}"><div class="w-head"><div class="w-title">${titleHTML(w)}</div><button class="icon-btn w-menu-btn" data-act="w-menu" data-w="${w.id}" aria-label="Widget options">${IC.more}</button></div><div class="w-body">${body}</div></section>`;
}
function renderDashboard() {
  CH.forEach(c => unmountChart(c));
  $("#view").innerHTML = `
    <header class="page-head">
      <div class="page-title">
        <button class="icon-btn star-btn${state.starred ? " on" : ""}" data-act="star" data-tip="${state.starred ? "Remove from favorites" : "Add to favorites"}" aria-pressed="${state.starred}">${IC.star}</button>
        <div class="ttl-wrap"><div class="crumbs">Dashboards ${IC.chevRight.replace('class="i"', 'class="i" style="width:12px;height:12px"')} Platform</div><h1>Casuro Platform - Production Overview</h1></div>
      </div>
      <div class="page-actions"><button class="btn" data-act="share">${IC.share}Share</button><span class="tp-slot" style="display:contents">${timePickerHTML()}</span></div>
    </header>
    <div class="tv-bar" id="tvBar">${tvBarHTML()}</div>
    <main class="dash"><div class="dash-grid">${WIDGETS.map(widgetHTML).join("")}</div></main>`;
  for (const w of WIDGETS) if (CHART_KINDS.has(w.kind)) mountChart($(`#ch-${w.id}`), w.id, w.kind, w.build);
}
// Re-render every data-driven part in place after a time or template variable change
function refreshAll() {
  $$(".tp-slot").forEach(el => { el.innerHTML = timePickerHTML(); });
  const bar = $("#tvBar"); if (bar) bar.innerHTML = tvBarHTML();
  for (const w of WIDGETS) {
    const el = $(`[data-w="${w.id}"]`); if (!el) continue;
    if (w.kind === "note") continue;
    el.querySelector(".w-title").innerHTML = titleHTML(w);
    el.setAttribute("aria-label", w.title());
    if (!CHART_KINDS.has(w.kind)) el.querySelector(".w-body").innerHTML = w.body();
  }
  const fsT = $("#fsTitle"); if (fsT && fsWidget) fsT.innerHTML = titleHTML(fsWidget);
  const fsQ = $("#fsQuery"); if (fsQ && fsWidget) fsQ.textContent = fsWidget.query();
  CH.forEach(c => c.schedule());
}

/* ---------- Time picker ---------- */
function setPreset(k) { state.time = k; closePop(); refreshAll(); }
function openTimePicker(anchor) {
  openPop(anchor, `<div class="tp-pop" role="menu">${PRESETS.map(p => `<button class="opt${state.time === p.k ? " on" : ""}" data-act="tp-preset" data-k="${p.k}" role="menuitemradio" aria-checked="${state.time === p.k}"><span class="tp-badge">${p.badge}</span>${esc(p.label)}</button>`).join("")}</div>`, { align: "end" });
}

/* ---------- Popovers, menus, modal, tooltips, toast ---------- */
let pop = null;
function openPop(anchor, html, opts = {}) {
  closePop();
  const el = document.createElement("div");
  el.className = "pop " + (opts.cls || "");
  el.innerHTML = html;
  $("#popHost").appendChild(el);
  anchor.classList.add("menu-open"); anchor.setAttribute("aria-expanded", "true");
  pop = { el, anchor };
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let x, y;
  if (opts.side === "right") { x = r.right + 8; y = r.bottom - h; }
  else { y = r.bottom + 4; x = opts.align === "end" ? r.right - w : r.left; if (y + h > innerHeight - 8) y = r.top - 4 - h; }
  el.style.left = clamp(x, 8, innerWidth - w - 8) + "px";
  el.style.top = clamp(y, 8, innerHeight - h - 8) + "px";
  return el;
}
function closePop() { if (!pop) return; pop.anchor.classList.remove("menu-open"); pop.anchor.setAttribute("aria-expanded", "false"); pop.el.remove(); pop = null; }
function menuHTML(items) {
  return `<div class="menu" role="menu">${items.map(it => it === "-" ? `<div class="sep"></div>` : it.h ? `<h6>${esc(it.h)}</h6>`
    : `<button class="mi${it.on ? " on" : ""}${it.danger ? " danger" : ""}" role="menuitem" data-act="${it.act}"${Object.entries(it.data || {}).map(([k, v]) => ` data-${k}="${esc(v)}"`).join("")}>${it.ic ? IC[it.ic] : ""}<span>${esc(it.label)}</span>${it.on ? IC.check.replace('class="i"', 'class="i ck"') : ""}</button>`).join("")}</div>`;
}

let fsWidget = null;
function openFullscreen(id) {
  closePop();
  const w = WMAP[id]; fsWidget = w;
  $("#modalHost").innerHTML = `<div class="scrim" data-act="modal-bg"><div class="modal wide" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="fsTitle">
    <div class="modal-head"><h2 id="fsTitle">${titleHTML(w)}</h2><span class="tp-slot" style="display:flex;gap:8px">${timePickerHTML()}</span><button class="icon-btn" data-act="modal-close" aria-label="Close full screen">${IC.x}</button></div>
    <div class="modal-body fs-body"><div class="fs-query" id="fsQuery" title="${esc(w.query())}">${esc(w.query())}</div><div class="ch" id="fsChart"></div></div></div></div>`;
  const build = w.kind === "ts" ? () => ({ ...w.build(), legendTable: true, legend: true }) : w.kind === "hex" ? () => ({ ...w.build(), maxR: 44 }) : w.build;
  mountChart($("#fsChart"), "fs-" + id, w.kind, build, id);
  $("#modalHost .modal").focus();
}
function closeModal() {
  if (!$("#modalHost").innerHTML) return;
  CH.forEach(c => { if (c.id.startsWith("fs-")) unmountChart(c); });
  $("#modalHost").innerHTML = ""; fsWidget = null; hideCtip();
}

const tipEl = $("#tip"); let tipTimer;
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  clearTimeout(tipTimer); tipEl.classList.remove("show");
  if (!t || matchMedia("(hover: none)").matches) return;
  if (t.dataset.tipNav && !(document.getElementById("nav").offsetWidth < 100)) return;
  tipTimer = setTimeout(() => {
    if (!t.isConnected || t.classList.contains("menu-open")) return;
    tipEl.textContent = t.dataset.tip;
    const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x, y;
    if (t.dataset.tipNav) { x = r.right + 8; y = r.top + r.height / 2 - h / 2; }
    else { x = r.left + r.width / 2 - w / 2; y = r.bottom + 6; if (y + h > innerHeight - 4) y = r.top - 6 - h; }
    tipEl.style.left = clamp(x, 4, innerWidth - w - 4) + "px"; tipEl.style.top = clamp(y, 4, innerHeight - h - 4) + "px";
    tipEl.classList.add("show");
  }, 350);
});
document.addEventListener("mousedown", () => { clearTimeout(tipTimer); tipEl.classList.remove("show"); });

function toast(text) {
  const host = $("#toasts"), el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = IC.checkCircle + `<span>${esc(text)}</span>`;
  host.appendChild(el);
  while (host.children.length > 3) host.firstElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, 2600);
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch { /* ignore */ } ta.remove(); } }

function setTheme(th) {
  document.documentElement.dataset.theme = th;
  CH.forEach(c => c.schedule());
}
function userMenuHTML() {
  const th = document.documentElement.dataset.theme;
  return `<div class="um">
    <div class="um-head"><img class="av lg" src="${PHOTOS.naman}" alt=""><div><b>Naman Shukla</b><span>naman@casuro.com</span></div></div>
    <div class="um-org"><span class="org-badge">C</span><div><b>Casuro</b><span>app.datadoghq.com - US1</span></div></div>
    <div class="um-theme"><h6>Theme</h6><div class="seg" role="radiogroup" aria-label="Theme">
      <button class="${th === "light" ? "on" : ""}" data-act="theme" data-v="light" role="radio" aria-checked="${th === "light"}">${IC.sun}Light</button>
      <button class="${th === "dark" ? "on" : ""}" data-act="theme" data-v="dark" role="radio" aria-checked="${th === "dark"}">${IC.moon}Dark</button></div></div>
    ${menuHTML([{ act: "nav-item", data: { name: "Personal Settings" }, ic: "user", label: "Personal Settings" }, { act: "nav-item", data: { name: "Organization Settings" }, ic: "gear", label: "Organization Settings" }, "-", { act: "logout", ic: "logout", label: "Log out" }])}
  </div>`;
}

/* ---------- Actions ---------- */
const mobileMQ = matchMedia("(max-width: 759px)");
function setNavOpen(open) { $("#app").classList.toggle("nav-open", open); }
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  switch (act) {
    case "nav-item":
      closePop(); setNavOpen(false);
      toast(`${a.dataset.name} isn't part of this mockup`);
      break;
    case "nav-open": setNavOpen(true); break;
    case "nav-close": setNavOpen(false); break;
    case "nav-collapse": {
      state.navCollapsed = !state.navCollapsed;
      $("#app").classList.toggle("nav-collapsed", state.navCollapsed);
      a.dataset.tip = state.navCollapsed ? "Expand navigation" : "Collapse navigation";
      a.querySelector(".lbl").textContent = state.navCollapsed ? "Expand" : "Collapse";
      break;
    }
    case "user-menu":
      if (pop && pop.anchor === a) { closePop(); break; }
      openPop(a, userMenuHTML(), mobileMQ.matches || a.id === "mbUser" ? { align: "end" } : { side: "right" });
      break;
    case "theme": setTheme(a.dataset.v); $$(".seg button", pop ? pop.el : document).forEach(b => { b.classList.toggle("on", b.dataset.v === a.dataset.v); b.setAttribute("aria-checked", b.dataset.v === a.dataset.v); }); break;
    case "logout": closePop(); toast("Logged out of Casuro (mockup)"); break;
    case "star": state.starred = !state.starred; a.classList.toggle("on", state.starred); a.dataset.tip = state.starred ? "Remove from favorites" : "Add to favorites"; a.setAttribute("aria-pressed", state.starred); toast(state.starred ? "Added to favorites" : "Removed from favorites"); break;
    case "share": copyText(location.href); toast("Dashboard link copied to clipboard"); break;
    case "tp-open": if (pop && pop.anchor === a) closePop(); else openTimePicker(a); break;
    case "tp-preset": setPreset(a.dataset.k); break;
    case "tv-open": {
      if (pop && pop.anchor === a) { closePop(); break; }
      const k = a.dataset.k;
      openPop(a, menuHTML([{ h: `$${k}` }, ...TV_OPTS[k].map(v => ({ act: "tv-pick", data: { k, v }, label: v, on: state.tv[k] === v }))]));
      break;
    }
    case "tv-pick": state.tv[a.dataset.k] = a.dataset.v; closePop(); refreshAll(); renderNav(); break;
    case "tv-reset": state.tv = { ...TV_DEFAULT }; refreshAll(); renderNav(); break;
    case "w-menu": {
      if (pop && pop.anchor === a) { closePop(); break; }
      const w = WMAP[a.dataset.w], items = [];
      if (CHART_KINDS.has(w.kind)) items.push({ act: "w-fs", data: { w: w.id }, ic: "maximize", label: "View in full screen" });
      items.push({ act: "w-copy", data: { w: w.id }, ic: "copy", label: "Copy query" });
      items.push("-", { act: "w-edit", data: { w: w.id }, ic: "pencil", label: "Edit" });
      openPop(a, menuHTML(items), { align: "end" });
      break;
    }
    case "w-fs": openFullscreen(a.dataset.w); break;
    case "w-copy": closePop(); copyText(WMAP[a.dataset.w].query()); toast("Query copied to clipboard"); break;
    case "w-edit": closePop(); toast("The widget editor isn't part of this mockup"); break;
    case "modal-close": closeModal(); break;
    case "modal-bg": if (e.target === a) closeModal(); break;
    case "lg": {
      const set = hidSet(a.dataset.hid), key = a.dataset.key;
      if (set.has(key)) set.delete(key); else set.add(key);
      CH.forEach(c => { if (c.hidKey === a.dataset.hid) c.schedule(); });
      break;
    }
  }
});
document.addEventListener("pointerdown", e => { if (pop && !pop.el.contains(e.target) && !pop.anchor.contains(e.target)) closePop(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pop) { const a = pop.anchor; closePop(); a.focus(); return; }
  if ($("#modalHost").innerHTML) { closeModal(); return; }
  if ($("#app").classList.contains("nav-open")) setNavOpen(false);
});
window.addEventListener("resize", () => { closePop(); hideCtip(); });
mobileMQ.addEventListener("change", () => setNavOpen(false));
document.addEventListener("scroll", () => hideCtip(), true);

/* ---------- Boot ---------- */
renderNav();
renderDashboard();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => CH.forEach(c => c.schedule()));

</script>
