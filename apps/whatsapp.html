<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp UI Mockup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 viewBox=%220 0 360 362%22%3E%3Cpath fill=%22%2325D366%22 fill-rule=%22evenodd%22 d=%22M307.546 52.566C273.709 18.684 228.706.017 180.756 0 81.951 0 1.538 80.404 1.504 179.235c-.017 31.594 8.242 62.432 23.928 89.609L0 361.736l95.024-24.925c26.179 14.285 55.659 21.805 85.655 21.814h.077c98.788 0 179.21-80.413 179.244-179.244.017-47.898-18.608-92.926-52.454-126.807v-.008Zm-126.79 275.788h-.06c-26.73-.008-52.952-7.194-75.831-20.765l-5.44-3.231-56.391 14.791 15.05-54.981-3.542-5.638c-14.912-23.721-22.793-51.139-22.776-79.286.035-82.14 66.867-148.973 149.051-148.973 39.793.017 77.198 15.53 105.328 43.695 28.131 28.157 43.61 65.596 43.593 105.398-.035 82.149-66.867 148.982-148.982 148.982v.008Zm81.719-111.577c-4.478-2.243-26.497-13.073-30.606-14.568-4.108-1.496-7.09-2.243-10.073 2.243-2.982 4.487-11.568 14.577-14.181 17.559-2.613 2.991-5.226 3.361-9.704 1.117-4.477-2.243-18.908-6.97-36.02-22.226-13.313-11.878-22.304-26.54-24.916-31.027-2.613-4.486-.275-6.91 1.959-9.136 2.011-2.011 4.478-5.234 6.721-7.847 2.244-2.613 2.983-4.486 4.478-7.469 1.496-2.991.748-5.603-.369-7.847-1.118-2.243-10.073-24.289-13.812-33.253-3.636-8.732-7.331-7.546-10.073-7.692-2.613-.13-5.595-.155-8.586-.155-2.991 0-7.839 1.118-11.947 5.604-4.108 4.486-15.677 15.324-15.677 37.361s16.047 43.344 18.29 46.335c2.243 2.991 31.585 48.225 76.51 67.632 10.684 4.615 19.029 7.374 25.535 9.437 10.727 3.412 20.49 2.931 28.208 1.779 8.604-1.289 26.498-10.838 30.228-21.298 3.73-10.46 3.73-19.433 2.613-21.298-1.117-1.865-4.108-2.991-8.586-5.234l.008-.017Z%22 clip-rule=%22evenodd%22/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --app: #fcf5eb;
    --rail: #f0f2f5;
    --panel: #ffffff;
    --head: #f0f2f5;
    --text: #111b21;
    --muted: #667781;
    --icon: #54656f;
    --line: #e9edef;
    --hover: #f5f6f6;
    --active: #f0f2f5;
    --green: #25d366;
    --teal: #00a884;
    --chip: #f0f2f5;
    --chip-on: #d9fdd3;
    --chip-on-text: #008069;
    --wall: #efeae2;
    --doodle: rgba(0,0,0,.055);
    --in: #ffffff;
    --out: #d9fdd3;
    --quote-in: #f5f6f6;
    --quote-out: #d1f4cc;
    --tick: #667781;
    --read: #53bdeb;
    --input: #ffffff;
    --sys: #ffffff;
    --shadow: 0 1px .5px rgba(11,20,26,.13);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --app: #0c1317; --rail: #202c33; --panel: #111b21; --head: #202c33; --text: #e9edef; --muted: #8696a0;
    --icon: #aebac1; --line: #222d34; --hover: #202c33; --active: #2a3942; --chip: #202c33; --chip-on: #0a332c;
    --chip-on-text: #25d366; --wall: #0b141a; --doodle: rgba(255,255,255,.03); --in: #202c33; --out: #005c4b;
    --quote-in: #1d282f; --quote-out: #025144; --tick: #8696a0; --input: #2a3942; --sys: #182229;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--app); color: var(--text); overflow: hidden;
    font: 14.2px/1.4 "Segoe UI", "Helvetica Neue", Helvetica, -apple-system, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* Rail */
  .rail { width: 64px; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
  .rail .sp { flex: 1; }
  .rbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--icon); position: relative; }
  .rbtn:hover { background: rgba(11,20,26,.06); }
  .rbtn.on { background: rgba(11,20,26,.09); color: var(--text); }
  .rbtn .badge { position: absolute; top: 2px; right: 0; }
  .rbtn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .rsep { width: 32px; height: 1px; background: rgba(0,0,0,.08); margin: 6px 0; }

  /* Chat list */
  .side { width: 30%; min-width: 340px; max-width: 460px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side-head { height: 64px; padding: 0 16px 0 20px; display: flex; align-items: center; gap: 8px; flex: none; }
  .side-head h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; color: var(--text); }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--icon); flex: none; }
  .ibtn:hover { background: rgba(11,20,26,.06); }
  .search { margin: 2px 12px 8px; height: 38px; background: var(--chip); border-radius: 20px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: var(--icon); flex: none; }
  .search svg.i { width: 20px; height: 20px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; padding: 0 16px 8px; flex: none; overflow-x: auto; scrollbar-width: none; }
  .chip { padding: 5px 12px; border-radius: 18px; background: var(--chip); color: var(--muted); font-size: 14.5px; white-space: nowrap; }
  .chip:hover { background: #e5e7ea; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 12px; border-radius: 10px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--active); }
  .av { width: 49px; height: 49px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center; background: #dfe5e7; color: #fff; }
  .av.grp { background: #dfe5e7; color: #fff; }
  .av.grp svg { width: 30px; height: 30px; fill: #fff; }
  .row .mid { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--line); gap: 2px; }
  .row:hover .mid, .row.on .mid { border-color: transparent; }
  .l1, .l2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name { flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 12px; color: var(--muted); flex: none; }
  .row.unread .time { color: var(--teal); }
  .prev { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
  .prev span { overflow: hidden; text-overflow: ellipsis; }
  .prev .nm { flex: none; }
  .prev.typing { color: var(--teal); }
  .prev .tk { flex: none; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--green); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .row .flag { width: 18px; height: 18px; color: var(--muted); fill: currentColor; flex: none; }

  /* Conversation */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--wall); }
  .main::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 1;
    background-image:
      radial-gradient(circle at 18px 22px, transparent 5px, var(--doodle) 5.5px, var(--doodle) 6.8px, transparent 7.3px),
      radial-gradient(circle at 78px 64px, transparent 8px, var(--doodle) 8.5px, var(--doodle) 9.8px, transparent 10.3px),
      radial-gradient(circle at 52px 30px, var(--doodle) 2.2px, transparent 2.7px),
      radial-gradient(circle at 30px 84px, var(--doodle) 1.8px, transparent 2.3px),
      radial-gradient(ellipse 10px 6px at 104px 100px, transparent 4px, var(--doodle) 4.5px, var(--doodle) 5.8px, transparent 6.3px);
    background-size: 120px 120px;
  }
  .main > * { position: relative; }
  .conv-head { height: 64px; background: var(--head); display: flex; align-items: center; gap: 12px; padding: 0 16px; flex: none; border-left: 1px solid var(--line); }
  .conv-head .av { width: 40px; height: 40px; }
  .conv-head .av.grp svg { width: 24px; height: 24px; }
  .who { flex: 1; min-width: 0; cursor: pointer; }
  .who b { display: block; font-weight: 400; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { display: none; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px 7% 8px; display: flex; flex-direction: column; }
  .sys { align-self: center; background: var(--sys); color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: var(--shadow); margin: 10px 0; text-transform: uppercase; }
  .enc { align-self: center; max-width: 520px; text-align: center; background: #ffeecd; color: #54656f; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; box-shadow: var(--shadow); margin: 4px 0 8px; }
  .m { display: flex; margin-top: 2px; }
  .m.first { margin-top: 10px; }
  .m.out { justify-content: flex-end; }
  .b { position: relative; max-width: 65%; background: var(--in); border-radius: 7.5px; padding: 6px 7px 8px 9px; box-shadow: var(--shadow); word-wrap: break-word; }
  .m.out .b { background: var(--out); }
  .m.first.in .b { border-top-left-radius: 0; }
  .m.first.out .b { border-top-right-radius: 0; }
  .m.first.in .b::before, .m.first.out .b::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
  .m.first.in .b::before { left: -8px; background: var(--in); clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .m.first.out .b::before { right: -8px; background: var(--out); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .sender { font-size: 12.8px; font-weight: 600; margin-bottom: 2px; }
  .txt { white-space: pre-wrap; }
  .meta { float: right; margin: 8px 0 -6px 10px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; position: relative; top: 4px; }
  .tk { width: 16px; height: 11px; fill: var(--tick); }
  .tk.read { fill: var(--read); }

  .quote { display: flex; flex-direction: column; background: var(--quote-in); border-left: 4px solid var(--qc); border-radius: 6px; padding: 5px 10px 6px 8px; margin: 0 -3px 4px -5px; font-size: 13px; cursor: pointer; }
  .m.out .quote { background: var(--quote-out); }
  .quote b { color: var(--qc); font-weight: 600; font-size: 12.8px; }
  .quote span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
  .b.is-img { padding: 3px 3px 6px; }
  .b.is-img .sender { padding: 3px 6px 0; }
  .b.is-img .txt { display: inline-block; padding: 4px 6px 0; }
  .photo { position: relative; width: 330px; max-width: 100%; height: 220px; border-radius: 6px; overflow: hidden; background: linear-gradient(160deg, #1d2b3a, #0f1a24); }
  .photo .chart { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 120px; display: flex; align-items: flex-end; gap: 10px; }
  .photo .chart i { flex: 1; background: linear-gradient(#25d366, #00a884); border-radius: 3px 3px 0 0; opacity: .75; }
  .photo svg { position: absolute; left: 18px; right: 18px; top: 44px; width: calc(100% - 36px); height: 90px; }
  .photo polyline { fill: none; stroke: #53bdeb; stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-width: 2.5; }
  .photo .ph-t { position: absolute; left: 18px; top: 14px; color: #e9edef; font-size: 12.5px; font-weight: 600; letter-spacing: .2px; }
  .doc { display: flex; align-items: center; gap: 10px; background: rgba(11,20,26,.05); border-radius: 6px; padding: 10px; margin: 0 -3px 0 -5px; width: 320px; max-width: 100%; }
  .pdf { width: 30px; height: 38px; background: #e2493b; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: end center; padding-bottom: 5px; border-radius: 3px; clip-path: polygon(0 0, 70% 0, 100% 22%, 100% 100%, 0 100%); flex: none; }
  .dmeta { flex: 1; min-width: 0; }
  .dmeta b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmeta small { color: var(--muted); font-size: 12px; }
  .doc .dl { width: 34px; height: 34px; border: 1.5px solid var(--muted); color: var(--muted); }
  .doc .dl svg.i { width: 20px; height: 20px; }
  .voice { display: flex; align-items: center; gap: 10px; width: 300px; max-width: 100%; padding: 2px 0 10px; position: relative; }
  .voice img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex: none; }
  .play { color: var(--icon); flex: none; }
  .play svg.i { width: 30px; height: 30px; }
  .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; position: relative; }
  .wave i { flex: 1; background: #b4bec3; border-radius: 2px; min-height: 3px; }
  .wave i.on { background: #53bdeb; }
  .wave .dot { position: absolute; left: 0; width: 12px; height: 12px; border-radius: 50%; background: #53bdeb; transform: translateX(-4px); }
  .voice .dur { position: absolute; left: 100px; bottom: -4px; font-size: 11px; color: var(--muted); }
  .m.has-react { margin-bottom: 14px; }
  .react { position: absolute; left: 8px; bottom: -18px; background: var(--in); border-radius: 12px; box-shadow: 0 1px 3px rgba(11,20,26,.2); padding: 1px 7px; font-size: 13.5px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
  .react span { font-size: 12px; color: var(--muted); margin-left: 3px; }

  /* Composer */
  .comp { min-height: 62px; background: var(--head); display: flex; align-items: center; gap: 8px; padding: 5px 16px; flex: none; }
  .comp .field { flex: 1; min-width: 0; background: var(--input); border-radius: 8px; display: flex; align-items: center; }
  .comp input { flex: 1; min-width: 0; height: 42px; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--text); padding: 0 12px; }
  .comp input::placeholder { color: var(--muted); }
  .send { color: var(--icon); }
  .send.go { color: var(--teal); }

  .b.is-voice .meta, .b.is-doc .meta { position: absolute; right: 8px; bottom: 5px; top: auto; margin: 0; }
  .b.is-doc { padding-bottom: 22px; }

  @media (max-width: 1100px) { .msgs { padding: 12px 4% 8px; } .b { max-width: 80%; } }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .rail { order: 2; width: 100%; height: 60px; flex-direction: row; justify-content: space-around; padding: 0 8px; border-right: 0; border-top: 1px solid var(--line); flex: none; }
    .rail .sp, .rail .rsep { display: none; }
    .side { width: 100%; min-width: 0; max-width: none; flex: 1; min-height: 0; border-right: 0; }
    .main { display: none; }
    body.conv-open .side, body.conv-open .rail { display: none; }
    body.conv-open .main { display: flex; flex: 1; min-height: 0; }
    .back { display: grid; margin-left: -8px; }
    .conv-head { padding: 0 6px 0 8px; gap: 6px; border-left: 0; }
    .conv-head .ibtn[title="Search"] { display: none; }
    .msgs { padding: 10px 12px 8px; }
    .b { max-width: 88%; }
    .photo { width: 260px; height: 180px; }
    .voice { width: 250px; }
    .doc { width: 260px; }
    .comp { padding: 5px 8px; gap: 2px; }
    .enc { font-size: 12px; }
  }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #111b21; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 9; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <section class="side">
    <header class="side-head">
      <h1>Chats</h1>
      <button class="ibtn" data-toast="New chat" title="New chat"><svg class="i" viewBox="0 0 24 24"><path d="M9.53 3.02H3.25v16.5h11.99v-5.34h1.8v5.84c0 .72-.58 1.3-1.3 1.3H2.75c-.72 0-1.3-.58-1.3-1.3V2.52c0-.72.58-1.3 1.3-1.3h6.78v1.8Zm8.9-1.87 3.43 3.42a1 1 0 0 1 0 1.42l-8.9 8.9a1 1 0 0 1-.55.28l-4.08.6a.5.5 0 0 1-.57-.56l.6-4.08a1 1 0 0 1 .28-.56l8.9-8.9a1 1 0 0 1 1.4 0Zm-8.5 9.94-.32 2.23 2.23-.33 7.25-7.25-1.9-1.9-7.26 7.25Z"/></svg></button>
      <button class="ibtn" data-toast="Menu" title="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M12 7a2 2 0 1 0-.01-4.01A2 2 0 0 0 12 7zm0 2a2 2 0 1 0 .01 4.01A2 2 0 0 0 12 9zm0 6a2 2 0 1 0 .01 4.01A2 2 0 0 0 12 15z"/></svg></button>
    </header>
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><path d="M15.9 14.3H15l-.3-.3c1-1.1 1.6-2.7 1.6-4.3 0-3.7-3-6.7-6.7-6.7S3 6 3 9.7s3 6.7 6.7 6.7c1.6 0 3.2-.6 4.3-1.6l.3.3v.8l5.1 5.1 1.5-1.5-5-5.2zm-6.2 0c-2.6 0-4.6-2.1-4.6-4.6s2.1-4.6 4.6-4.6 4.6 2.1 4.6 4.6-2 4.6-4.6 4.6z"/></svg>
      <input id="q" placeholder="Search or start a new chat" autocomplete="off">
    </label>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

function avatar(c, cls = "av") {

function renderRail() {
  const unread = chats.filter(c => c.unread).length;

  $("#rail").innerHTML = b("chats", "Chats", true, unread ? `<span class="badge">${unread}</span>` : "") +
    b("status", "Status") + b("channels", "Channels") + b("communities", "Communities") +
    `<div class="sp"></div><div class="rsep"></div>` + b("settings", "Settings") +
    `<button class="rbtn" data-toast="Profile" title="Profile"><img src="${PHOTOS.naman}" alt=""></button>`;
}

function preview(c) {
  if (c.typing) return `<div class="prev typing"><span>${c.group ? esc(first(c.typing)) + " is " : ""}typing...</span></div>`;
  const m = c.msgs[c.msgs.length - 1];
  const who = m.from === ME ? tick(m.st) : c.group ? `<span class="nm">${esc(first(m.from))}:&nbsp;</span>` : "";
  const body = m.voice ? "🎤 Voice message (" + m.voice + ")" : m.doc ? "📄 " + m.doc.name : m.img ? "📷 " + (m.text || "Photo") : m.text;
  return `<div class="prev">${who}<span>${esc(body)}</span></div>`;
}

function renderList() {
  $("#chips").innerHTML = ["All", "Unread", "Favorites", "Groups"].map(f => `<button class="chip${state.filter === f ? " on" : ""}" data-filter="${f}">${f}</button>`).join("");
  const q = state.q.toLowerCase();
  const list = chats.filter(c =>
    (state.filter === "All" || (state.filter === "Unread" && c.unread) || (state.filter === "Groups" && c.group) || (state.filter === "Favorites" && c.pinned)) &&
    (!q || c.name.toLowerCase().includes(q)));
  $("#list").innerHTML = list.map(c => `
    <div class="row${c.id === state.open ? " on" : ""}${c.unread ? " unread" : ""}" data-open="${c.id}">
      ${avatar(c)}
      <div class="mid">
        <div class="l1"><span class="name">${esc(c.name)}</span><span class="time">${esc(c.time)}</span></div>
        <div class="l2">${preview(c)}
          ${c.muted ? `<svg class="flag" viewBox="0 0 24 24">${ICON.mute}</svg>` : ""}
          ${c.pinned ? `<svg class="flag" viewBox="0 0 24 24">${ICON.pin}</svg>` : ""}
          ${c.unread ? `<span class="badge">${c.unread}</span>` : ""}
        </div>
      </div>
    </div>`).join("") || `<p style="text-align:center;color:var(--muted);padding:24px">No chats found</p>`;
}

function renderMsg(c, m, i) {
  if (m.day) return `<div class="sys">${esc(m.day)}</div>`;
  const prev = c.msgs[i - 1];
  const firstOf = !prev || prev.day || prev.from !== m.from;
  const out = m.from === ME;
  const sender = c.group && !out && firstOf ? `<div class="sender" style="color:${people[m.from].color}">${esc(people[m.from].name)}</div>` : "";
  const meta = `<span class="meta">${esc(m.t)}${out ? tick(m.st) : ""}</span>`;
  let body = "";
  if (m.reply) body += `<div class="quote" style="--qc:${m.reply.from === ME ? "#06cf9c" : people[m.reply.from].color}"><b>${m.reply.from === ME ? "You" : esc(people[m.reply.from].name)}</b><span>${esc(m.reply.text)}</span></div>`;
  if (m.img) body += `<div class="photo"><div class="chart">${[38, 52, 44, 66, 58, 80, 72, 90].map(h => `<i style="height:${h}%"></i>`).join("")}</div><svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="0,32 14,28 28,30 42,20 56,22 70,12 84,14 100,4" /></svg><span class="ph-t">Billing / p95 latency</span></div>`;
  if (m.doc) body += `<div class="doc"><div class="pdf">PDF</div><div class="dmeta"><b>${esc(m.doc.name)}</b><small>${esc(m.doc.meta)}</small></div><button class="ibtn dl" data-toast="Downloading ${esc(m.doc.name)}" title="Download"><svg class="i" viewBox="0 0 24 24"><path d="M12 15.6 7.4 11l1.4-1.4 2.2 2.2V4h2v7.8l2.2-2.2 1.4 1.4L12 15.6zM5 20v-2h14v2H5z"/></svg></button></div>`;
  if (m.voice) body += `<div class="voice"><img src="${PHOTOS[m.from]}" alt=""><button class="play" data-play title="Play"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.1v13.8L19 12 8 5.1z"/></svg></button><div class="wave">${Array.from({ length: 34 }, (_, k) => `<i style="height:${4 + Math.round(Math.abs(Math.sin(k * 1.7) * 14 + Math.sin(k * .5) * 6))}px"></i>`).join("")}<span class="dot"></span></div><small class="dur">${esc(m.voice)}</small></div>`;
  if (m.text) body += `<span class="txt">${esc(m.text)}</span>`;
  const react = m.react ? `<div class="react">${m.react.join("")}<span>${m.rc}</span></div>` : "";
  const kind = m.voice ? " is-voice" : m.img ? " is-img" : m.doc ? " is-doc" : "";
  return `<div class="m ${out ? "out" : "in"}${firstOf ? " first" : ""}${react ? " has-react" : ""}"><div class="b${kind}">${sender}${body}${meta}${react}</div></div>`;
}

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-filter],[data-toast],[data-back]");
  if (!t) return;
  if (t.dataset.open) { const c = chat(t.dataset.open); c.unread = 0; state.open = c.id; state.mobileConv = true; render(); }
  else if (t.dataset.filter) { state.filter = t.dataset.filter; renderList(); }
  else if (t.hasAttribute("data-back")) { state.mobileConv = false; render(); }
  else toast(t.dataset.toast);
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });

// Composer: mic turns into send while typing
document.addEventListener("input", e => {
  if (e.target.id !== "box") return;
  const go = e.target.value.trim().length > 0, b = $("#send");
  b.classList.toggle("go", go); b.title = go ? "Send" : "Voice message";
  b.innerHTML = ic(go ? "sendi" : "mic");
});
document.addEventListener("keydown", e => { if (e.target.id === "box" && e.key === "Enter") send(); });
document.addEventListener("click", e => {
  if (e.target.closest("#send")) $("#box").value.trim() ? send() : toast("Hold to record a voice message");
  const p = e.target.closest("[data-play]");
  if (p) playVoice(p.closest(".voice"));
});

const now = () => new Date().toTimeString().slice(0, 5);
function send() {
  const c = chat(state.open), text = $("#box").value.trim();
  if (!text) return;
  const m = { from: ME, text, t: now(), st: "sent" };
  c.msgs.push(m); c.time = m.t; c.typing = null;
  if (!c.pinned) { chats.splice(chats.indexOf(c), 1); chats.splice(chats.filter(x => x.pinned).length, 0, c); }
  $("#box").value = ""; renderMain(); renderList();
  $("#box").focus();
  const later = (ms, fn) => setTimeout(() => { fn(); if (state.open === c.id) renderMain(false); renderList(); }, ms);
  later(700, () => m.st = "delivered");
  later(1600, () => m.st = "read");
  const who = c.group ? c.members[Math.floor(Math.random() * c.members.length)] : c.dm;
  later(2300, () => { c.typing = who; if (c.dm) c.status = "online"; });
  later(4600, () => {
    c.typing = null;
    const r = { from: who, text: REPLIES[Math.floor(Math.random() * REPLIES.length)], t: now() };
    c.msgs.push(r); c.time = r.t;
    if (state.open !== c.id) c.unread = (c.unread || 0) + 1;
  });
}
const REPLIES = ["Sounds good 👍", "On it!", "Makes sense, let's do that.", "Love it 🙌", "Can we sync after standup?", "Good call, thanks Naman"];

function playVoice(v) {
  if (v.dataset.on) return;
  v.dataset.on = 1;
  const bars = [...v.querySelectorAll(".wave i")], dot = v.querySelector(".dot"), btn = v.querySelector(".play");
  btn.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  let k = 0;
  const tick = setInterval(() => {
    k++;
    bars.forEach((b, j) => b.classList.toggle("on", j < k));
    dot.style.left = (k / bars.length * 100) + "%";
    if (k >= bars.length) {
      clearInterval(tick); delete v.dataset.on; bars.forEach(b => b.classList.remove("on")); dot.style.left = "0";
      btn.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.1v13.8L19 12 8 5.1z"/></svg>';
    }
  }, 120);
}

function render() {
  document.body.classList.toggle("conv-open", state.mobileConv);
  renderRail(); renderList(); renderMain();
}
render();
</script>
