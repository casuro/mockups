<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>macOS Desktop</title>
<link rel="icon" type="image/svg+xml" id="favicon">
<style>
  :root {
    color-scheme: light;
    --text: #1d1d1f; --text-2: #3c3c43; --text-3: rgba(60,60,67,.6); --accent: #0a84ff;
    --bar: rgba(246,246,250,.42); --bar-text: #111; --menu: rgba(242,242,246,.82); --edge: rgba(0,0,0,.12); --line: rgba(255,255,255,.55);
    --sep: rgba(0,0,0,.1); --win: #fff; --title: #ececec; --side: rgba(236,236,240,.9); --field: rgba(0,0,0,.06); --sel: rgba(0,0,0,.08);
    --light-off: #d0d0d2; --dock: rgba(255,255,255,.28); --dock-edge: rgba(255,255,255,.5); --dot: rgba(0,0,0,.7);
    --shadow: 0 22px 70px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.12);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --text: #f5f5f7; --text-2: #d1d1d6; --text-3: rgba(235,235,245,.55);
    --bar: rgba(20,20,26,.38); --bar-text: #fff; --menu: rgba(38,38,44,.8); --edge: rgba(0,0,0,.5); --line: rgba(255,255,255,.12);
    --sep: rgba(255,255,255,.12); --win: #1e1e20; --title: #2c2c2e; --side: rgba(44,44,50,.9); --field: rgba(255,255,255,.1); --sel: rgba(255,255,255,.1);
    --light-off: #4a4a4e; --dock: rgba(30,30,36,.32); --dock-edge: rgba(255,255,255,.16); --dot: rgba(255,255,255,.8);
    --shadow: 0 22px 70px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); background: #1b4fb8; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  input { font: inherit; color: inherit; }
  svg { display: block; }

  .wall { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(90% 70% at 10% 0%, #bfe3ff, transparent 55%), linear-gradient(160deg, #8fd0ff, #4a9cf5 35%, #1d5fd6 65%, #123fa8); }
  .wall i { position: absolute; border-radius: 50%; filter: blur(40px); }
  .wall i:nth-child(1) { width: 140vw; height: 60vh; left: -30vw; top: 28vh; transform: rotate(-14deg); background: linear-gradient(90deg, transparent, rgba(214,240,255,.85) 45%, transparent); }
  .wall i:nth-child(2) { width: 120vw; height: 42vh; left: -10vw; top: 52vh; transform: rotate(-9deg); background: linear-gradient(90deg, transparent, #2d6bff 40%, #6a4cff 75%, transparent); opacity: .75; }
  .wall i:nth-child(3) { width: 90vw; height: 34vh; right: -25vw; top: 8vh; transform: rotate(-22deg); background: linear-gradient(90deg, transparent, #7fe0ff 50%, #fff); opacity: .55; }
  :root[data-theme="dark"] .wall { background: radial-gradient(90% 70% at 10% 0%, #173a7a, transparent 55%), linear-gradient(160deg, #1a3a78, #0f2a66 35%, #0b1d4d 65%, #060d2a); }
  :root[data-theme="dark"] .wall i { opacity: .45; }

  .menubar { position: fixed; inset: 0 0 auto; height: 28px; z-index: 9000; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--bar-text); background: var(--bar); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); }
  .menubar > div { display: flex; align-items: center; min-width: 0; overflow: hidden; }
  .mb { height: 22px; padding: 0 9px; border-radius: 5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 500; }
  .mb svg { width: 17px; height: 17px; }
  .mb.batt svg { width: 25px; height: 12px; }
  .mb.apple svg { width: 14px; height: 17px; margin-top: -2px; }
  .mb.name { font-weight: 700; }
  .mb.open { background: rgba(127,127,127,.28); }
  .clock { font-variant-numeric: tabular-nums; }
  .menu { position: fixed; z-index: 9500; min-width: 210px; padding: 5px; border-radius: 10px; background: var(--menu); backdrop-filter: blur(50px) saturate(1.8); -webkit-backdrop-filter: blur(50px) saturate(1.8); box-shadow: 0 0 0 .5px var(--edge), inset 0 0 0 .5px var(--line), 0 12px 40px rgba(0,0,0,.22); }
  .menu .it { display: flex; width: 100%; height: 22px; align-items: center; padding: 0 10px 0 22px; border-radius: 5px; position: relative; white-space: nowrap; }
  .menu .k { margin-left: auto; padding-left: 24px; color: var(--text-3); }
  .menu .chk::before { content: "\2713"; position: absolute; left: 7px; font-size: 12px; }
  .menu .it:not(.dis):hover { background: var(--accent); color: #fff; }
  .menu .it:not(.dis):hover .k { color: rgba(255,255,255,.85); }
  .menu .dis { color: var(--text-3); }
  .menu hr { border: 0; height: 1px; background: var(--sep); margin: 5px 10px; }

  .icon { position: relative; width: 100%; height: 100%; border-radius: 22.5%; display: grid; overflow: hidden; background: var(--bg, #fff); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.18); }
  .icon svg { width: 100%; height: 100%; }
  .icon.bare { background: none; box-shadow: none; overflow: visible; }
  .icon.bare svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.25)); }

  .dock-wrap { position: fixed; inset: auto 0 6px; z-index: 8000; display: flex; justify-content: center; pointer-events: none; }
  .dock { pointer-events: auto; position: relative; display: flex; align-items: flex-end; padding: 5px; height: 62px; border-radius: 20px; }
  .dock::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--dock); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7); box-shadow: inset 0 0 0 1px var(--dock-edge), 0 0 0 .5px rgba(0,0,0,.18), 0 10px 30px rgba(0,0,0,.18); }
  .ditem { position: relative; width: 54px; height: 50px; padding: 0 2px; transition: transform .15s; }
  .ditem:hover { transform: translateY(-4px); }
  .ditem:active .icon { filter: brightness(.82); }
  .ditem .dot { position: absolute; left: 50%; bottom: -4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--dot); opacity: 0; }
  .ditem.running .dot { opacity: 1; }
  .ditem .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 7px; background: var(--menu); box-shadow: 0 0 0 .5px var(--edge), 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; opacity: 0; pointer-events: none; }
  .ditem:hover .tip { opacity: 1; }
  .dsep { width: 1px; align-self: stretch; margin: 6px 7px; background: var(--sep); }

  .windows { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; border-radius: 14px; background: var(--win); box-shadow: 0 0 0 .5px var(--edge), 0 12px 36px rgba(0,0,0,.16); overflow: hidden; }
  .win.focused { box-shadow: 0 0 0 .5px var(--edge), var(--shadow); }
  .win.opening { animation: winIn .2s cubic-bezier(.2,.8,.3,1); }
  @keyframes winIn { from { transform: scale(.94); opacity: 0; } }
  .win.closing { transition: .16s ease-in; transform: scale(.95); opacity: 0; }
  .win.anim { transition: left .28s, top .28s, width .28s, height .28s; }
  .win.min { transform: translateY(40vh) scale(.08); opacity: 0; pointer-events: none; visibility: hidden; transition: transform .35s cubic-bezier(.5,0,.3,1), opacity .35s, visibility 0s .35s; }
  .win { transition: transform .3s cubic-bezier(.2,.8,.3,1), opacity .3s; }
  .win.max { border-radius: 0; }
  .tbar { height: 30px; flex: none; display: flex; align-items: center; background: var(--title); border-bottom: .5px solid var(--sep); }
  .tbar .tt { position: absolute; left: 90px; right: 90px; text-align: center; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
  .win:not(.focused) .tt { opacity: .55; }
  .lights { display: flex; gap: 8px; padding: 0 13px; height: 100%; align-items: center; z-index: 3; }
  .win.native > .lights { position: absolute; top: 0; left: 6px; height: 52px; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); display: grid; place-items: center; }
  .lights .cl { background: #ff5f57; } .lights .mn { background: #febc2e; } .lights .zm { background: #28c840; }
  .win:not(.focused) .lights:not(:hover) button { background: var(--light-off); }
  .lights svg { width: 8px; height: 8px; opacity: 0; stroke: rgba(0,0,0,.55); fill: none; stroke-width: 1.3; stroke-linecap: round; }
  .lights .zm svg { fill: rgba(0,0,0,.55); stroke: none; }
  .lights:hover svg { opacity: 1; }
  .wbody { flex: 1; min-height: 0; position: relative; }
  .rz { position: absolute; z-index: 5; }
  .rz.s { left: 8px; right: 8px; bottom: 0; height: 6px; cursor: ns-resize; }
  .rz.e { top: 8px; bottom: 8px; right: 0; width: 6px; cursor: ew-resize; }
  .rz.se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .win.max .rz, .win.fixed .rz { display: none; }
  body.busy { cursor: default; }

  .app { position: absolute; inset: 0; display: flex; }
  .side { width: 180px; flex: none; padding: 52px 10px 10px; background: var(--side); border-right: .5px solid var(--sep); overflow: auto; }
  .side h4 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); }
  .side button { display: flex; align-items: center; gap: 8px; width: 100%; height: 26px; padding: 0 8px; border-radius: 6px; text-align: left; }
  .side button.on { background: var(--sel); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: auto; }
  .tb { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: .5px solid var(--sep); }
  .tb h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .nav { display: flex; gap: 10px; color: var(--text-3); }
  .nav svg { width: 15px; height: 15px; }
  .grid { flex: 1; padding: 18px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); align-content: start; gap: 14px 6px; }
  .fi { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
  .fi .fic { width: 62px; height: 56px; padding: 4px; border-radius: 10px; display: grid; place-items: center; }
  .fi .fic .icon { width: 50px; height: 50px; }
  .fi.sel .fic { background: var(--sel); }
  .fi.sel > span:last-child { background: var(--accent); color: #fff; border-radius: 4px; padding: 0 5px; }
  .empty { grid-column: 1 / -1; margin-top: 16%; text-align: center; color: var(--text-3); }
  .status { height: 26px; flex: none; display: grid; place-items: center; font-size: 11px; color: var(--text-3); border-top: .5px solid var(--sep); }
  .url { flex: 1; max-width: 460px; margin: 0 auto; height: 30px; border-radius: 9px; background: var(--field); display: grid; place-items: center; color: var(--text-2); }
  .page { padding: 40px 48px; }
  .page h2 { margin: 0 0 16px; font-size: 20px; }
  .favs { display: grid; grid-template-columns: repeat(auto-fill, 76px); gap: 18px 22px; }
  .fav { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-2); }
  .fav b { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; color: #fff; }
  .notelist button { height: auto; display: block; padding: 7px 10px; }
  .notelist button.on { background: #ffd52e; color: #1d1d1f; }
  .notelist span { display: block; font-size: 12px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed { flex: 1; padding: 24px 32px; outline: 0; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow: auto; user-select: text; -webkit-user-select: text; }
  .ed::first-line { font-weight: 700; font-size: 18px; }
  .term { position: absolute; inset: 0; padding: 6px 10px; overflow: auto; background: var(--win); font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; user-select: text; -webkit-user-select: text; }
  .term pre { margin: 0; font: inherit; white-space: pre-wrap; }
  .term .ln { display: flex; }
  .term input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; padding: 0; }
  .grp { margin: 16px 20px 0; border-radius: 10px; background: var(--field); padding: 2px 12px; }
  .grp .r { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
  .grp .r + .r { border-top: .5px solid var(--sep); }
  .grp .r span { color: var(--text-3); }
  .look { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; margin-left: 14px; font-size: 12px; padding: 6px 0; }
  .look i { width: 62px; height: 40px; border-radius: 7px; box-shadow: 0 0 0 .5px rgba(0,0,0,.25); }
  .look.on i { box-shadow: 0 0 0 3px var(--accent); }
  .about { position: absolute; inset: 0; padding: 40px 24px 20px; display: flex; flex-direction: column; align-items: center; }
  .about .mac { width: 150px; height: 96px; margin-bottom: 16px; border-radius: 8px 8px 3px 3px; background: #111 linear-gradient(160deg, #8fd0ff, #4a9cf5 35%, #1d5fd6 65%, #6a4cff) content-box; padding: 5px 5px 14px; box-shadow: 0 0 0 1px #9a9aa0; }
  .about h2 { margin: 0; font-size: 24px; }
  .about p { margin: 2px 0 14px; color: var(--text-3); font-size: 12px; }
  .about dl { display: grid; grid-template-columns: auto auto; gap: 4px 10px; margin: 0; font-size: 12px; }
  .about dt { text-align: right; font-weight: 600; }
  .about dd { margin: 0; color: var(--text-2); }
  .sleep { position: fixed; inset: 0; z-index: 10000; background: #000; display: grid; place-items: end center; padding-bottom: 14vh; color: rgba(255,255,255,.45); }
  .sleep.out { opacity: 0; transition: opacity .5s; }

  .phone, .home { display: none; }
  @media (max-width: 759px) {
    .menubar, .dock-wrap, .menu { display: none; }
    .phone { display: block; position: fixed; inset: 0; z-index: 5; color: #fff; }
    .pg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 8px; padding: 60px 20px; }
    .pa { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .pa .icon { width: min(62px, 17vw); height: min(62px, 17vw); }
    .win { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0; }
    .win .rz, .win .lights { display: none; }
    .home { display: grid; place-items: center; height: 34px; flex: none; order: 9; border-top: .5px solid var(--sep); }
    .home::after { content: ""; width: 134px; height: 5px; border-radius: 3px; background: var(--text); }
    .side { width: 130px; }
    .tb { padding-left: 14px !important; }
  }
  .tb.pad { padding-left: 86px; }
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="menubar" id="menubar"><div id="mbLeft"></div><div id="mbRight"></div></header>
<div class="phone" id="phone"></div>
<main class="windows" id="windows"></main>
<div class="dock-wrap"><nav class="dock" id="dock" aria-label="Dock"></nav></div>
<script>
const APPLE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 1000"><path fill="currentColor" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>';
const SVG = {
  finder: `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#1f8ef1"/><path d="M54 0H100V100H55C53 86 52 76 52.5 64H44C43.5 48 50 36 54 0Z" fill="#e9f3fd"/><path d="M54 0C50 36 43.5 48 44 64H52.5C52 76 53 86 55 100M31 28V40M69 28V40M21 70C36 82 64 82 79 70" fill="none" stroke="#1b2140" stroke-width="4" stroke-linecap="round"/></svg>`,
  safari: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#1a8cff"/><circle cx="50" cy="50" r="34" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="1 4.34"/><path d="M71 29L54.2 54.2 45.8 45.8Z" fill="#ff3b30"/><path d="M29 71L54.2 54.2 45.8 45.8Z" fill="#fff"/></svg>`,
  notes: `<svg viewBox="0 0 100 100"><rect width="100" height="28" fill="#fdd22e"/><path d="M14 46H86M14 60H86M14 74H86" stroke="#d6d6da" stroke-width="2"/></svg>`,
  terminal: `<svg viewBox="0 0 100 100"><rect x="10" y="14" width="80" height="72" rx="8" fill="#111" stroke="#48484c" stroke-width="2"/><path d="M24 38L36 48 24 58M40 60H56" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  settings: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="33" fill="none" stroke="#5c5c61" stroke-width="10" stroke-dasharray="6.9 6.92"/><circle cx="50" cy="50" r="25" fill="#d1d1d6" stroke="#6e6e73" stroke-width="8"/><circle cx="50" cy="50" r="9" fill="#7c7c81"/></svg>`,
  trash: `<svg viewBox="0 0 100 100"><path d="M20 20L27 92Q28 98 35 98H65Q72 98 73 92L80 20Z" fill="#e3e5ea" stroke="#9aa0aa" stroke-width="1.3"/><path d="M30 26L35 92M40 26L42.5 92M50 26V92M60 26L57.5 92M70 26L65 92" stroke="#9aa0aa" stroke-width="1.3"/><ellipse cx="50" cy="20" rx="31" ry="7" fill="#f4f5f7" stroke="#8d929c" stroke-width="1.4"/></svg>`,
  folder: `<svg viewBox="0 0 100 80"><path d="M4 12a6 6 0 0 1 6-6h24l8 8h48a6 6 0 0 1 6 6v6H4z" fill="#3a9bf0"/><rect x="4" y="22" width="92" height="54" rx="6" fill="#62b5ff"/></svg>`,
};

const APPS = [
  ["finder", "Finder", "transparent"],
  ["safari", "Safari", "linear-gradient(#fff, #e8e8ed)"],
  ["notes", "Notes", "#fff"],
  ["terminal", "Terminal", "linear-gradient(#4a4a4e, #1c1c1e)"],
  ["settings", "System Settings", "linear-gradient(#e5e5ea, #a1a1a6)"],
].map(([id, name, bg]) => ({ id, name, bg }));
const APP = Object.fromEntries(APPS.map(a => [a.id, a]));
const ME = { name: "Naman Shukla", org: "Casuro" };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
$("#favicon").href = "data:image/svg+xml," + encodeURIComponent(APPLE.replace("currentColor", "#1d1d1f"));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = a => `<span class="icon" style="--bg:${a.bg}">${SVG[a.id]}</span>`;

const dock = $("#dock");
const dockItem = (a, extra = "") => `<button class="ditem${extra}" data-app="${a.id}" aria-label="${esc(a.name)}">${icon(a)}<span class="tip">${esc(a.name)}</span><span class="dot"></span></button>`;
dock.innerHTML = APPS.map((a, i) => dockItem(a, i ? "" : " running")).join("") +
  `<span class="dsep"></span><button class="ditem" data-app="trash" aria-label="Trash"><span class="icon bare">${SVG.trash}</span><span class="tip">Trash</span><span class="dot"></span></button>`;
dock.addEventListener("click", e => { const b = e.target.closest(".ditem"); if (b) openApp(b.dataset.app); });

const dockBtn = id => $(`.ditem[data-app="${id}"]`, dock);
function syncRunning() { for (const a of APPS) dockBtn(a.id).classList.toggle("running", a.id === "finder" || [...wins.values()].some(w => w.app === a)); }

const layer = $("#windows");
const wins = new Map(); // key -> { key, el, app, min, max, prev }
let zTop = 20, cascade = 0, focusedKey = null;
const workArea = () => ({ x: 0, y: 28, w: innerWidth, h: innerHeight - dock.getBoundingClientRect().height - 42 });
const LIGHTS = `<div class="lights">
  <button class="cl" aria-label="Close"><svg viewBox="0 0 8 8"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5"/></svg></button>
  <button class="mn" aria-label="Minimize"><svg viewBox="0 0 8 8"><path d="M1.2 4h5.6"/></svg></button>
  <button class="zm" aria-label="Zoom"><svg viewBox="0 0 8 8"><path d="M1.5 6.5V2.6l3.9 3.9zM6.5 1.5v3.9L2.6 1.5z"/></svg></button>
</div>`;
const RZ = ["e", "s", "se"].map(d => `<div class="rz ${d}" data-rz="${d}"></div>`).join("");
const place = (el, r) => Object.assign(el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
const rectOf = el => ({ x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });

function createWindow(key, app, content, opts = {}) {
  const wa = workArea(), step = 26, n = cascade++ % 6;
  const w = Math.min(opts.w || 820, wa.w - 60), h = Math.min(opts.h || 520, wa.h - 20);
  const x = Math.max(8, Math.round((wa.w - w) / 2 - 2.5 * step + n * step));
  const y = Math.min(Math.max(wa.y + 8, Math.round(wa.y + (wa.h - h) / 2 - 2.5 * step + n * step)), wa.y + wa.h - h);
  const el = document.createElement("section");
  el.className = "win opening" + (opts.native ? " native" : "") + (opts.fixed ? " fixed" : "");
  el.setAttribute("aria-label", opts.title || app.name);
  el.innerHTML = opts.native
    ? `${LIGHTS}<div class="wbody">${content}</div>${RZ}<button class="home" aria-label="Home"></button>`
    : `<div class="tbar">${LIGHTS}<span class="tt">${esc(opts.title || app.name)}</span></div><div class="wbody">${content}</div>${RZ}<button class="home" aria-label="Home"></button>`;
  place(el, { x, y, w, h });
  layer.appendChild(el);
  el.addEventListener("animationend", () => el.classList.remove("opening"), { once: true });
  const W = { key, el, app, min: false, max: false, prev: null, title: opts.title || app.name };
  wins.set(key, W);
  wire(W);
  focusWin(key);
  syncRunning();
  return W;
}

function wire(W) {
  const { el } = W;
  el.addEventListener("pointerdown", () => focusWin(W.key), true);
  $(".cl", el).onclick = () => closeWin(W.key);
  $(".mn", el).onclick = () => minimizeWin(W.key);
  $(".zm", el).onclick = () => zoomWin(W.key);
  $(".home", el).onclick = () => minimizeWin(W.key);
  for (const bar of $$(".tbar, [data-drag]", el)) {
    bar.addEventListener("dblclick", e => { if (!e.target.closest("button, input, .lights")) zoomWin(W.key); });
    bar.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest("button, input, .lights") || W.max || innerWidth < 760) return;
      const sx = e.clientX, sy = e.clientY;
      const r = rectOf(el);
      let moved = false;
      drag(e, ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 3) return;
        moved = true;
        place(el, { ...r, x: r.x + dx, y: Math.min(Math.max(28, r.y + dy), innerHeight - 60) });
      });
    });
  }
  $$(".rz", el).forEach(h => h.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    const d = h.dataset.rz, sx = e.clientX, sy = e.clientY, r = rectOf(el), MINW = 360, MINH = 220;
    drag(e, ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy, n = { ...r };
      if (d.includes("e")) n.w = Math.max(MINW, r.w + dx);
      if (d.includes("s")) n.h = Math.max(MINH, r.h + dy);
      place(el, n);
    }, getComputedStyle(h).cursor);
  }));
}

function drag(e, move, cursor) {
  e.preventDefault();
  document.body.classList.add("busy");
  if (cursor) document.body.style.cursor = cursor;
  const up = () => { document.body.classList.remove("busy"); document.body.style.cursor = ""; removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
}

function focusWin(key) {
  const W = wins.get(key); if (!W) return;
  if (focusedKey !== key) W.el.style.zIndex = ++zTop;
  focusedKey = key;
  for (const o of wins.values()) o.el.classList.toggle("focused", o.key === key);
  renderMenubar();
}
function refocus() {
  const t = [...wins.values()].filter(w => !w.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
  if (t) focusWin(t.key);
  else { focusedKey = null; for (const o of wins.values()) o.el.classList.remove("focused"); renderMenubar(); }
}
function closeWin(key) {
  const W = wins.get(key); if (!W) return;
  wins.delete(key);
  W.el.classList.add("closing");
  setTimeout(() => W.el.remove(), 170);
  syncRunning();
  if (focusedKey === key) refocus();
}
function minimizeWin(key) {
  const W = wins.get(key); if (!W || W.min) return;
  W.min = true;
  W.el.classList.add("min");
  refocus();
}
function restoreWin(key) {
  const W = wins.get(key); if (!W) return;
  W.min = false;
  W.el.classList.remove("min");
  focusWin(key);
}
function zoomWin(key) {
  const W = wins.get(key); if (!W || W.el.classList.contains("fixed")) return;
  const el = W.el;
  el.classList.add("anim");
  if (W.max) { W.max = false; el.classList.remove("max"); place(el, W.prev); }
  else { W.prev = rectOf(el); W.max = true; place(el, workArea()); }
  setTimeout(() => el.classList.remove("anim"), 300);
  focusWin(key);
}
addEventListener("resize", () => { for (const W of wins.values()) if (W.max) place(W.el, workArea()); });
</script>
<script>
const I = {
  cc: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4" width="15" height="5" rx="2.5"/><circle cx="6" cy="6.5" r="1.4" fill="currentColor"/><rect x="2.5" y="11" width="15" height="5" rx="2.5"/><circle cx="14" cy="13.5" r="1.4" fill="currentColor"/></svg>`,
  wifi: `<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 15.6a1.5 1.5 0 1 1 0 .01zM5.7 11.7a6.1 6.1 0 0 1 8.6 0l-1.3 1.3a4.3 4.3 0 0 0-6 0zM3 9a9.9 9.9 0 0 1 14 0l-1.3 1.3a8.1 8.1 0 0 0-11.4 0zM.4 6.3a13.6 13.6 0 0 1 19.2 0L18.3 7.6a11.8 11.8 0 0 0-16.6 0z"/></svg>`,
  batt: `<svg viewBox="0 0 27 13" fill="none"><rect x=".6" y=".6" width="22.8" height="11.8" rx="3.4" stroke="currentColor" stroke-opacity=".45" stroke-width="1.1"/><rect x="2.2" y="2.2" width="16.9" height="8.6" rx="2" fill="currentColor"/><path d="M24.8 4.4v4.2c.9-.3 1.5-1.1 1.5-2.1s-.6-1.8-1.5-2.1z" fill="currentColor" fill-opacity=".45"/></svg>`,
  back: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>`,
  fwd: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>`,
};
$("#mbRight").innerHTML = `<span class="mb batt">87%${I.batt}</span><span class="mb">${I.wifi}</span>
  <button class="mb" data-menu="cc" aria-label="Control Center">${I.cc}</button><span class="mb clock" id="clock"></span>`;
const focused = () => focusedKey ? wins.get(focusedKey) : null;
const dark = () => document.documentElement.dataset.theme === "dark";
function renderMenubar() {
  const W = focused();
  $("#mbLeft").innerHTML = `<button class="mb apple" data-menu="apple" aria-label="Apple menu">${APPLE}</button>
    <button class="mb name" data-menu="app">${esc(W ? W.app.name : "Finder")}</button>
    ${["File", "Window"].map(m => `<button class="mb" data-menu="${m.toLowerCase()}">${m}</button>`).join("")}`;
}
function tick() {
  const d = new Date(), t = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  $("#clock").textContent = `${d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).replace(",", "")}  ${t}`;
}

function menuItems(name) {
  const W = focused(), a = W?.app || APP.finder, on = W ? "" : "dis";
  return {
    apple: [["About This Mac", "", about], "-", ["System Settings...", "", () => openApp("settings")], "-", ["Sleep", "", sleep], ["Lock Screen", "⌃⌘Q", sleep]],
    app: [[`Hide ${a.name}`, "⌘H", () => W && minimizeWin(W.key), on], ["Show All", "", showAll], "-", [`Quit ${a.name}`, "⌘Q", () => { for (const o of [...wins.values()]) if (o.app === a) closeWin(o.key); }, W && a.id !== "finder" ? "" : "dis"]],
    file: [["New Finder Window", "⌘N", () => finder(true)], ["Close Window", "⌘W", () => W && closeWin(W.key), on]],
    window: [["Minimize", "⌘M", () => W && minimizeWin(W.key), on], ["Zoom", "", () => W && zoomWin(W.key), on], ["Bring All to Front", "", showAll], ...(wins.size ? ["-"] : []), ...[...wins.values()].map(o => [o.title, "", () => restoreWin(o.key), o.key === focusedKey ? "chk" : ""])],
    cc: [["Wi-Fi: Casuro", "", null, "dis"], ["Dark Mode", "", toggleTheme, dark() ? "chk" : ""]],
  }[name];
}
let openMenu = null;
function closeMenus() { if (openMenu) { openMenu.el.remove(); openMenu.btn.classList.remove("open"); openMenu = null; } }
function showMenu(btn) {
  closeMenus();
  const items = menuItems(btn.dataset.menu), el = document.createElement("div");
  el.className = "menu"; el.setAttribute("role", "menu");
  el.innerHTML = items.map((m, i) => m === "-" ? "<hr>" : `<button class="it ${m[3] || ""}" data-i="${i}" role="menuitem"><span>${esc(m[0])}</span>${m[1] ? `<span class="k">${m[1]}</span>` : ""}</button>`).join("");
  el.onclick = e => {
    const b = e.target.closest(".it"); if (!b || b.classList.contains("dis")) return;
    const fn = items[b.dataset.i][2]; closeMenus(); fn && fn();
  };
  document.body.appendChild(el);
  const r = btn.getBoundingClientRect();
  el.style.top = r.bottom + 4 + "px";
  el.style.left = Math.max(6, Math.min(r.left, innerWidth - el.offsetWidth - 6)) + "px";
  btn.classList.add("open");
  openMenu = { btn, el };
}
$("#menubar").onclick = e => {
  const b = e.target.closest("[data-menu]"); if (!b) return;
  openMenu?.btn === b ? closeMenus() : showMenu(b);
};
$("#menubar").onmouseover = e => { const b = e.target.closest("[data-menu]"); if (b && openMenu && openMenu.btn !== b) showMenu(b); };
document.addEventListener("pointerdown", e => { if (openMenu && !e.target.closest(".menu, .mb")) closeMenus(); });

function toggleTheme() {
  document.documentElement.dataset.theme = dark() ? "light" : "dark";
  for (const W of wins.values()) W.refresh?.();
}
function showAll() { for (const o of wins.values()) if (o.min) restoreWin(o.key); }
function sleep() {
  closeMenus();
  const el = document.createElement("div"); el.className = "sleep";
  el.innerHTML = `<span>Click or press any key to wake</span>`;
  const wake = () => { removeEventListener("keydown", wake, true); el.classList.add("out"); setTimeout(() => el.remove(), 500); };
  setTimeout(() => { el.onclick = wake; addEventListener("keydown", wake, true); }, 500);
  document.body.appendChild(el);
}

addEventListener("keydown", e => {
  if (e.key === "Escape") return closeMenus();
  if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey) return;
  const W = focused(), k = e.key.toLowerCase();
  if (k === "w" && W) { e.preventDefault(); closeWin(W.key); }
  else if (k === "m" && W) { e.preventDefault(); minimizeWin(W.key); }
  else if (k === "n") { e.preventDefault(); finder(true); }
});
</script>
<script>
function openApp(id) {
  closeMenus();
  if (id === "finder" || id === "trash") return finder(id === "trash" ? "trash" : null);
  const ex = [...wins.values()].find(w => w.app.id === id);
  if (ex) return restoreWin(ex.key);
  ({ safari, notes, terminal, settings })[id]();
}

const PLACES = { recent: "Recents", apps: "Applications", desk: "Desktop", docs: "Documents", down: "Downloads", trash: "Trash" };
const FILES = { recent: ["Q4 Roadmap", "Screenshots"], apps: APPS.map(a => a.id), desk: ["Screenshots"], docs: ["Casuro", "Contracts", "Q4 Roadmap", "Receipts"], down: ["Invoices"], trash: [] };
let finderSeq = 0;
function finder(where) {
  const ex = [...wins.values()].find(w => w.app.id === "finder");
  if (ex && where !== true) { restoreWin(ex.key); if (where) setPlace(ex, where); return; }
  const W = createWindow("finder" + ++finderSeq, APP.finder, `<div class="app"><aside class="side" data-drag><h4>Favorites</h4>${Object.entries(PLACES).map(([k, n]) => (k === "trash" ? "<h4>Locations</h4>" : "") + `<button data-place="${k}">${n}</button>`).join("")}</aside>
    <div class="main"><div class="tb" data-drag><span class="nav">${I.back}${I.fwd}</span><h3></h3></div><div class="grid"></div><div class="status"></div></div></div>`, { w: 740, h: 440, native: true });
  const app = $(".app", W.el);
  app.onclick = e => {
    const p = e.target.closest("[data-place]"); if (p) return setPlace(W, p.dataset.place);
    $$(".fi.sel", app).forEach(x => x.classList.remove("sel"));
    e.target.closest(".fi")?.classList.add("sel");
  };
  app.ondblclick = e => { const f = e.target.closest(".fi"); if (f && APP[f.dataset.id]) openApp(f.dataset.id); };
  setPlace(W, typeof where === "string" ? where : "docs");
}
function setPlace(W, place) {
  const list = FILES[place];
  W.place = place; W.title = PLACES[place];
  $$(".side button", W.el).forEach(b => b.classList.toggle("on", b.dataset.place === place));
  $("h3", W.el).textContent = W.title;
  $(".grid", W.el).innerHTML = list.map(f => `<button class="fi" data-id="${f}"><span class="fic">${APP[f] ? icon(APP[f]) : SVG.folder}</span><span>${esc(APP[f]?.name || f)}</span></button>`).join("") || `<div class="empty">${place === "trash" ? "Trash is empty" : "No items"}</div>`;
  $(".status", W.el).textContent = `${list.length} item${list.length === 1 ? "" : "s"}, 412.6 GB available`;
}

function safari() {
  const favs = [["Casuro", "#1d1d1f"], ["Apple", "#8e8e93"], ["GitHub", "#24292f"], ["Figma", "#a259ff"]];
  createWindow("safari", APP.safari, `<div class="main"><div class="tb pad" data-drag><span class="nav">${I.back}${I.fwd}</span><div class="url">casuro.com</div></div>
    <div class="page"><h2>Favorites</h2><div class="favs">${favs.map(([n, c]) => `<span class="fav"><b style="background:${c}">${n[0]}</b>${n}</span>`).join("")}</div></div></div>`, { w: 860, h: 520, native: true });
}

const NOTES = [
  "Q4 planning\n\n- Ship the desktop mockups\n- Hire two engineers\n- Customer interviews every week",
  "Interview loop\n\nSystem design, then a pairing session.",
  "Groceries\n\nCoffee beans, oat milk, bananas",
];
function notes() {
  const W = createWindow("notes", APP.notes, `<div class="app"><aside class="side notelist" data-drag></aside><div class="ed" contenteditable="true" spellcheck="false"></div></div>`, { w: 700, h: 440, native: true });
  const list = $(".side", W.el), ed = $(".ed", W.el);
  let cur = 0;
  const draw = () => {
    list.innerHTML = NOTES.map((n, i) => { const [t, , ...b] = n.split("\n"); return `<button data-i="${i}" class="${i === cur ? "on" : ""}"><b>${esc(t || "New Note")}</b><span>${esc(b.join(" ") || "No additional text")}</span></button>`; }).join("");
  };
  list.onclick = e => { const b = e.target.closest("button"); if (b) { cur = +b.dataset.i; ed.textContent = NOTES[cur]; draw(); } };
  ed.oninput = () => { NOTES[cur] = ed.innerText; draw(); };
  ed.textContent = NOTES[0]; draw();
}

function terminal() {
  const W = createWindow("terminal", APP.terminal, `<div class="term"><pre>Last login: ${new Date().toDateString()} on ttys000\n</pre><div class="ln"><span></span><input aria-label="Command" spellcheck="false" autocomplete="off"></div></div>`, { w: 600, h: 360, title: "naman - -zsh - 80x24" });
  const out = $("pre", W.el), inp = $("input", W.el), PS1 = "naman@MacBook-Pro ~ % ";
  const RUN = { pwd: "/Users/naman", whoami: "naman", ls: "Desktop    Documents  Downloads  Projects", help: "Try: ls, pwd, whoami, date, echo, clear" };
  $(".ln span", W.el).textContent = PS1;
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    const [cmd, ...rest] = inp.value.trim().split(/\s+/);
    const r = !cmd ? "" : cmd === "echo" ? rest.join(" ") : cmd === "date" ? new Date().toString() : RUN[cmd] ?? `zsh: command not found: ${cmd}`;
    out.textContent = cmd === "clear" ? "" : out.textContent + PS1 + inp.value + "\n" + (r && r + "\n");
    inp.value = "";
    $(".term", W.el).scrollTop = 1e9;
  };
  $(".term", W.el).onclick = () => inp.focus();
  inp.focus();
}

function settings() {
  const W = createWindow("settings", APP.settings, `<div class="main"><div class="tb pad" data-drag><h3>Appearance</h3></div><div class="grp"></div></div>`, { w: 560, h: 340, native: true, title: "System Settings" });
  W.refresh = () => {
    const th = document.documentElement.dataset.theme;
    $(".grp", W.el).innerHTML = `<div class="r">Appearance<span>${[["light", "#f2f2f7"], ["dark", "#1c1c1e"]].map(([k, c]) => `<button class="look${th === k ? " on" : ""}" data-look="${k}"><i style="background:${c}"></i>${k === "light" ? "Light" : "Dark"}</button>`).join("")}</span></div>` +
      [["Wi-Fi", "Casuro"], ["Bluetooth", "On"], ["Account", ME.name], ["macOS", "Tahoe 26.0"]].map(([a, b]) => `<div class="r">${a}<span>${b}</span></div>`).join("");
  };
  $(".grp", W.el).onclick = e => { const l = e.target.closest("[data-look]"); if (l && l.dataset.look !== document.documentElement.dataset.theme) toggleTheme(); };
  W.refresh();
}

function about() {
  if (wins.has("about")) return restoreWin("about");
  const W = createWindow("about", { id: "about", name: "Finder" }, `<div class="about" data-drag><div class="mac"></div><h2>MacBook Pro</h2><p>14-inch, 2024</p>
    <dl><dt>Chip</dt><dd>Apple M4 Pro</dd><dt>Memory</dt><dd>24 GB</dd><dt>macOS</dt><dd>Tahoe 26.0</dd><dt>User</dt><dd>${ME.name}</dd></dl></div>`, { w: 280, h: 360, native: true, fixed: true, title: "About This Mac" });
  place(W.el, { x: Math.round((innerWidth - 280) / 2), y: Math.round(innerHeight * .15), w: 280, h: 360 });
}

$("#phone").innerHTML = `<div class="pg">${APPS.map(a => `<button class="pa" data-app="${a.id}">${icon(a)}${a.name.replace("System ", "")}</button>`).join("")}</div>`;
$("#phone").onclick = e => { const b = e.target.closest(".pa"); if (b) openApp(b.dataset.app); };

renderMenubar();
tick(); setInterval(tick, 1000);
</script>
